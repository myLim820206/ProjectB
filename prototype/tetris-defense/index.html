<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Defense</title>
<style>
  :root { --bg:#06060b; --fg:#cfd8e6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{display:block;width:100%;max-width:1000px;max-height:calc(100% - 80px);object-fit:contain;touch-action:none}
  #touch{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  #touch button{font:600 18px/1 "DejaVu Sans Mono",monospace;color:#cfd8e6;background:transparent;border:1px solid rgba(127,214,255,.45);border-radius:6px;min-width:52px;height:48px;touch-action:manipulation}
  #touch button:active{background:rgba(127,214,255,.15)}
  #touch button:focus-visible{outline:2px solid #7fd6ff}
  @media (pointer: coarse){ #touch{display:flex} }
</style>
</head>
<body>
<canvas id="c" width="1000" height="700"></canvas>
<div id="touch" aria-label="터치 조작">
  <button id="tLeft" data-a="left" aria-label="왼쪽">◀</button>
  <button id="tRight" data-a="right" aria-label="오른쪽">▶</button>
  <button id="tRot" data-a="rot" aria-label="회전">⟳</button>
  <button id="tDown" data-a="down" aria-label="빠르게">▼</button>
  <button id="tDrop" data-a="drop" aria-label="떨어뜨리기">⤓</button>
  <button id="tHold" data-a="hold" aria-label="보관">H</button>
</div>
<script>
'use strict';
// =====================================================================
// 테트리스 디펜스 웹 프로토타입
// 블록은 위에서 떨어지고, 적은 하늘에서 떨어져 블록 위를 걷고 구멍으로
// 바닥(핵)까지 파고든다. 처치 수단은 깔아뭉개기와 포탑. 포탑은 테트리스
// 행동(여러 줄 지우기, T 스핀, 콤보, 판 비우기)으로 생성하고 강화한다.
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1000, H = 700;
const COLS = 10, ROWS = 20, CELL = 30, OX = 350, OY = 50;
const COLOR = { I:'#7fd6ff', O:'#ffd96a', T:'#c890ff', S:'#9cffb0', Z:'#ff8a7a', L:'#ffb36a', J:'#6a9cff', X:'#9aa0b0',
  V:'#d8f4ff', R:'#fff0a0', P:'#c4ff6a', A:'#ff9a50' }; // V~A: 합성 포탑
const ATTR_NAME = { I:'빙결', O:'번개', T:'관통', S:'독', Z:'화염', L:'폭발', J:'저격' };
const ATTR_DESC = { I:'느리게', O:'연쇄 2', T:'꿰뚫기', S:'지속 피해', Z:'작은 범위', L:'큰 범위', J:'먼 적 한 발' };
const HYBRID_NAME = { V:'증기', R:'레일건', P:'역병', A:'포격' };
const HYBRID_DESC = { V:'범위 + 감속', R:'일직선 전부', P:'범위 + 독', A:'먼 적 큰 범위' };
const KIND_NAME = { ...ATTR_NAME, ...HYBRID_NAME };
// 합성 규칙: 같은 줄에서 함께 지워지면 새 포탑이 된다
const RECIPES = [['I', 'Z', 'V'], ['O', 'T', 'R'], ['S', 'L', 'P'], ['J', 'L', 'A']];
const BASE = {
  I:[[0,1],[1,1],[2,1],[3,1]], O:[[1,0],[2,0],[1,1],[2,1]], T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]],
};
// 회전 상태는 좌표를 돌려서 만든다. 칸 순서가 유지되어 포탑 칸 번호가 회전해도 같다.
const SHAPES = {};
for (const t in BASE) {
  const n = t === 'I' ? 4 : 3; let cur = BASE[t]; SHAPES[t] = [cur];
  // O는 칸 배치는 같지만 칸 순서를 시계 방향으로 돌려서, 회전하면 포탑 칸이 옮겨 가게 한다
  for (let r = 1; r < 4; r++) { cur = t === 'O' ? cur.map(([x, y]) => [2 - y, x - 1]) : cur.map(([x, y]) => [n - 1 - y, x]); SHAPES[t].push(cur); }
}
const KICKS = [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,1]];

const ENEMY = {
  grunt:  { name:'낙하병', hp:30,  fall:.09, walk:.40, col:'#ff8a7a', solid:false, crush:true,  core:1, atk:8 },
  chute:  { name:'낙하산', hp:20,  fall:.45, walk:.40, col:'#ffd96a', solid:false, crush:true,  core:1, atk:6 },
  bomb:   { name:'폭탄',   hp:25,  fall:.09, walk:.50, col:'#ffb36a', solid:false, crush:true,  core:1, atk:0 },
  digger: { name:'굴착',   hp:40,  fall:.09, walk:.50, col:'#ff6ad5', solid:false, crush:true,  core:1, atk:14 },
  ghost:  { name:'유령',   hp:25,  fall:1.4, walk:9,   col:'#b8c4ff', solid:false, crush:false, core:1, atk:0 },
  shield: { name:'방패병', hp:90,  fall:.09, walk:.55, col:'#e8f0ff', solid:true,  crush:false, core:2, atk:12 },
  spider: { name:'거미',   hp:25,  fall:.09, walk:.30, col:'#9cffb0', solid:false, crush:true,  core:1, atk:6 },
  boss:   { name:'보스',   hp:340, fall:.12, walk:.80, col:'#ff4fa8', solid:true,  crush:false, core:5, atk:35, size:2 },
};
const UNLOCK = [['grunt',1],['chute',2],['bomb',3],['digger',4],['spider',5],['shield',6],['ghost',7]];

// ---------------------------------------------------------------- 상태
let S;
function newGame() {
  S = {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    bag: [], next: [], hold: null, canHold: true, piece: null,
    dropT: 0, lockT: 0, lockMoves: 0, lastRotate: false, webT: 0,
    enemies: [], warnings: [], fx: [], texts: [], beams: [],
    wave: 1, toSpawn: 0, spawnT: 0, breakT: 3, waveActive: false,
    core: 20, score: 0, lines: 0, kills: 0, combo: -1, gauge: 0, crushes: 0, ironNext: false,
    merges: 0, fusions: 0, carry: [], over: false, paused: false, started: S ? true : false, time: 0, bossAlive: false,
  };
  for (let i = 0; i < 3; i++) S.next.push(makePiece());
  spawnPiece();
}
function fromBag() {
  if (!S.bag.length) { S.bag = Object.keys(BASE); for (let i = S.bag.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.bag[i], S.bag[j]] = [S.bag[j], S.bag[i]]; } }
  return S.bag.pop();
}
function makePiece() {
  const t = fromBag();
  return { t, c: t, turrets: [{ kind: t, lvl: 1, idx: Math.random() * 4 | 0 }], iron: false };
}
const turretHp = l => 40 + 25 * l;
// 줄 지우기로 넘어온 포탑을 다음 블록부터 차례로 빈 칸에 싣는다 (블록당 최대 4칸)
function attachCarry() {
  for (const q of S.next) {
    if (!S.carry.length) return;
    if (q.iron) continue;
    const free = [0, 1, 2, 3].filter(i => !q.turrets.some(t => t.idx === i)).sort(() => Math.random() - .5);
    while (free.length && S.carry.length) { const t = S.carry.shift(); q.turrets.push({ kind: t.kind, lvl: t.lvl, idx: free.shift(), carried: true }); }
  }
}
function spawnPiece() {
  const p = S.next.shift(); while (S.next.length < 3) S.next.push(makePiece());
  if (S.ironNext) { p.iron = true; S.carry.unshift(...p.turrets.filter(t => t.carried)); p.turrets = []; S.ironNext = false; }
  attachCarry();

  S.piece = { ...p, r: 0, x: 3, y: p.t === 'I' ? -1 : 0 };
  S.lockT = 0; S.lockMoves = 0; S.lastRotate = false; S.dropT = 0;
  if (cellsOf(S.piece).some(([x, y]) => y >= 0 && S.board[y][x])) gameOver('블록이 천장에 닿았다');
}
const cellsOf = (p, x = p.x, y = p.y, r = p.r) => SHAPES[p.t][r].map(([dx, dy]) => [x + dx, y + dy]);

// 적이 차지한 칸 (이동 중이면 출발 칸과 도착 칸 모두)
function enemyCells(e) {
  const sz = ENEMY[e.type].size || 1, out = [];
  for (const [bx, by] of [[e.gx, e.gy], [e.px, e.py]]) for (let i = 0; i < sz; i++) for (let j = 0; j < sz; j++) out.push([bx + i, by + j]);
  return out;
}
// 단단한 적은 착지한 뒤에만 블록을 막는다 (떨어지는 중에 생성 위치를 막아 억울하게 지는 일 방지)
function solidEnemyAt(x, y) { return S.enemies.some(e => ENEMY[e.type].solid && e.landed && !e.dead && enemyCells(e).some(([a, b]) => a === x && b === y)); }
function collide(p, x, y, r) {
  return cellsOf(p, x, y, r).some(([cx, cy]) => cx < 0 || cx >= COLS || cy >= ROWS || (cy >= 0 && S.board[cy][cx]) || solidEnemyAt(cx, cy));
}

// ---------------------------------------------------------------- 조작
function move(dx) {
  const p = S.piece; if (!p || S.webT > 0 && dx) return false;
  if (!collide(p, p.x + dx, p.y, p.r)) { p.x += dx; S.lastRotate = false; touchLock(); return true; }
  return false;
}
function rotate(dir) {
  const p = S.piece; if (!p) return;
  const nr = (p.r + dir + 4) % 4;
  for (const [kx, ky] of KICKS) if (!collide(p, p.x + kx, p.y + ky, nr)) { p.x += kx; p.y += ky; p.r = nr; S.lastRotate = true; touchLock(); return; }
}
function touchLock() { if (onGround() && S.lockMoves < 15) { S.lockT = 0; S.lockMoves++; } }
const onGround = () => collide(S.piece, S.piece.x, S.piece.y + 1, S.piece.r);
function softDrop() { const p = S.piece; if (!collide(p, p.x, p.y + 1, p.r)) { p.y++; S.score += 1; S.lastRotate = false; S.dropT = 0; } }
function hardDrop() { const p = S.piece; let n = 0; while (!collide(p, p.x, p.y + 1, p.r)) { p.y++; n++; } if (n) S.lastRotate = false; S.score += n * 2; crushCheck(); lock(); }
function holdPiece() {
  if (!S.canHold) return; const cur = { t: S.piece.t, c: S.piece.c, turrets: S.piece.turrets, iron: S.piece.iron };
  if (S.hold) { const h = S.hold; S.hold = cur; S.piece = { ...h, r: 0, x: 3, y: h.t === 'I' ? -1 : 0 }; S.lockT = 0; S.lockMoves = 0; }
  else { S.hold = cur; spawnPiece(); }
  S.canHold = false;
}

// ---------------------------------------------------------------- 고정과 줄 지우기
function lock() {
  const p = S.piece, cells = cellsOf(p);
  // 보스 위에 얹히면 큰 피해
  const below = cells.map(([x, y]) => [x, y + 1]);
  S.enemies.filter(e => e.type === 'boss').forEach(e => { if (below.some(([x, y]) => enemyCells(e).some(([a, b]) => a === x && b === y)) && !e.hitBy?.has(p)) { (e.hitBy ||= new Set()).add(p); damage(e, 120, 'crush'); popText('CRUSH -120', e.gx + 1, e.gy, '#ffd96a'); } });
  let tspin = false;
  if (p.t === 'T' && S.lastRotate) {
    const cx = p.x + 1, cy = p.y + 1; let n = 0;
    for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) { const x = cx + dx, y = cy + dy; if (x < 0 || x >= COLS || y >= ROWS || (y >= 0 && S.board[y][x])) n++; }
    tspin = n >= 3;
  }
  let above = false;
  cells.forEach(([x, y], i) => {
    if (y < 0) { above = true; return; }
    const tu = p.turrets.find(q => q.idx === i);
    S.board[y][x] = { c: p.iron ? 'X' : (p.c || p.t), iron: p.iron, turret: tu ? { kind: tu.kind, lvl: tu.lvl, cd: .5, hp: turretHp(tu.lvl), maxhp: turretHp(tu.lvl) } : null };
  });
  S.canHold = true;
  if (above) { gameOver('블록이 천장을 넘었다'); return; }
  const full = []; for (let y = 0; y < ROWS; y++) if (S.board[y].every(c => c)) full.push(y);
  if (full.length) clearRows(full, tspin);
  else { S.combo = -1; if (tspin) popText('T-SPIN', p.x + 1, p.y, COLOR.T); }
  spawnPiece();
}
function clearRows(rows, tspin) {
  const n = rows.length, found = [];
  rows.forEach(y => S.board[y].forEach((c, x) => { if (c.turret) found.push({ ...c.turret, x }); }));
  for (const y of rows.slice().sort((a, b) => a - b)) {
    S.board.splice(y, 1); S.board.unshift(Array(COLS).fill(null));
    S.enemies.forEach(e => { if (ENEMY[e.type].solid || e.type === 'ghost') { if (e.gy === y) e.dead = true; } if (e.gy < y) { e.gy++; e.py++; } });
    S.fx.push({ kind: 'line', y, t: .35 });
  }
  S.enemies = S.enemies.filter(e => !e.dead || (kill(e, 'line'), false));
  S.lines += n; S.combo++;
  S.score += [0, 100, 300, 500, 800][n] * S.wave + Math.max(0, S.combo) * 50;
  const midY = rows[0];
  popText(['', 'LINE', 'DOUBLE', 'TRIPLE', 'TETRIS'][n] + (S.combo > 0 ? `  COMBO x${S.combo}` : ''), 4.5, midY, '#ffffff');
  if (!found.length) return;
  const bonus = n - 1, results = [], msgs = [];
  // 1) 같은 종류끼리 합체: 레벨 합산 + 여러 줄 보너스
  const byKind = {};
  found.forEach(t => (byKind[t.kind] ||= []).push(t));
  let pool = [];
  for (const k in byKind) {
    const g2 = byKind[k];
    if (g2.length >= 2) { const lvl = Math.min(9, g2.reduce((a, t) => a + t.lvl, 0) + bonus); results.push({ kind: k, lvl, x: g2[0].x }); S.merges++; msgs.push(`${KIND_NAME[k]} 합체 Lv${lvl}`); }
    else pool.push(g2[0]);
  }
  // 2) 다른 종류 합성 규칙
  for (const [a, b, out] of RECIPES) {
    const ta = pool.find(t => t.kind === a), tb = pool.find(t => t.kind === b);
    if (ta && tb) { const lvl = Math.min(9, ta.lvl + tb.lvl + bonus); results.push({ kind: out, lvl, x: ta.x }); pool = pool.filter(t => t !== ta && t !== tb); S.fusions++; msgs.push(`${KIND_NAME[a]}+${KIND_NAME[b]} → ${KIND_NAME[out]} Lv${lvl}`); }
  }
  // 3) 규칙이 없는 포탑은 그대로 다음 블록들에 실린다
  pool.forEach(t => results.push({ kind: t.kind, lvl: t.lvl, x: t.x, hp: t.hp }));
  if (tspin) results.forEach(r => { if (r.kind === 'T') { r.lvl = Math.min(9, r.lvl + 2); msgs.push(`T스핀 관통 Lv${r.lvl}`); } });
  // 합체·합성 결과가 앞(다음 블록), 규칙 없는 포탑은 그 뒤 블록들에 실린다
  S.carry = results.map(r => ({ kind: r.kind, lvl: r.lvl })).concat(S.carry);
  attachCarry();
  if (S.carry.length) msgs.push(`대기 포탑 ${S.carry.length}`);
  if (msgs.length) { popText(msgs.join(' · '), 4.5, midY - 1.2, '#ffd96a'); S.fx.push({ kind: 'ring', x: 4.5, y: midY + .5, t: .5, col: '#ffd96a', big: true }); }
}
function forTurrets(fn) { for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const c = S.board[y][x]; if (c && c.turret) fn(c, x, y); } }
function recomputeGroups() {
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = S.board[y][x]; if (!c || seen[y][x]) continue;
    const grp = [], st = [[x, y]]; seen[y][x] = true;
    while (st.length) { const [a, b] = st.pop(); grp.push([a, b]);
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = a + dx, ny = b + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || seen[ny][nx]) continue; const n2 = S.board[ny][nx]; if (n2 && n2.c === c.c && !c.iron) { seen[ny][nx] = true; st.push([nx, ny]); } } }
    const attr = grp.length >= 6 && !c.iron ? c.c : null;
    grp.forEach(([a, b]) => S.board[b][a].attr = attr);
  }
}
function removeBlock(x, y) {
  const c = S.board[y]?.[x]; if (!c || c.iron) return false;
  if (c.turret) popText('포탑 파괴', x, y, '#ff6a6a');
  S.board[y][x] = null; S.fx.push({ kind: 'burst', x: x + .5, y: y + .5, t: .4, col: COLOR[c.c] }); return true;
}

// ---------------------------------------------------------------- 적
function spawnEnemy(type, x) {
  const d = ENEMY[type];
  S.enemies.push({ type, gx: x, gy: -1, px: x, py: -2, prog: 1, hp: d.hp * (1 + (S.wave - 1) * .08), maxhp: d.hp * (1 + (S.wave - 1) * .08), dir: Math.random() < .5 ? -1 : 1, stuck: 0, slow: 0, poison: 0, landed: false, fuse: 0, webCd: 0 });
  if (type === 'boss') S.bossAlive = true;
}
const blockedForEnemy = (e, x, y) => {
  const sz = ENEMY[e.type].size || 1;
  for (let i = 0; i < sz; i++) for (let j = 0; j < sz; j++) { const cx = x + i, cy = y + j; if (cx < 0 || cx >= COLS || cy >= ROWS) return true; if (cy >= 0 && S.board[cy][cx]) return true;
    if (ENEMY[e.type].solid && S.piece && cellsOf(S.piece).some(([a, b]) => a === cx && b === cy)) return true; }
  return false;
};
function stepEnemy(e, dt) {
  const d = ENEMY[e.type];
  if (e.slow > 0) e.slow -= dt;
  if (e.poison > 0) { e.poison -= dt; damage(e, 6 * dt, 'poison'); }
  e.webCd -= dt;
  const spd = e.slow > 0 ? .5 : 1;
  if (e.prog < 1) { e.prog = Math.min(1, e.prog + dt * spd / e.dur); return; }
  e.px = e.gx; e.py = e.gy;
  const sz = d.size || 1;
  // 바닥 도달: 핵 피해
  if (e.gy + sz - 1 >= ROWS - 1) { S.core -= d.core; S.fx.push({ kind: 'core', t: .4 }); popText(`핵 -${d.core}`, e.gx, ROWS - 1, '#ff6a6a'); e.dead = true; e.escaped = true; if (S.core <= 0) gameOver('핵이 무너졌다'); return; }
  if (e.type === 'ghost') { e.gy++; e.prog = 0; e.dur = d.fall; return; }
  if (!blockedForEnemy(e, e.gx, e.gy + 1)) { e.gy++; e.prog = 0; e.dur = e.landed ? .09 : d.fall; e.stuck = 0; return; }
  if (!e.landed) { e.landed = true; if (e.type === 'bomb') e.fuse = 1.0; }
  if (e.type === 'bomb' && e.fuse > 0) { e.fuse -= dt; if (e.fuse <= 0) explode(e); return; }
  // 옆이나 아래에 포탑이 붙어 있으면 멈춰 서서 공격
  if (d.atk > 0) {
    const adj = [];
    for (let i = 0; i < sz; i++) adj.push([e.gx + i, e.gy + sz]);
    for (let j = 0; j < sz; j++) adj.push([e.gx - 1, e.gy + j], [e.gx + sz, e.gy + j]);
    for (const [ax, ay] of adj) { const c = S.board[ay]?.[ax]; if (c && c.turret) {
      c.turret.hp -= d.atk * dt * (e.slow > 0 ? .5 : 1); e.attacking = [ax, ay];
      if (c.turret.hp <= 0) { c.turret = null; S.fx.push({ kind: 'burst', x: ax + .5, y: ay + .5, t: .5, col: '#ff6a6a' }); popText('포탑 파괴', ax, ay, '#ff6a6a'); e.attacking = null; }
      return; } }
    e.attacking = null;
  }
  e.stuck += dt;
  const chewAt = e.type === 'digger' ? 1.1 : 5;
  if (e.stuck >= chewAt && e.gy + sz < ROWS) { for (let i = 0; i < sz; i++) removeBlock(e.gx + i, e.gy + sz); recomputeGroups(); e.stuck = 0; return; }
  // 걷기: 같은 줄에서 가장 가까운 내려갈 수 있는 칸 쪽으로
  let best = null;
