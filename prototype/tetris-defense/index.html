<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Defense</title>
<style>
  :root { --bg:#06060b; --fg:#cfd8e6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{display:block;width:100%;max-width:1280px;max-height:calc(100% - 80px);object-fit:contain;touch-action:none}
  #touch{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  #touch button{font:600 18px/1 "DejaVu Sans Mono",monospace;color:#cfd8e6;background:transparent;border:1px solid rgba(127,214,255,.45);border-radius:6px;min-width:52px;height:48px;touch-action:manipulation}
  #touch button:active{background:rgba(127,214,255,.15)}
  #touch button:focus-visible{outline:2px solid #7fd6ff}
  @media (pointer: coarse){ #touch{display:flex} }
</style>
</head>
<body>
<canvas id="c" width="1280" height="700"></canvas>
<div id="touch" aria-label="터치 조작">
  <button id="tLeft" data-a="left" aria-label="왼쪽">◀</button>
  <button id="tRight" data-a="right" aria-label="오른쪽">▶</button>
  <button id="tRot" data-a="rot" aria-label="회전">⟳</button>
  <button id="tDown" data-a="down" aria-label="빠르게">▼</button>
  <button id="tDrop" data-a="drop" aria-label="떨어뜨리기">⤓</button>
  <button id="tHold" data-a="hold" aria-label="보관">H</button>
</div>
<script>
'use strict';
// =====================================================================
// 테트리스 디펜스 v2: 화면 분리
// 왼쪽 우물은 순수 테트리스. 모든 블록에 모양별 포탑 칸이 하나 있다.
// 줄을 지우면 그 줄의 포탑이 터져 나와 오른쪽 전장에 배치된다.
// 같은 줄에서 함께 터진 포탑은 같은 종류끼리 합체, 정해진 조합은 합성.
// 적은 전장 위쪽 입구에서 나와 길을 따라 아래 핵으로 가고, 닿으면 핵 체력이 깎인다.
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 700;
const COLS = 10, ROWS = 20, CELL = 30, OX = 290, OY = 50;           // 테트리스 우물
const FCOLS = 9, FROWS = 20, FX = 640, FY = 50;                       // 디펜스 전장
const COLOR = { I:'#7fd6ff', O:'#ffd96a', T:'#c890ff', S:'#9cffb0', Z:'#ff8a7a', L:'#ffb36a', J:'#6a9cff',
  V:'#d8f4ff', R:'#fff0a0', P:'#c4ff6a', A:'#ff9a50' };
const KIND_NAME = { I:'빙결', O:'번개', T:'관통', S:'독', Z:'화염', L:'폭발', J:'저격', V:'증기', R:'레일건', P:'역병', A:'포격' };
const KIND_DESC = { I:'느리게', O:'연쇄 2', T:'꿰뚫기', S:'지속 피해', Z:'작은 범위', L:'큰 범위', J:'먼 적 한 발', V:'범위 + 감속', R:'일직선 전부', P:'범위 + 독', A:'먼 적 큰 범위' };
const RECIPES = [['I', 'Z', 'V'], ['O', 'T', 'R'], ['S', 'L', 'P'], ['J', 'L', 'A']];
const BASE = {
  I:[[0,1],[1,1],[2,1],[3,1]], O:[[1,0],[2,0],[1,1],[2,1]], T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]],
};
// 회전 상태는 좌표를 돌려서 만든다. 칸 순서가 유지되어 포탑 칸이 블록과 함께 돈다.
// O는 칸 배치가 같지만 칸 순서를 시계 방향으로 돌려 포탑 칸이 옮겨 가게 한다.
const SHAPES = {};
for (const t in BASE) {
  const n = t === 'I' ? 4 : 3; let cur = BASE[t]; SHAPES[t] = [cur];
  for (let r = 1; r < 4; r++) { cur = t === 'O' ? cur.map(([x, y]) => [2 - y, x - 1]) : cur.map(([x, y]) => [n - 1 - y, x]); SHAPES[t].push(cur); }
}
const KICKS = [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,1]];

// ---------------------------------------------------------------- 전장: 길
// 위쪽 입구에서 구불구불 내려와 아래 핵으로 가는 길
const WAYPOINTS = [[1,-1],[1,3],[7,3],[7,8],[1,8],[1,13],[7,13],[7,17],[4,17],[4,20]];
const PATH = []; // 길이 지나는 칸
for (let i = 0; i < WAYPOINTS.length - 1; i++) {
  const [x1, y1] = WAYPOINTS[i], [x2, y2] = WAYPOINTS[i + 1];
  const sx = Math.sign(x2 - x1), sy = Math.sign(y2 - y1); let x = x1, y = y1;
  while (x !== x2 || y !== y2) { if (y >= 0 && y < FROWS) PATH.push([x, y]); x += sx; y += sy; }
}
const onPath = new Set(PATH.map(([x, y]) => x + ',' + y));
const SEG = []; let PATH_LEN = 0;
for (let i = 0; i < WAYPOINTS.length - 1; i++) { const [a, b] = [WAYPOINTS[i], WAYPOINTS[i + 1]]; const len = Math.hypot(b[0] - a[0], b[1] - a[1]); SEG.push({ a, b, len, start: PATH_LEN }); PATH_LEN += len; }
function pathPos(d) {
  for (const s of SEG) if (d <= s.start + s.len) { const k = (d - s.start) / s.len; return [s.a[0] + (s.b[0] - s.a[0]) * k + .5, s.a[1] + (s.b[1] - s.a[1]) * k + .5]; }
  const last = WAYPOINTS[WAYPOINTS.length - 1]; return [last[0] + .5, last[1] + .5];
}
// 길 옆 칸일수록 먼저 쓰도록 길까지의 거리
function distToPath(x, y) { let m = 99; for (const [px, py] of PATH) m = Math.min(m, Math.abs(px - x) + Math.abs(py - y)); return m; }
// 포탑 자리는 길 바로 옆 칸(상하좌우)만. -1은 놓을 수 없는 칸
const SLOT_D = []; for (let y = 0; y < FROWS; y++) { SLOT_D.push([]); for (let x = 0; x < FCOLS; x++) SLOT_D[y].push(onPath.has(x + ',' + y) || distToPath(x, y) > 1 ? -1 : distToPath(x, y)); }

const ENEMY = {
  grunt:   { name:'일반',   hp:40,  spd:2.16, col:'#ff8a7a', core:1 },
  runner:  { name:'질주',   hp:22,  spd:4.14, col:'#ffd96a', core:1 },
  tank:    { name:'방패',   hp:120, spd:1.35, col:'#e8f0ff', core:2, armor:.5 },
  breaker: { name:'파괴자', hp:60,  spd:1.8, col:'#ff6ad5', core:1, atk:16 },
  healer:  { name:'치유사', hp:50,  spd:1.8, col:'#9cffb0', core:1, heal:8 },
  boss:    { name:'보스',   hp:900, spd:0.99, col:'#ff4fa8', core:5, armor:.3, atk:40, big:true },
};
const UNLOCK = [['grunt',1],['runner',2],['tank',3],['breaker',4],['healer',6]];
const TURRET = {
  I: { dmg: 6,  cd: .5,  range: 2.6 }, O: { dmg: 8,  cd: .7, range: 2.6 }, T: { dmg: 10, cd: .7, range: 3.0 },
  S: { dmg: 4,  cd: .6,  range: 2.6 }, Z: { dmg: 8,  cd: .7, range: 2.2 }, L: { dmg: 12, cd: 1.1, range: 2.6 },
  J: { dmg: 22, cd: 1.4, range: 5.0 },
  V: { dmg: 9,  cd: .8,  range: 2.6 }, R: { dmg: 30, cd: 1.5, range: 6.0 }, P: { dmg: 12, cd: 1.0, range: 2.8 }, A: { dmg: 28, cd: 1.8, range: 5.5 },
};
const turretHp = l => 40 + 25 * l;

// ---------------------------------------------------------------- 상태
let S;
function newGame() {
  S = {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    field: Array.from({ length: FROWS }, () => Array(FCOLS).fill(null)),
    bag: [], next: [], hold: null, canHold: true, piece: null,
    dropT: 0, lockT: 0, lockMoves: 0, lastRotate: false,
    enemies: [], fx: [], texts: [], beams: [], flyers: [],
    wave: 1, toSpawn: 0, spawnT: 0, breakT: 4, waveActive: false,
    core: 20, score: 0, lines: 0, kills: 0, combo: -1, merges: 0, fusions: 0,
    over: false, paused: false, started: S ? true : false, time: 0,
  };
  for (let i = 0; i < 3; i++) S.next.push(makePiece());
  spawnPiece();
}
function fromBag() {
  if (!S.bag.length) { S.bag = Object.keys(BASE); for (let i = S.bag.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.bag[i], S.bag[j]] = [S.bag[j], S.bag[i]]; } }
  return S.bag.pop();
}
function makePiece() { const t = fromBag(); return { t, turrets: [{ kind: t, lvl: 1, idx: Math.random() * 4 | 0 }] }; }
function spawnPiece() {
  const p = S.next.shift(); while (S.next.length < 3) S.next.push(makePiece());
  S.piece = { ...p, r: 0, x: 3, y: p.t === 'I' ? -1 : 0 };
  S.lockT = 0; S.lockMoves = 0; S.lastRotate = false; S.dropT = 0;
  if (cellsOf(S.piece).some(([x, y]) => y >= 0 && S.board[y][x])) gameOver('블록이 천장에 닿았다');
}
const cellsOf = (p, x = p.x, y = p.y, r = p.r) => SHAPES[p.t][r].map(([dx, dy]) => [x + dx, y + dy]);
const collide = (p, x, y, r) => cellsOf(p, x, y, r).some(([cx, cy]) => cx < 0 || cx >= COLS || cy >= ROWS || (cy >= 0 && S.board[cy][cx]));

// ---------------------------------------------------------------- 조작
function move(dx) { const p = S.piece; if (p && !collide(p, p.x + dx, p.y, p.r)) { p.x += dx; S.lastRotate = false; touchLock(); return true; } return false; }
function rotate(dir) {
  const p = S.piece; if (!p) return; const nr = (p.r + dir + 4) % 4;
  for (const [kx, ky] of KICKS) if (!collide(p, p.x + kx, p.y + ky, nr)) { p.x += kx; p.y += ky; p.r = nr; S.lastRotate = true; touchLock(); return; }
}
function touchLock() { if (onGround() && S.lockMoves < 15) { S.lockT = 0; S.lockMoves++; } }
const onGround = () => collide(S.piece, S.piece.x, S.piece.y + 1, S.piece.r);
function softDrop() { const p = S.piece; if (!collide(p, p.x, p.y + 1, p.r)) { p.y++; S.score += 1; S.lastRotate = false; S.dropT = 0; } }
function hardDrop() { const p = S.piece; let n = 0; while (!collide(p, p.x, p.y + 1, p.r)) { p.y++; n++; } if (n) S.lastRotate = false; S.score += n * 2; lock(); }
function holdPiece() {
  if (!S.canHold) return; const cur = { t: S.piece.t, turrets: S.piece.turrets };
  if (S.hold) { const h = S.hold; S.hold = cur; S.piece = { ...h, r: 0, x: 3, y: h.t === 'I' ? -1 : 0 }; S.lockT = 0; S.lockMoves = 0; }
  else { S.hold = cur; spawnPiece(); }
  S.canHold = false;
}

// ---------------------------------------------------------------- 고정과 줄 지우기
function lock() {
  const p = S.piece, cells = cellsOf(p);
  let tspin = false;
  if (p.t === 'T' && S.lastRotate) {
    const cx = p.x + 1, cy = p.y + 1; let n = 0;
    for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) { const x = cx + dx, y = cy + dy; if (x < 0 || x >= COLS || y >= ROWS || (y >= 0 && S.board[y][x])) n++; }
    tspin = n >= 3;
  }
  let above = false;
  cells.forEach(([x, y], i) => {
    if (y < 0) { above = true; return; }
    const tu = p.turrets.find(q => q.idx === i);
    S.board[y][x] = { c: p.t, turret: tu ? { kind: tu.kind, lvl: tu.lvl } : null };
  });
  S.canHold = true;
  if (above) { gameOver('블록이 천장을 넘었다'); return; }
  const full = []; for (let y = 0; y < ROWS; y++) if (S.board[y].every(c => c)) full.push(y);
  if (full.length) clearRows(full, tspin); else { S.combo = -1; if (tspin) popText('T-SPIN', p.x + 1, p.y, COLOR.T, 'well'); }
  spawnPiece();
}
function clearRows(rows, tspin) {
  const n = rows.length, found = [];
  rows.forEach(y => S.board[y].forEach((c, x) => { if (c.turret) found.push({ ...c.turret, x, y }); }));
  for (const y of rows.slice().sort((a, b) => a - b)) { S.board.splice(y, 1); S.board.unshift(Array(COLS).fill(null)); S.fx.push({ kind: 'line', y, t: .35 }); }
  S.lines += n; S.combo++;
  S.score += [0, 100, 300, 500, 800][n] * S.wave + Math.max(0, S.combo) * 50;
  popText(['', 'LINE', 'DOUBLE', 'TRIPLE', 'TETRIS'][n] + (S.combo > 0 ? `  COMBO x${S.combo}` : ''), 4.5, rows[0], '#ffffff', 'well');
  if (!found.length) return;
  // 같은 줄에서 함께 터진 포탑: 같은 종류 합체 → 합성 규칙 → 나머지는 그대로
  const bonus = n - 1, results = [], msgs = [];
  const byKind = {}; found.forEach(t => (byKind[t.kind] ||= []).push(t));
  let rest = [];
  for (const k in byKind) {
    const grp = byKind[k];
    if (grp.length >= 2) { const lvl = Math.min(9, grp.reduce((a, t) => a + t.lvl, 0) + bonus); results.push({ kind: k, lvl, x: grp[0].x, y: grp[0].y }); S.merges++; msgs.push(`${KIND_NAME[k]} 합체 Lv${lvl}`); }
    else rest.push(grp[0]);
  }
  for (const [a, b, out] of RECIPES) {
    const ta = rest.find(t => t.kind === a), tb = rest.find(t => t.kind === b);
    if (ta && tb) { const lvl = Math.min(9, ta.lvl + tb.lvl + bonus); results.push({ kind: out, lvl, x: ta.x, y: ta.y }); rest = rest.filter(t => t !== ta && t !== tb); S.fusions++; msgs.push(`${KIND_NAME[a]}+${KIND_NAME[b]} → ${KIND_NAME[out]} Lv${lvl}`); }
  }
  rest.forEach(t => results.push({ kind: t.kind, lvl: t.lvl, x: t.x, y: t.y }));
  if (tspin) results.forEach(r => { if (r.kind === 'T') { r.lvl = Math.min(9, r.lvl + 2); msgs.push(`T스핀 관통 Lv${r.lvl}`); } });
  results.forEach(sendToField);
  if (msgs.length) popText(msgs.join(' · '), 4.5, rows[0] - 1.2, '#ffd96a', 'well');
}
// 터진 포탑을 전장에 배치: 지운 줄 높이에 가까운 빈 자리, 같으면 길에 가까운 자리.
// 빈 자리가 없으면 같은 종류 중 가장 약한 포탑을 강화, 그것도 없으면 가장 약한 포탑과 교체.
function sendToField(r) {
  let best = null;
  for (let y = 0; y < FROWS; y++) for (let x = 0; x < FCOLS; x++) {
    if (SLOT_D[y][x] < 0 || S.field[y][x]) continue;
    const score = Math.abs(y - r.y) * 2 + SLOT_D[y][x] * 3 + Math.random() * .1;
    if (!best || score < best.score) best = { x, y, score };
  }
  const make = () => ({ kind: r.kind, lvl: r.lvl, cd: .6, hp: turretHp(r.lvl), maxhp: turretHp(r.lvl) });
  let tx, ty;
  if (best) { tx = best.x; ty = best.y; S.field[ty][tx] = make(); }
  else {
    let weak = null; forTurrets((t, x, y) => { if (t.kind === r.kind && (!weak || t.lvl < weak.t.lvl)) weak = { t, x, y }; });
    if (weak) { weak.t.lvl = Math.min(9, weak.t.lvl + 1); weak.t.maxhp = weak.t.hp = turretHp(weak.t.lvl); tx = weak.x; ty = weak.y; } // 자리가 없으면 같은 종류 가장 약한 포탑 +1레벨
    else { forTurrets((t, x, y) => { if (!weak || t.lvl < weak.t.lvl) weak = { t, x, y }; }); if (!weak || weak.t.lvl > r.lvl) return; S.field[weak.y][weak.x] = make(); tx = weak.x; ty = weak.y; }
  }
  // 우물의 칸에서 전장 자리로 날아가는 연출
  S.flyers.push({ kind: r.kind, x1: OX + r.x * CELL + CELL / 2, y1: OY + r.y * CELL + CELL / 2, x2: FX + tx * CELL + CELL / 2, y2: FY + ty * CELL + CELL / 2, t: 0 });
}
function forTurrets(fn) { for (let y = 0; y < FROWS; y++) for (let x = 0; x < FCOLS; x++) { const t = S.field[y][x]; if (t) fn(t, x, y); } }

// ---------------------------------------------------------------- 적
// 적 체력: 기본의 2배에서 시작해 웨이브마다 45%씩 증가
function spawnEnemy(type) { const d = ENEMY[type], k = 2 * (1 + (S.wave - 1) * .45); S.enemies.push({ type, d: 0, hp: d.hp * k, maxhp: d.hp * k, slow: 0, poison: 0, atkT: 0 }); }
function epos(e) { return pathPos(e.d); }
function stepEnemies(dt) {
  for (const e of S.enemies) {
    const d = ENEMY[e.type];
    if (e.slow > 0) e.slow -= dt;
    if (e.poison > 0) { e.poison -= dt; damage(e, 6 * dt); }
    if (d.heal) { e.healT = (e.healT || 0) - dt; if (e.healT <= 0) { e.healT = 1; S.enemies.forEach(o => { if (o !== e && !o.dead && Math.hypot(...sub(epos(o), epos(e))) < 1.6) o.hp = Math.min(o.maxhp, o.hp + d.heal); }); S.fx.push({ kind: 'ring', x: epos(e)[0], y: epos(e)[1], t: .3, col: d.col, field: true }); } }
    // 길가 포탑 공격 (파괴자, 보스)
    e.attacking = null;
    if (d.atk) {
      const [ex, ey] = epos(e); let tgt = null;
      forTurrets((t, x, y) => { if (!tgt && Math.hypot(x + .5 - ex, y + .5 - ey) < (d.big ? 1.8 : 1.3)) tgt = { t, x, y }; });
      if (tgt) { tgt.t.hp -= d.atk * dt; e.attacking = [tgt.x, tgt.y]; if (tgt.t.hp <= 0) { S.field[tgt.y][tgt.x] = null; S.fx.push({ kind: 'burst', x: tgt.x + .5, y: tgt.y + .5, t: .5, col: '#ff6a6a', field: true }); popText('포탑 파괴', tgt.x, tgt.y, '#ff6a6a', 'field'); } continue; }
    }
    e.d += d.spd * (e.slow > 0 ? .5 : 1) * dt;
    if (e.d >= PATH_LEN) { e.dead = true; S.core -= d.core; S.fx.push({ kind: 'core', t: .4 }); popText(`핵 -${d.core}`, 4, FROWS - 1, '#ff6a6a', 'field'); if (S.core <= 0) gameOver('핵이 무너졌다'); }
  }
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
function damage(e, amt) { if (e.dead) return; e.hp -= amt * (1 - (ENEMY[e.type].armor || 0)); if (e.hp <= 0) { e.dead = true; S.kills++; S.score += e.type === 'boss' ? 500 : 15; const [x, y] = epos(e); S.fx.push({ kind: 'burst', x, y, t: .5, col: ENEMY[e.type].col, big: ENEMY[e.type].big, field: true }); } }

// ---------------------------------------------------------------- 포탑
function updateTurrets(dt) {
  const rate = 1 + Math.max(0, Math.min(S.combo, 10)) * .08;
  forTurrets((t, x, y) => {
    const T = TURRET[t.kind], lvl = t.lvl, k = t.kind;
    const range = (T.range + .3 * (lvl - 1)) * .75, dmg = T.dmg * .5 * (1 + .4 * (lvl - 1)); // 포탑이 계속 쌓이므로 공격력 절반, 사거리 3/4, 레벨당 +40%
    t.cd -= dt * rate; if (t.cd > 0) return;
    const cx = x + .5, cy = y + .5;
    const inR = S.enemies.filter(e => !e.dead && dist(e, cx, cy) <= range); if (!inR.length) return;
    t.cd = T.cd;
    const far = k === 'J' || k === 'A';
    const tgt = inR.sort((a, b) => far ? b.d - a.d : b.d - a.d)[0]; // 핵에 가장 가까운 적 우선
    const [ex, ey] = epos(tgt);
    S.beams.push({ x1: cx, y1: cy, x2: ex, y2: ey, t: .09, col: COLOR[k] });
    hit(tgt, dmg, k);
