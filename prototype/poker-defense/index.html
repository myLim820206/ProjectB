<body>
<canvas id="c" width="1280" height="720"></canvas>

<script>
'use strict';
// =====================================================================
// 포커 디펜스 (가칭) 프로토타입 v1: 핵심 루프만
//  웨이브 사이에 카드를 뽑는다 → 카드를 맵에 놓아 타워로 세우거나 손에 아껴 둔다 → 웨이브를 막는다
//  - 카드 한 장 = 타워 하나. 무늬 = 공격 방식, 숫자 = 공격력
//  - 상하좌우로 붙은 타워들이 족보가 되면 시너지 (ㄴ·ㄱ·T 등 모양 상관없음, 타워 하나는 족보 하나에만)
//  - 족보끼리 맞닿으면 연쇄: 연쇄에 든 족보 수만큼 공격력 +25%씩
//  - 족보마다 효과가 다르다: 페어 공격력, 스트레이트 연사, 플러시 범위, 풀하우스 범위+연사, 포카드 한 방
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 720;
const COLS = 16, ROWS = 10, CS = 54, FX = 24, FY = 24;
const HAND_Y = FY + ROWS * CS + 22, CARD_W = 66, CARD_H = 92, HAND_MAX = 7, JOKER_MAX = 5;
const RX = FX + COLS * CS + 26;
const WAVES = 15, START_LIVES = 20, START_HAND = 5, DRAW_PER_WAVE = 3;
// 무늬 = 공격 방식 (도형과 색)
const SUIT = {
  '♠': { name: '저격', desc: '사거리 길고 한 방이 셈', col: '#7fb8ff', shape: 'tri',     dmg: 1.6,  rate: 0.8, range: 3.0 },
  '♥': { name: '폭발', desc: '맞은 자리 주변도 피해', col: '#ff6a8a', shape: 'circle',  dmg: 0.9,  rate: 0.9, range: 2.2, splash: 0.8 },
  '♦': { name: '연사', desc: '약하지만 아주 빠름',   col: '#ffd96a', shape: 'diamond', dmg: 0.45, rate: 2.6, range: 2.2 },
  '♣': { name: '둔화', desc: '맞은 적이 느려짐',     col: '#8affc4', shape: 'square',  dmg: 0.7,  rate: 1.0, range: 2.4, slow: 0.4 },
  '★': { name: '와일드', desc: '아무 숫자·무늬로 친다', col: '#ffffff', shape: 'star',  dmg: 1.0,  rate: 1.2, range: 2.6 },
};
const SUITS = ['♠', '♥', '♦', '♣'];
const RANK_TXT = r => ({ 0: 'W', 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
// 족보 = 시너지 효과
const HANDS = {
  straightFlush: { name: '스트레이트 플러시', n: [5],       val: 100, col: '#ff9ad5', eff: '공격력 ×2 · 연사 ×2 · 범위' },
  four:          { name: '포카드',            n: [4],       val: 90,  col: '#ff6a6a', eff: '공격력 ×3.5' },
  fullHouse:     { name: '풀하우스',          n: [5],       val: 80,  col: '#ffa86a', eff: '공격력 ×1.5 · 연사 ×1.5 · 범위' },
  flush:         { name: '플러시',            n: [3, 4, 5], val: 30,  col: '#ff9ad5', eff: '범위 공격 (장수만큼 넓게)' },
  straight:      { name: '스트레이트',        n: [2, 3, 4, 5], val: 28, col: '#7fd6ff', eff: '연사 ×1.25 / ×1.5 / ×1.75 / ×2' },
  triple:        { name: '트리플',            n: [3],       val: 60,  col: '#ffd96a', eff: '공격력 ×2' },
  twoPair:       { name: '투 페어',           n: [4],       val: 45,  col: '#cfe4ff', eff: '공격력 ×1.5 · 사거리 ×1.25' },
  pair:          { name: '원 페어',           n: [2],       val: 20,  col: '#cfd8e6', eff: '공격력 ×1.5' },
};
const HAND_ORDER = ['straightFlush', 'four', 'fullHouse', 'flush', 'straight', 'triple', 'twoPair', 'pair'];

// ---------------------------------------------------------------- 조커 (웨이브 보상, 최대 5칸, 판 끝까지 규칙을 바꾼다)
const JOKERS = {
  heartLover:  { name: '하트 애호가',   desc: '♥ 타워 공격력 +40%' },
  spadeLover:  { name: '스페이드 애호가', desc: '♠ 타워 공격력 +40%' },
  diaLover:    { name: '다이아 애호가',  desc: '♦ 타워 공격력 +40%' },
  clubLover:   { name: '클로버 애호가',  desc: '♣ 타워 공격력 +40%' },
  chainLink:   { name: '연결고리',      desc: '연쇄 보너스 +25% → +45%' },
  twins:       { name: '쌍둥이',        desc: '원 페어·투 페어 공격력 ×1.5 → ×2' },
  lineLover:   { name: '일직선',        desc: '스트레이트 연사 한 장마다 +0.25 더' },
  wideFlush:   { name: '넓은 물결',     desc: '플러시 범위 +0.75칸' },
  faceCards:   { name: '그림 카드',     desc: 'J·Q·K 타워 공격력 +60%' },
  smallNums:   { name: '작은 수',       desc: '2~6 타워 연사 +60%' },
  lucky7:      { name: '행운의 7',      desc: '숫자 7 타워 공격력 ×2.5' },
  bigHand:     { name: '큰 손',         desc: '손패 최대 +2' },
  supply:      { name: '보급',          desc: '웨이브마다 카드 +1' },
  recycle:     { name: '재활용',        desc: '카드를 버리면 1장 뽑기' },
  scope:       { name: '조준경',        desc: '모든 타워 사거리 +15%' },
  frost:       { name: '서리',          desc: '둔화 더 강하게, ♣ 주변도 둔화' },
  chainBlast:  { name: '연쇄 폭발',     desc: '적 처치 시 주변 적에게 최대 체력 15% 피해' },
  pierce:      { name: '관통탄',        desc: '적의 방패를 무시' },
};
// 즉시 보상 (조커 칸을 쓰지 않음)
const INSTANTS = {
  wild:   { name: '와일드 카드', desc: '아무 숫자·무늬로 치는 카드 1장' },
  draw2:  { name: '보충',       desc: '카드 2장 뽑기' },
  repair: { name: '수리',       desc: '목숨 +3' },
};
const has = id => !!(S && S.jokers && S.jokers.includes(id));
const chainStep = () => has('chainLink') ? 0.45 : CHAIN_STEP;
const handMax = () => HAND_MAX + (has('bigHand') ? 2 : 0);
function rollRewards() {
  const pool = Object.keys(JOKERS).filter(id => !S.jokers.includes(id)), out = [];
  const pick = arr => arr.splice(Math.random() * arr.length | 0, 1)[0];
  if (S.jokers.length < JOKER_MAX) { out.push({ kind: 'joker', id: pick(pool) }); out.push({ kind: 'joker', id: pick(pool) }); }
  const inst = Object.keys(INSTANTS); while (out.length < 3) out.push({ kind: 'instant', id: pick(inst) });
  return out;
}
function takeReward(i) {
  if (S.phase !== 'reward') return;
  const r = S.rewards[i];
  if (r) {
    if (r.kind === 'joker') S.jokers.push(r.id);
    else if (r.id === 'wild') { const w = { r: 0, s: '★', wild: true }; if (S.hand.length < handMax()) S.hand.push(w); else S.deck.push(w); }
    else if (r.id === 'draw2') draw(2);
    else if (r.id === 'repair') S.lives += 3;
    popText(`${(r.kind === 'joker' ? JOKERS : INSTANTS)[r.id].name}!`, FX + COLS * CS / 2, FY + 80, '#ffd96a', true);
    S.syn = applyEffects(S.towers); S.version = (S.version || 0) + 1; sfx('Burst', 4, 1);
  }
  S.rewards = []; S.phase = 'build';
}

// ---------------------------------------------------------------- 족보 판정 (줄 안의 연속 2~5장, 순서 상관없음)
function windowHands(cards) {
  const wi = cards.findIndex(c => c.wild);
  if (wi >= 0) {
    const out = new Set(), suits = [...new Set(cards.filter(c => !c.wild).map(c => c.s))]; if (!suits.length) suits.push('♠');
    for (let r = 2; r <= 14; r++) for (const su of suits) { const cs = cards.slice(); cs[wi] = { r, s: su }; windowHands(cs).forEach(h => out.add(h)); }
    return [...out];
  }
  const n = cards.length, ranks = cards.map(c => c.r), cnt = {};
  ranks.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  const vals = Object.values(cnt).sort((a, b) => b - a), sameSuit = cards.every(c => c.s === cards[0].s);
  const distinct = vals.length === n, sorted = ranks.slice().sort((a, b) => a - b);
  const consec = arr => arr.every((r, i) => !i || r === arr[i - 1] + 1);
  const straight = distinct && (consec(sorted) || consec(sorted.map(r => r === 14 ? 1 : r).sort((a, b) => a - b)));
  const out = [];
  if (n === 2 && vals[0] === 2) out.push('pair');
  if (n === 3 && vals[0] === 3) out.push('triple');
  if (n === 4 && vals[0] === 4) out.push('four');
  if (n === 4 && vals[0] === 2 && vals[1] === 2) out.push('twoPair');
  if (n === 5 && vals[0] === 3 && vals[1] === 2) out.push('fullHouse');
  if (n >= 3 && sameSuit && straight && n === 5) out.push('straightFlush');
  if (n >= 3 && sameSuit) out.push('flush');
  if (n >= 2 && straight) out.push('straight'); // 이어진 숫자는 2장부터 (페어와 맞춤)
  return out;
}
// 같은 족보라도 장수가 많으면 더 크게 친다 (플러시·스트레이트)
const handValue = (key, n) => HANDS[key].val + (key === 'flush' || key === 'straight' ? (n - 3) * 22 : 0);
// 상하좌우로 붙은 타워 덩어리 안에서, 서로 붙어 있는 2~5장 묶음(모양 상관없음)을 전부 따져
// 큰 족보부터 겹치지 않게 고른다. 타워 하나는 족보 하나에만 들어간다.
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const CHAIN_STEP = 0.25; // 연쇄: 맞닿은 족보 하나마다 공격력 +25% (연결고리 조커면 +45%)
function connectedSubsets(list, kmax) {
  // ESU 방식: 각 묶음을 한 번씩만 만든다 (시작점보다 번호가 큰 칸으로만 넓힘)
  const idx = new Map(list.map((t, i) => [t.x + ',' + t.y, i]));
  const nb = list.map(t => N4.map(([dx, dy]) => idx.get((t.x + dx) + ',' + (t.y + dy))).filter(v => v !== undefined));
  const out = [];
  function extend(sub, subSet, ext, v) {
    if (sub.length >= 2) out.push(sub.slice());
    if (sub.length === kmax) return;
    const e = ext.slice();
    while (e.length) {
      const w = e.pop(); const nsub = sub.concat(w), nset = new Set(subSet); nset.add(w);
      const near = new Set(); sub.forEach(u => nb[u].forEach(z => near.add(z)));
      const next = e.concat(nb[w].filter(u => u > v && !nset.has(u) && !near.has(u) && !e.includes(u)));
      extend(nsub, nset, next, v);
    }
  }
  for (let v = 0; v < list.length; v++) extend([v], new Set([v]), nb[v].filter(u => u > v), v);
  return out.map(sub => sub.map(i => list[i]));
}
function synergies(towers) {
  const seen = new Set(), picked = [];
  for (const t0 of towers.values()) {
    if (seen.has(t0)) continue;
    const comp = [], st = [t0]; seen.add(t0);
    while (st.length) { const t = st.pop(); comp.push(t); for (const [dx, dy] of N4) { const n = towers.get((t.x + dx) + ',' + (t.y + dy)); if (n && !seen.has(n)) { seen.add(n); st.push(n); } } }
    if (comp.length < 2) continue;
    const cands = [];
    for (const grp of connectedSubsets(comp, 5)) for (const key of windowHands(grp.map(t => t.card))) cands.push({ key, n: grp.length, val: handValue(key, grp.length), towers: grp });
    cands.sort((a, b) => b.val - a.val || b.n - a.n);
    const used = new Set();
    for (const c of cands) { if (c.towers.some(t => used.has(t))) continue; c.towers.forEach(t => used.add(t)); picked.push(c); }
  }
  // 연쇄: 족보끼리 맞닿아 있으면 하나의 연쇄 (가로세로 퍼즐처럼)
  const owner = new Map(); picked.forEach((s, i) => s.towers.forEach(t => owner.set(t.x + ',' + t.y, i)));
  const adj = picked.map(() => new Set()); picked.forEach((s, i) => s.towers.forEach(t => N4.forEach(([dx, dy]) => { const j = owner.get((t.x + dx) + ',' + (t.y + dy)); if (j !== undefined && j !== i) adj[i].add(j); })));
  const chainOf = picked.map(() => -1); let cid = 0;
  picked.forEach((_, i) => { if (chainOf[i] >= 0) return; const st = [i], mem = []; chainOf[i] = cid; while (st.length) { const k = st.pop(); mem.push(k); adj[k].forEach(j => { if (chainOf[j] < 0) { chainOf[j] = cid; st.push(j); } }); } mem.forEach(k => { picked[k].chain = mem.length; picked[k].chainId = cid; }); cid++; });
  picked.forEach((s, i) => s.links = [...adj[i]].filter(j => j > i).map(j => picked[j]));
  return picked;
}
function applyEffects(towers) {
  const syn = synergies(towers);
  for (const t of towers.values()) t.eff = { dmg: 1, rate: 1, range: 1, splash: 0, hands: [] };
  for (const s of syn) for (const t of s.towers) {
    const e = t.eff; e.hands.push(s.key);
    switch (s.key) {
      case 'pair': e.dmg *= has('twins') ? 2 : 1.5; break;
      case 'twoPair': e.dmg *= has('twins') ? 2 : 1.5; e.range *= 1.25; break;
      case 'triple': e.dmg *= 2; break;
      case 'straight': e.rate *= 1 + (has('lineLover') ? 0.5 : 0.25) * (s.n - 1); break;
      case 'flush': e.splash = Math.max(e.splash, 0.5 + 0.25 * s.n + (has('wideFlush') ? 0.75 : 0)); break;
      case 'fullHouse': e.dmg *= 1.5; e.rate *= 1.5; e.splash = Math.max(e.splash, 1.5); break;
      case 'four': e.dmg *= 3.5; break;
      case 'straightFlush': e.dmg *= 2; e.rate *= 2; e.splash = Math.max(e.splash, 2); break;
    }
    if (s.chain >= 2) { e.dmg *= 1 + chainStep() * (s.chain - 1); e.chain = s.chain; }
  }
  return syn;
}
function towerStats(t) {
  const s = SUIT[t.card.s], e = t.eff || { dmg: 1, rate: 1, range: 1, splash: 0 }, c = t.card, r = c.wild ? 10 : c.r;
  let dmg = (3 + r) * s.dmg * e.dmg, rate = s.rate * e.rate, range = s.range * e.range, splash = Math.max(s.splash || 0, e.splash), slow = s.slow || 0;
  // 조커
  const suitJ = { '♥': 'heartLover', '♠': 'spadeLover', '♦': 'diaLover', '♣': 'clubLover' }[c.s]; if (suitJ && has(suitJ)) dmg *= 1.4;
  if (has('faceCards') && r >= 11 && r <= 13) dmg *= 1.6;
  if (has('smallNums') && !c.wild && r <= 6) rate *= 1.6;
  if (has('lucky7') && r === 7) dmg *= 2.5;
  if (has('scope')) range *= 1.15;
  if (has('frost') && c.s === '♣') { slow = Math.min(0.75, slow + 0.2); splash = Math.max(splash, 0.6); }
  return { dmg, rate, range, splash, slow };
}

// ---------------------------------------------------------------- 길
const center = (x, y) => [FX + x * CS + CS / 2, FY + y * CS + CS / 2];
// 길은 판마다 새로 만든다 (setPath)
let PATH = [], PATH_PX = [], SEG = [], PATH_LEN = 0, PATH_CELLS = new Set();
function setPath(path) {
  PATH = path; PATH_PX = PATH.map(([x, y]) => center(x, y)); SEG = []; PATH_LEN = 0; PATH_CELLS = new Set();
  for (let i = 1; i < PATH_PX.length; i++) { const [ax, ay] = PATH_PX[i - 1], [bx, by] = PATH_PX[i], l = Math.hypot(bx - ax, by - ay); SEG.push({ ax, ay, bx, by, l, d0: PATH_LEN }); PATH_LEN += l; }
  for (let i = 1; i < PATH.length; i++) { const [ax, ay] = PATH[i - 1], [bx, by] = PATH[i], dx = Math.sign(bx - ax), dy = Math.sign(by - ay); let x = ax, y = ay; while (true) { if (x >= 0 && x < COLS) PATH_CELLS.add(x + ',' + y); if (x === bx && y === by) break; x += dx; y += dy; } }
}
// 무작위 지그재그 길: 왼쪽 밖에서 들어와 오른쪽 밖으로 나간다.
// 가로로 2~4칸 가고 위아래로 2칸 이상 꺾기를 반복. 세로 구간끼리는 한 칸 이상 떨어져 서로 붙지 않는다.
// 길이가 PATH_MIN~PATH_MAX 칸일 때만 받아서 판마다 난이도가 크게 흔들리지 않게 한다.
const PATH_MIN = 34, PATH_MAX = 46;
function genPath() {
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  for (let tries = 0; tries < 500; tries++) {
    let x = -1, y = ri(1, ROWS - 2); const pts = [[x, y]];
    while (true) {
      const nx = x + ri(2, 4);
      if (nx >= COLS - 2) { pts.push([COLS, y]); break; }
      pts.push([nx, y]); x = nx;
      let ny; do ny = ri(1, ROWS - 2); while (Math.abs(ny - y) < 2);
      pts.push([x, ny]); y = ny;
    }
    let cells = 0; for (let i = 1; i < pts.length; i++) cells += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
    if (cells >= PATH_MIN && cells <= PATH_MAX) return pts;
  }
  return [[-1, 1], [3, 1], [3, 7], [7, 7], [7, 2], [11, 2], [11, 8], [14, 8], [14, 4], [16, 4]];
}
function posAt(d) { for (const s of SEG) if (d <= s.d0 + s.l) { const u = (d - s.d0) / s.l; return [s.ax + (s.bx - s.ax) * u, s.ay + (s.by - s.ay) * u]; } const s = SEG[SEG.length - 1]; return [s.bx, s.by]; }
const buildable = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !PATH_CELLS.has(x + ',' + y);

// ---------------------------------------------------------------- 상태
let S;
function newGame(start = false) {
  setPath(genPath());
  S = { phase: start ? 'build' : 'title', wave: 0, lives: START_LIVES, deck: [], hand: [], towers: new Map(), syn: [], enemies: [], spawn: [], spawnT: 0,
    sel: -1, hover: null, fx: [], texts: [], speed: 1, now: 0, kills: 0, leaks: 0, discarded: 0, jokers: [], rewards: [] };
  for (const s of SUITS) for (let r = 2; r <= 14; r++) S.deck.push({ r, s });
  for (let i = S.deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.deck[i], S.deck[j]] = [S.deck[j], S.deck[i]]; }
  draw(START_HAND);
}
function draw(n) { let got = 0; while (got < n && S.hand.length < handMax() && S.deck.length) { S.hand.push(S.deck.pop()); got++; } return got; }
// 적: normal 기본, fast 빠름, tank 단단함, armored 방패(한 방 피해를 깎음), splitter 죽으면 둘로, regen 체력 회복, mini 분열 조각
const ENEMY = {
  normal:   { hp: 1,   speed: 1.1,  col: '#e8f0ff' },

  text(`목숨 ${S.lives}`, RX + 16, FY + 58, S.lives <= 5 ? '#ff6a6a' : '#9cffb0', 15, 'left', 'bold');
  text(`처치 ${S.kills} · 놓친 적 ${S.leaks}`, RX + 16, FY + 80, '#8a94a6', 11);
  if (S.phase === 'build') { const bx = RX + 16, by = FY + 96, on = (S.now * 2 | 0) % 2; g.lineWidth = 1.6; glow('#9cffb0', on ? 14 : 6); g.strokeRect(bx, by, 200, 38); text(`웨이브 ${S.wave + 1} 시작 (Space)`, bx + 100, by + 25, '#9cffb0', 13, 'center', 'bold'); }
  else if (S.phase === 'wave') text(`남은 적 ${S.enemies.length + S.spawn.length}   속도 ×${S.speed} (F)`, RX + 16, FY + 118, '#ffd96a', 12);
  panel(RX, FY + 162, W - RX - 20, 272); text('족보 시너지 (붙어 있으면 모양 상관없이)', RX + 16, FY + 184, '#7fd6ff', 12);
  const pvKeys = new Set((pvSyn || []).map(s => s.key));
  HAND_ORDER.forEach((k, i) => { const h = HANDS[k], y = FY + 206 + i * 26, on = pvKeys.has(k);
    text(h.name + (k === 'flush' ? ' (3~5장)' : k === 'straight' ? ' (2~5장)' : ''), RX + 16, y, on ? '#ffd96a' : h.col, 12, 'left', 'bold'); text(h.eff, RX + 16, y + 12, on ? '#ffd96a' : '#5f6878', 10); });
  text(`연쇄: 족보끼리 맞닿으면 하나에 +${Math.round(chainStep() * 100)}%씩`, RX + 16, FY + 424, '#ffffff', 11, 'left', 'bold');
  panel(RX, FY + 444, W - RX - 20, 118); text(`조커 ${S.jokers.length}/${JOKER_MAX}`, RX + 16, FY + 466, '#ffd96a', 12, 'left', 'bold');
  if (!S.jokers.length) text('웨이브를 막으면 보상으로 고른다', RX + 16, FY + 488, '#5f6878', 11);
  S.jokers.forEach((id, i) => { text(JOKERS[id].name, RX + 16, FY + 488 + i * 17, '#ffd96a', 11, 'left', 'bold'); text(JOKERS[id].desc, RX + 110, FY + 488 + i * 17, '#8a94a6', 10); });
  panel(RX, FY + 572, W - RX - 20, 42);
  SUITS.forEach((su, i) => { const x = RX + 18 + i * 82; cardShape({ r: 0, s: su, wild: true }, x + 6, FY + 593, 7); text(SUIT[su].name, x + 18, FY + 597, SUIT[su].col, 11); });
  text('카드 클릭(숫자키) → 칸 클릭으로 설치 · 타워 위에 놓으면 교체 · 오른쪽 클릭 버리기 · Esc 취소', W / 2, H - 8, '#5f6878', 11, 'center');

  if (S.phase === 'reward') {
    g.shadowBlur = 0; g.fillStyle = 'rgba(6,6,11,.9)'; g.fillRect(FX, FY, COLS * CS, ROWS * CS);
    text(`웨이브 ${S.wave} 보상 — 하나를 고른다`, FX + COLS * CS / 2, FY + 120, '#ffd96a', 22, 'center', 'bold');
    S.rewards.forEach((r, i) => { const x = FX + COLS * CS / 2 - 360 + i * 250, y = FY + 160, d = (r.kind === 'joker' ? JOKERS : INSTANTS)[r.id], col = r.kind === 'joker' ? '#ffd96a' : '#7fd6ff', hov = S.rewardHover === i;
      g.beginPath(); if (g.roundRect) g.roundRect(x, y, 220, 170, 12); else g.rect(x, y, 220, 170); g.shadowBlur = 0; g.fillStyle = '#0a0b14'; g.fill();
      g.lineWidth = hov ? 2.6 : 1.6; glow(col, hov ? 20 : 8); g.stroke();
      text(r.kind === 'joker' ? '조커' : '즉시', x + 16, y + 26, col, 11); text(String(i + 1), x + 204, y + 26, '#5f6878', 11, 'right');
      text(d.name, x + 110, y + 80, col, 20, 'center', 'bold'); text(d.desc, x + 110, y + 112, '#cfd8e6', 11, 'center'); });
    text('1 · 2 · 3 또는 클릭으로 고르기   S: 건너뛰기', FX + COLS * CS / 2, FY + 380, '#8a94a6', 12, 'center');
    if (S.jokers.length >= JOKER_MAX) text('조커 칸이 가득 찼다 (5/5)', FX + COLS * CS / 2, FY + 404, '#5f6878', 11, 'center');
  }
  const overlay = (title, col, lines, foot) => { g.fillStyle = 'rgba(6,6,11,.88)'; g.fillRect(0, 0, W, H); text(title, W / 2, 240, col, 34, 'center', 'bold'); lines.forEach((l, i) => text(l, W / 2, 290 + i * 26, '#cfd8e6', 14, 'center')); text(foot, W / 2, 300 + lines.length * 26 + 50, '#ffd96a', 18, 'center'); };
  if (S.phase === 'title') overlay('POKER DEFENSE', '#7fd6ff', ['카드 한 장이 타워 하나. 무늬는 공격 방식, 숫자는 공격력', '붙어 있는 타워들이 포커 족보가 되면 시너지 (모양 상관없이). 족보끼리 맞닿으면 연쇄 보너스', `웨이브를 막을 때마다 카드 ${DRAW_PER_WAVE}장. 지금 놓을지, 아껴서 큰 족보를 노릴지!`], 'Enter 키 또는 화면을 눌러 시작');
  else if (S.phase === 'over') overlay('GAME OVER', '#ff6a6a', [`웨이브 ${S.wave}에서 무너졌다 · 처치 ${S.kills}`], 'R 키 또는 화면을 눌러 다시');
  else if (S.phase === 'win') overlay('ALL CLEAR', '#ffd96a', [`${WAVES} 웨이브를 모두 막았다 · 남은 목숨 ${S.lives} · 처치 ${S.kills}`], 'R 키 또는 화면을 눌러 다시');
}

// ---------------------------------------------------------------- 소리 (테트리스 포커와 같은 합성 효과음)
let muted = false, actx = null; const sfxBuf = {};
function audioCtx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function sfx(name, a = 0, b = 0) {
  if (muted || !window.TP_SOUNDS) return; const ctx = audioCtx(); if (!ctx) return;
  if (name === 'Burst') a = Math.min(8, Math.max(1, a)); if (name === 'Straight') a = Math.min(7, Math.max(3, a));
  const key = `${name}_${a}_${b}`, src = window.TP_SOUNDS[key]; if (!src) return;
  const play = buf => { const sn = ctx.createBufferSource(); sn.buffer = buf; const gn = ctx.createGain(); gn.gain.value = .7; sn.connect(gn).connect(ctx.destination); sn.start(); };
  const c = sfxBuf[key]; if (c instanceof AudioBuffer) { play(c); return; } if (c) return;
  sfxBuf[key] = 'loading';
  const bin = atob(src.split(',')[1]), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  ctx.decodeAudioData(arr.buffer).then(buf => { sfxBuf[key] = buf; play(buf); }).catch(() => { sfxBuf[key] = null; });
}

// ---------------------------------------------------------------- 입력과 루프
function toCanvas(ev) { const r = cv.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H); return [(ev.clientX - r.left - (r.width - W * s) / 2) / s, (ev.clientY - r.top - (r.height - H * s) / 2) / s]; }
const cellAt = (x, y) => { const cx = Math.floor((x - FX) / CS), cy = Math.floor((y - FY) / CS); return cx >= 0 && cy >= 0 && cx < COLS && cy < ROWS ? { x: cx, y: cy } : null; };
const handAt = (x, y) => { for (let i = 0; i < S.hand.length; i++) { const hx = FX + 96 + i * (CARD_W + 10); if (x >= hx && x <= hx + CARD_W && y >= HAND_Y - 12 && y <= HAND_Y + CARD_H) return i; } return -1; };
cv.addEventListener('contextmenu', ev => ev.preventDefault());
const rewardAt = (x, y) => { for (let i = 0; i < 3; i++) { const rx = FX + COLS * CS / 2 - 360 + i * 250, ry = FY + 160; if (x >= rx && x <= rx + 220 && y >= ry && y <= ry + 170) return i; } return -1; };
cv.addEventListener('pointermove', ev => { const [x, y] = toCanvas(ev); S.hover = cellAt(x, y); S.rewardHover = S.phase === 'reward' ? rewardAt(x, y) : -1; });
cv.addEventListener('pointerdown', ev => {
  if (S.phase === 'title') { S.phase = 'build'; sfx('Start'); return; }
  if (S.phase === 'over' || S.phase === 'win') { newGame(true); return; }
  const [x, y] = toCanvas(ev), hi = handAt(x, y), cell = cellAt(x, y);
  if (S.phase === 'reward') { const ri = rewardAt(x, y); if (ri >= 0) takeReward(ri); return; }
  if (ev.button === 2) { if (hi >= 0) discardCard(hi); else S.sel = -1; return; }
  if (hi >= 0) { S.sel = S.sel === hi ? -1 : hi; sfx('Move'); return; }
  if (cell && S.sel >= 0) { if (!place(S.sel, cell.x, cell.y)) sfx('Denied'); return; }
  if (S.phase === 'build' && x >= RX + 16 && x <= RX + 216 && y >= FY + 96 && y <= FY + 134) startWave();
});
addEventListener('keydown', e => {
  if (e.key === ' ') e.preventDefault();
  if (S.phase === 'title') { if (e.key === 'Enter' || e.key === ' ') { S.phase = 'build'; sfx('Start'); } return; }
  if (S.phase === 'over' || S.phase === 'win') { if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') newGame(true); return; }
  if (S.phase === 'reward') { if (e.key >= '1' && e.key <= '3') takeReward(+e.key - 1); else if (e.key === 's' || e.key === 'S') takeReward(-1); return; }
  if (e.key >= '1' && e.key <= '9') { const i = +e.key - 1; if (i < S.hand.length) { S.sel = S.sel === i ? -1 : i; sfx('Move'); } }
  else if (e.key === ' ' || e.key === 'Enter') startWave();
  else if (e.key === 'Escape') S.sel = -1;
  else if (e.key === 'f' || e.key === 'F') S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
  else if (e.key === 'm' || e.key === 'M') muted = !muted;
});
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { for (let k = 0; k < S.speed; k++) update(dt); S.texts.forEach(t => t.t -= dt); S.texts = S.texts.filter(t => t.t > 0); S.fx.forEach(f => f.t -= dt); S.fx = S.fx.filter(f => f.t > 0); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
newGame();
window.__pd = () => S;
window.__api = { takeReward, rollRewards, JOKERS, INSTANTS, ENEMY, makeEnemy, waveSpec, hit, windowHands, synergies, applyEffects, towerStats, place, startWave, update, render, newGame, buildable, center, discardCard, setPath, genPath, pathLen: () => PATH_LEN, pathCells: () => PATH_CELLS, setMuted: v => { muted = v; }, COLS, ROWS, CS, WAVES, posAt };
requestAnimationFrame(frame);
</script>
