<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Defense</title>
<style>
  :root { --bg:#06060b; --fg:#cfd8e6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100%;max-width:1280px;max-height:100%;object-fit:contain;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../tetris-poker/sounds.js"></script>
<script>
'use strict';
// =====================================================================
// 포커 디펜스 (가칭) 프로토타입 v1: 핵심 루프만
//  웨이브 사이에 카드를 뽑는다 → 카드를 맵에 놓아 타워로 세우거나 손에 아껴 둔다 → 웨이브를 막는다
//  - 카드 한 장 = 타워 하나. 무늬 = 공격 방식, 숫자 = 공격력
//  - 가로나 세로로 한 줄로 붙은 타워들이 족보가 되면 시너지 (가로·세로 둘 다 걸리면 둘 다 받음)
//  - 족보마다 효과가 다르다: 페어 공격력, 스트레이트 연사, 플러시 범위, 풀하우스 범위+연사, 포카드 한 방
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 720;
const COLS = 16, ROWS = 10, CS = 54, FX = 24, FY = 24;
const HAND_Y = FY + ROWS * CS + 22, CARD_W = 66, CARD_H = 92, HAND_MAX = 7;
const RX = FX + COLS * CS + 26;
const WAVES = 15, START_LIVES = 20, START_HAND = 5, DRAW_PER_WAVE = 3;
// 무늬 = 공격 방식 (도형과 색)
const SUIT = {
  '♠': { name: '저격', desc: '사거리 길고 한 방이 셈', col: '#7fb8ff', shape: 'tri',     dmg: 1.6,  rate: 0.8, range: 3.0 },
  '♥': { name: '폭발', desc: '맞은 자리 주변도 피해', col: '#ff6a8a', shape: 'circle',  dmg: 0.9,  rate: 0.9, range: 2.2, splash: 0.8 },
  '♦': { name: '연사', desc: '약하지만 아주 빠름',   col: '#ffd96a', shape: 'diamond', dmg: 0.45, rate: 2.6, range: 2.2 },
  '♣': { name: '둔화', desc: '맞은 적이 느려짐',     col: '#8affc4', shape: 'square',  dmg: 0.7,  rate: 1.0, range: 2.4, slow: 0.4 },
};
const SUITS = ['♠', '♥', '♦', '♣'];
const RANK_TXT = r => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
// 족보 = 시너지 효과
const HANDS = {
  straightFlush: { name: '스트레이트 플러시', n: [5],       val: 100, col: '#ff9ad5', eff: '공격력 ×2 · 연사 ×2 · 범위' },
  four:          { name: '포카드',            n: [4],       val: 90,  col: '#ff6a6a', eff: '공격력 ×3.5' },
  fullHouse:     { name: '풀하우스',          n: [5],       val: 80,  col: '#ffa86a', eff: '공격력 ×1.5 · 연사 ×1.5 · 범위' },
  flush:         { name: '플러시',            n: [3, 4, 5], val: 30,  col: '#ff9ad5', eff: '범위 공격 (장수만큼 넓게)' },
  straight:      { name: '스트레이트',        n: [2, 3, 4, 5], val: 28, col: '#7fd6ff', eff: '연사 ×1.25 / ×1.5 / ×1.75 / ×2' },
  triple:        { name: '트리플',            n: [3],       val: 60,  col: '#ffd96a', eff: '공격력 ×2' },
  twoPair:       { name: '투 페어',           n: [4],       val: 45,  col: '#cfe4ff', eff: '공격력 ×1.5 · 사거리 ×1.25' },
  pair:          { name: '원 페어',           n: [2],       val: 20,  col: '#cfd8e6', eff: '공격력 ×1.5' },
};
const HAND_ORDER = ['straightFlush', 'four', 'fullHouse', 'flush', 'straight', 'triple', 'twoPair', 'pair'];

// ---------------------------------------------------------------- 족보 판정 (줄 안의 연속 2~5장, 순서 상관없음)
function windowHands(cards) {
  const n = cards.length, ranks = cards.map(c => c.r), cnt = {};
  ranks.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  const vals = Object.values(cnt).sort((a, b) => b - a), sameSuit = cards.every(c => c.s === cards[0].s);
  const distinct = vals.length === n, sorted = ranks.slice().sort((a, b) => a - b);
  const consec = arr => arr.every((r, i) => !i || r === arr[i - 1] + 1);
  const straight = distinct && (consec(sorted) || consec(sorted.map(r => r === 14 ? 1 : r).sort((a, b) => a - b)));
  const out = [];
  if (n === 2 && vals[0] === 2) out.push('pair');
  if (n === 3 && vals[0] === 3) out.push('triple');
  if (n === 4 && vals[0] === 4) out.push('four');
  if (n === 4 && vals[0] === 2 && vals[1] === 2) out.push('twoPair');
  if (n === 5 && vals[0] === 3 && vals[1] === 2) out.push('fullHouse');
  if (n >= 3 && sameSuit && straight && n === 5) out.push('straightFlush');
  if (n >= 3 && sameSuit) out.push('flush');
  if (n >= 2 && straight) out.push('straight'); // 이어진 숫자는 2장부터 (페어와 맞춤)
  return out;
}
// 같은 족보라도 장수가 많으면 더 크게 친다 (플러시·스트레이트)
const handValue = (key, n) => HANDS[key].val + (key === 'flush' || key === 'straight' ? (n - 3) * 22 : 0);
// 줄(가로·세로)마다 연속된 타워 덩어리 안에서 겹치지 않게 큰 족보부터 고른다
function synergies(towers) {
  const lines = [];
  for (let y = 0; y < ROWS; y++) { let run = []; for (let x = 0; x <= COLS; x++) { const t = towers.get(x + ',' + y); if (t) run.push(t); else { if (run.length >= 2) lines.push(run); run = []; } } }
  for (let x = 0; x < COLS; x++) { let run = []; for (let y = 0; y <= ROWS; y++) { const t = towers.get(x + ',' + y); if (t) run.push(t); else { if (run.length >= 2) lines.push(run); run = []; } } }
  const picked = [];
  for (const run of lines) {
    const cands = [];
    for (let i = 0; i < run.length; i++) for (let n = 2; n <= 5 && i + n <= run.length; n++) {
      const win = run.slice(i, i + n);
      for (const key of windowHands(win.map(t => t.card))) cands.push({ key, i, n, val: handValue(key, n), towers: win });
    }
    cands.sort((a, b) => b.val - a.val || b.n - a.n);
    const used = new Set();
    for (const c of cands) { if (c.towers.some(t => used.has(t))) continue; c.towers.forEach(t => used.add(t)); picked.push(c); }
  }
  return picked;
}
function applyEffects(towers) {
  const syn = synergies(towers);
  for (const t of towers.values()) t.eff = { dmg: 1, rate: 1, range: 1, splash: 0, hands: [] };
  for (const s of syn) for (const t of s.towers) {
    const e = t.eff; e.hands.push(s.key);
    switch (s.key) {
      case 'pair': e.dmg *= 1.5; break;
      case 'twoPair': e.dmg *= 1.5; e.range *= 1.25; break;
      case 'triple': e.dmg *= 2; break;
      case 'straight': e.rate *= 1 + 0.25 * (s.n - 1); break;
      case 'flush': e.splash = Math.max(e.splash, 0.5 + 0.25 * s.n); break;
      case 'fullHouse': e.dmg *= 1.5; e.rate *= 1.5; e.splash = Math.max(e.splash, 1.5); break;
      case 'four': e.dmg *= 3.5; break;
      case 'straightFlush': e.dmg *= 2; e.rate *= 2; e.splash = Math.max(e.splash, 2); break;
    }
  }
  return syn;
}
function towerStats(t) {
  const s = SUIT[t.card.s], e = t.eff || { dmg: 1, rate: 1, range: 1, splash: 0 };
  return { dmg: (3 + t.card.r) * s.dmg * e.dmg, rate: s.rate * e.rate, range: s.range * e.range, splash: Math.max(s.splash || 0, e.splash), slow: s.slow || 0 };
}

// ---------------------------------------------------------------- 길
const center = (x, y) => [FX + x * CS + CS / 2, FY + y * CS + CS / 2];
// 길은 판마다 새로 만든다 (setPath)
let PATH = [], PATH_PX = [], SEG = [], PATH_LEN = 0, PATH_CELLS = new Set();
function setPath(path) {
  PATH = path; PATH_PX = PATH.map(([x, y]) => center(x, y)); SEG = []; PATH_LEN = 0; PATH_CELLS = new Set();
  for (let i = 1; i < PATH_PX.length; i++) { const [ax, ay] = PATH_PX[i - 1], [bx, by] = PATH_PX[i], l = Math.hypot(bx - ax, by - ay); SEG.push({ ax, ay, bx, by, l, d0: PATH_LEN }); PATH_LEN += l; }
  for (let i = 1; i < PATH.length; i++) { const [ax, ay] = PATH[i - 1], [bx, by] = PATH[i], dx = Math.sign(bx - ax), dy = Math.sign(by - ay); let x = ax, y = ay; while (true) { if (x >= 0 && x < COLS) PATH_CELLS.add(x + ',' + y); if (x === bx && y === by) break; x += dx; y += dy; } }
}
// 무작위 지그재그 길: 왼쪽 밖에서 들어와 오른쪽 밖으로 나간다.
// 가로로 2~4칸 가고 위아래로 2칸 이상 꺾기를 반복. 세로 구간끼리는 한 칸 이상 떨어져 서로 붙지 않는다.
// 길이가 PATH_MIN~PATH_MAX 칸일 때만 받아서 판마다 난이도가 크게 흔들리지 않게 한다.
const PATH_MIN = 34, PATH_MAX = 46;
function genPath() {
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  for (let tries = 0; tries < 500; tries++) {
    let x = -1, y = ri(1, ROWS - 2); const pts = [[x, y]];
    while (true) {
      const nx = x + ri(2, 4);
      if (nx >= COLS - 2) { pts.push([COLS, y]); break; }
      pts.push([nx, y]); x = nx;
      let ny; do ny = ri(1, ROWS - 2); while (Math.abs(ny - y) < 2);
      pts.push([x, ny]); y = ny;
    }
    let cells = 0; for (let i = 1; i < pts.length; i++) cells += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
    if (cells >= PATH_MIN && cells <= PATH_MAX) return pts;
  }
  return [[-1, 1], [3, 1], [3, 7], [7, 7], [7, 2], [11, 2], [11, 8], [14, 8], [14, 4], [16, 4]];
}
function posAt(d) { for (const s of SEG) if (d <= s.d0 + s.l) { const u = (d - s.d0) / s.l; return [s.ax + (s.bx - s.ax) * u, s.ay + (s.by - s.ay) * u]; } const s = SEG[SEG.length - 1]; return [s.bx, s.by]; }
const buildable = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !PATH_CELLS.has(x + ',' + y);

// ---------------------------------------------------------------- 상태
let S;
function newGame(start = false) {
  setPath(genPath());
  S = { phase: start ? 'build' : 'title', wave: 0, lives: START_LIVES, deck: [], hand: [], towers: new Map(), syn: [], enemies: [], spawn: [], spawnT: 0,
    sel: -1, hover: null, fx: [], texts: [], speed: 1, now: 0, kills: 0, leaks: 0, discarded: 0 };
  for (const s of SUITS) for (let r = 2; r <= 14; r++) S.deck.push({ r, s });
  for (let i = S.deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.deck[i], S.deck[j]] = [S.deck[j], S.deck[i]]; }
  draw(START_HAND);
}
function draw(n) { let got = 0; while (got < n && S.hand.length < HAND_MAX && S.deck.length) { S.hand.push(S.deck.pop()); got++; } return got; }
function waveSpec(w) {
  const list = [], hp = 26 * Math.pow(1.35, w - 1), n = 8 + w * 2;
  for (let i = 0; i < n; i++) {
    let type = 'normal';
    if (w >= 3 && i % 4 === 3) type = 'fast';
    if (w >= 5 && i % 6 === 5) type = 'tank';
    list.push(type);
  }
  if (w % 5 === 0) list.push('boss');
  return list.map(type => ({ type, hp: hp * ({ normal: 1, fast: 0.6, tank: 2.6, boss: 14 })[type], speed: ({ normal: 1.1, fast: 1.9, tank: 0.7, boss: 0.55 })[type] }));
}
function startWave() {
  if (S.phase !== 'build') return;
  S.wave++; S.phase = 'wave'; S.spawn = waveSpec(S.wave); S.spawnT = 0; S.sel = -1; sfx('Start');
}
function endWave() {
  if (S.wave >= WAVES) { S.phase = 'win'; sfx('Win'); return; }
  const got = draw(DRAW_PER_WAVE); S.phase = 'build';
  popText(`웨이브 ${S.wave} 막음! 카드 +${got}${got < DRAW_PER_WAVE ? ' (손패 가득)' : ''}`, FX + COLS * CS / 2, FY + 60, '#9cffb0', true); sfx('Clear');
}
function place(handIdx, x, y) {
  if (S.phase === 'title' || S.phase === 'over' || S.phase === 'win') return false;
  if (handIdx < 0 || handIdx >= S.hand.length || !buildable(x, y)) return false;
  const key = x + ',' + y, old = S.towers.get(key), card = S.hand.splice(handIdx, 1)[0];
  if (old) { S.discarded++; popText(`${RANK_TXT(old.card.r)}${old.card.s} 교체`, ...center(x, y), '#8a94a6'); }
  const before = new Set(S.syn.map(s => s.key + s.towers.map(t => t.x + ',' + t.y).join()));
  S.towers.set(key, { card, x, y, cd: 0, eff: null });
  S.syn = applyEffects(S.towers);
  const fresh = S.syn.filter(s => !before.has(s.key + s.towers.map(t => t.x + ',' + t.y).join()) && s.towers.some(t => t.x === x && t.y === y));
  if (fresh.length) { const best = fresh.sort((a, b) => b.val - a.val)[0]; const [cx, cy] = midOf(best); popText(`${HANDS[best.key].name}${best.key === 'flush' || best.key === 'straight' ? ' ' + best.n : ''}!`, cx, cy - 18, HANDS[best.key].col, true);
    sfx('Burst', Math.min(8, Math.round(best.val / 15)), best.val >= 80 ? 2 : best.val >= 50 ? 1 : 0); if (best.key === 'flush' || best.key === 'straightFlush') sfx('Flush'); }
  else sfx('Lock');
  S.sel = -1; return true;
}
function discardCard(i) { if (i < 0 || i >= S.hand.length) return; S.hand.splice(i, 1); S.discarded++; if (S.sel === i) S.sel = -1; else if (S.sel > i) S.sel--; sfx('HardDrop'); }
const midOf = s => { const ps = s.towers.map(t => center(t.x, t.y)); return [ps.reduce((a, p) => a + p[0], 0) / ps.length, ps.reduce((a, p) => a + p[1], 0) / ps.length]; };
function popText(s, x, y, col, big = false) { S.texts.push({ s, x, y, col, t: 1.3, big }); }

// ---------------------------------------------------------------- 진행
function update(dt) {
  S.now += dt;
  if (S.phase !== 'wave') return;
  // 적 등장
  S.spawnT -= dt;
  if (S.spawn.length && S.spawnT <= 0) { const e = S.spawn.shift(); S.enemies.push({ ...e, maxHp: e.hp, d: 0, slowT: 0 }); S.spawnT = e.type === 'boss' ? 1.2 : 0.65; }
  // 이동
  for (const e of S.enemies) {
    e.slowT = Math.max(0, e.slowT - dt);
    e.d += e.speed * CS * (e.slowT > 0 ? 1 - e.slowAmt : 1) * dt;
    if (e.d >= PATH_LEN) { e.dead = true; e.leaked = true; const loss = e.type === 'boss' ? 5 : 1; S.lives -= loss; S.leaks++; popText(`-${loss}`, RX - 30, FY + 4 * CS, '#ff6a6a', true); sfx('Denied'); }
  }
  // 타워 공격
  for (const t of S.towers.values()) {
    t.cd -= dt; if (t.cd > 0) continue;
    const st = towerStats(t), [tx, ty] = center(t.x, t.y), r = st.range * CS;
    let target = null;
    for (const e of S.enemies) { if (e.dead) continue; const [ex, ey] = posAt(e.d); if (Math.hypot(ex - tx, ey - ty) <= r && (!target || e.d > target.d)) target = e; }
    if (!target) continue;
    t.cd = 1 / st.rate;
    const [ex, ey] = posAt(target.d);
    hit(target, st.dmg, st.slow);
    if (st.splash > 0) { const rr = st.splash * CS; for (const o of S.enemies) { if (o === target || o.dead) continue; const [ox, oy] = posAt(o.d); if (Math.hypot(ox - ex, oy - ey) <= rr) hit(o, st.dmg * 0.6, st.slow); } S.fx.push({ kind: 'ring', x: ex, y: ey, r: rr, col: SUIT[t.card.s].col, t: .25 }); }
    S.fx.push({ kind: 'shot', x1: tx, y1: ty, x2: ex, y2: ey, col: SUIT[t.card.s].col, t: .12 });
  }
  S.enemies = S.enemies.filter(e => !e.dead);
  if (S.lives <= 0) { S.lives = 0; S.phase = 'over'; sfx('GameOver'); return; }
  if (!S.spawn.length && !S.enemies.length) endWave();
}
function hit(e, dmg, slow) { e.hp -= dmg; if (slow) { e.slowT = 1.2; e.slowAmt = Math.max(e.slowAmt || 0, slow); } if (e.hp <= 0 && !e.dead) { e.dead = true; S.kills++; const [x, y] = posAt(e.d); S.fx.push({ kind: 'pop', x, y, t: .3, col: '#ffffff' }); } }

// ---------------------------------------------------------------- 그리기
const glow = (col, b = 10) => { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = b; };
function text(s, x, y, col = '#cfd8e6', size = 13, align = 'left', weight = '') { g.shadowBlur = 0; g.fillStyle = col; g.font = `${weight} ${size}px "DejaVu Sans Mono", "Noto Sans KR", monospace`; g.textAlign = align; g.fillText(s, x, y); g.textAlign = 'left'; }
function panel(x, y, w, h) { g.shadowBlur = 0; g.strokeStyle = 'rgba(127,214,255,.3)'; g.lineWidth = 1; g.strokeRect(x, y, w, h); }
function shapePath(shape, cx, cy, r) {
  g.beginPath();
  if (shape === 'tri') { g.moveTo(cx, cy - r); g.lineTo(cx + r * .9, cy + r * .72); g.lineTo(cx - r * .9, cy + r * .72); g.closePath(); }
  else if (shape === 'circle') g.arc(cx, cy, r * .86, 0, Math.PI * 2);
  else if (shape === 'diamond') { g.moveTo(cx, cy - r); g.lineTo(cx + r * .8, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r * .8, cy); g.closePath(); }
  else g.rect(cx - r * .76, cy - r * .76, r * 1.52, r * 1.52);
}
// 카드(=타워) 도형: 무늬 모양과 색, 안에 숫자
function cardShape(card, cx, cy, r, o = {}) {
  const s = SUIT[card.s]; g.globalAlpha = o.alpha ?? 1;
  g.lineWidth = o.strong ? 2.6 : 1.8; glow(s.col, o.strong ? 18 : 9); shapePath(s.shape, cx, cy, r); g.stroke();
  if (o.strong) { g.globalAlpha *= .12; g.fill(); g.globalAlpha = o.alpha ?? 1; }
  text(RANK_TXT(card.r), cx, cy + (s.shape === 'tri' ? r * .38 : r * .3), s.col, Math.round(r * (card.r === 10 ? .62 : .78)), 'center', 'bold');
  g.globalAlpha = 1;
}
// 족보에 든 연속 칸들을 둥근 테두리 하나로 감싼다 (도형 안 숫자를 가리지 않게)
function drawSynLine(s, alpha = 1) {
  const h = HANDS[s.key], xs = s.towers.map(t => t.x), ys = s.towers.map(t => t.y);
  const x0 = FX + Math.min(...xs) * CS + 3, y0 = FY + Math.min(...ys) * CS + 3, w = (Math.max(...xs) - Math.min(...xs) + 1) * CS - 6, hh = (Math.max(...ys) - Math.min(...ys) + 1) * CS - 6;
  g.globalAlpha = alpha; g.beginPath(); if (g.roundRect) g.roundRect(x0, y0, w, hh, CS * .42); else g.rect(x0, y0, w, hh);
  g.shadowBlur = 0; g.fillStyle = h.col; g.globalAlpha = alpha * .07; g.fill();
  g.globalAlpha = alpha; g.lineWidth = 2; glow(h.col, 10); g.stroke();
  g.globalAlpha = 1;
}
// 족보 이름표: 칸 가장자리에 어두운 바탕으로 (타워 위에 그려 읽기 쉽게)
function drawSynBadge(s, alpha = 1) {
  // 테두리 위쪽 가장자리 가운데에 붙인다 (옆 줄을 가리지 않게)
  const h = HANDS[s.key], mx = midOf(s)[0], top = FY + Math.min(...s.towers.map(t => t.y)) * CS + 3;
  const label = `${h.name}${s.key === 'flush' || s.key === 'straight' ? s.n : ''}`;
  g.font = 'bold 11px "DejaVu Sans Mono", "Noto Sans KR", monospace'; const w = g.measureText(label).width + 10, hh = 16;
  const bx = mx - w / 2, by = top - hh / 2;
