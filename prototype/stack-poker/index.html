<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Poker</title>
<style>
  :root { --bg:#06060b; --fg:#cfd8e6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{display:block;width:100%;max-width:1280px;max-height:calc(100% - 80px);object-fit:contain;touch-action:none}
  #touch{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  #touch button{font:600 16px/1 "DejaVu Sans Mono","Noto Sans KR",monospace;color:#cfd8e6;background:transparent;border:1px solid rgba(127,214,255,.45);border-radius:6px;min-width:64px;height:48px;touch-action:manipulation}
  #touch button:active{background:rgba(127,214,255,.15)}
  #touch button:focus-visible{outline:2px solid #7fd6ff}
  @media (pointer: coarse){ #touch{display:flex} }
  @media (pointer: fine){ canvas{max-height:100%} } /* 데스크톱은 터치 버튼 자리를 비우지 않는다 */
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="touch" aria-label="터치 조작">
  <button data-a="play" aria-label="족보 내기">내기</button>
  <button data-a="clear" aria-label="선택 취소">취소</button>
  <button data-a="discard" aria-label="버리기">버리기</button>
  <button data-a="bomb" aria-label="폭탄">폭탄</button>
  <button data-a="mute" aria-label="소리 켜기/끄기">♪</button>
</div>
<script src="../tetris-poker/sounds.js"></script>
<script>
'use strict';
// =====================================================================
// 스택 포커 v2 (가제): 내려오는 카드를 골라 족보를 만드는 4줄 퍼즐
// 참고: 액션퍼즐패밀리의 줄 쌓기 모드. 색 맞추기 대신 포커 족보.
//  - 카드 4줄이 위에 매달려 있고, 위에서 새 카드가 계속 밀고 내려온다
//  - 내려오는 카드 중에서 클릭해 고른다 (어느 줄이든 섞어 골라도 됨)
//  - 고른 카드가 족보면 내서 터뜨린다 (Space 또는 오른쪽 클릭). 원 페어도 되지만 콤보 단계는 안 오름
//  - 터진 카드 아래 카드는 위로 붙어 올라간다
//  - 4초 안에 다음 족보를 내면 콤보 배수, 줄이 경고선에 닿으면 줄 폭발과 시간 -8초
//  - 막히면 버리기(카드 1~2장, 시간 -3초), 폭탄 게이지가 차면 모든 줄 맨 아래 2장 폭파
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 720;
const NCOL = 4, CW = 168, GAP = 12, FX = 286, FY = 64, CH = 46, MAXH = 12; // 카드 168x46
const PICK_DEPTH = 99;                   // 각 줄 맨 아래 몇 장까지 고를 수 있나 (99 = 전부)
const DANGER_Y = FY + MAXH * CH;
const colX = i => FX + i * (CW + GAP);
const FIELD_R = colX(NCOL - 1) + CW;
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_COL = { '♠': '#cfe4ff', '♥': '#ff6a8a', '♦': '#ffa86a', '♣': '#8affc4' };
const JOKER_COL = '#ff9ad5';
const RANKS = [1, 2, 3, 4, 5, 6, 7];
const RANK_TXT = r => r === 1 ? 'A' : String(r);
const chipOf = c => c.joker ? 10 : c.r === 1 ? 11 : c.r;
const TIME_LIMIT = 90, JOKER_RATE = 0.03, COMBO_WINDOW = 5, DISCARD_COST = 3, EXPLODE_COST = 8;

// ---------------------------------------------------------------- 족보 (고른 카드 전부가 족보를 이뤄야 함, 순서 상관없음)
const HANDS = {
  straightFlush: { name: '스트레이트 플러시', chips: 100, mult: 8, cond: '같은 무늬로 숫자 5개 연속' },
  five:          { name: '파이브 카드',       chips: 80,  mult: 8, cond: '같은 숫자 5장' },
  four:          { name: '포카드',            chips: 50,  mult: 5, cond: '같은 숫자 4장' },
  fullHouse:     { name: '풀하우스',          chips: 40,  mult: 4, cond: '같은 숫자 3장 + 2장' },
  flush:         { name: '플러시',            chips: 35,  mult: 4, cond: '같은 무늬 5장' },
  straight:      { name: '스트레이트',        chips: 30,  mult: 3, cond: '숫자 4~5개 연속 (예: 3 4 5 6)' },
  triple:        { name: '트리플',            chips: 20,  mult: 2, cond: '같은 숫자 3장' },
  twoPair:       { name: '투 페어',           chips: 15,  mult: 2, cond: '페어 두 쌍 (4장)' },
  onePair:       { name: '원 페어',           chips: 10,  mult: 1, cond: '같은 숫자 2장 · 콤보 시간만 이어줌' },
};
const HAND_ORDER = ['straightFlush', 'five', 'four', 'fullHouse', 'flush', 'straight', 'triple', 'twoPair', 'onePair'];
function classify(cards) {
  const n = cards.length, real = cards.filter(c => !c.joker);
  const cnt = {}; real.forEach(c => cnt[c.r] = (cnt[c.r] || 0) + 1);
  const vals = Object.values(cnt), distinct = vals.length, maxCnt = Math.max(0, ...vals);
  const sameRank = distinct <= 1, sameSuit = new Set(real.map(c => c.s)).size <= 1;
  let straight = false;
  if (distinct === real.length) {
    if (!real.length) straight = true;
    else { const lo = Math.min(...real.map(c => c.r)), hi = Math.max(...real.map(c => c.r)); straight = Math.max(1, hi - n + 1) <= Math.min(lo, 8 - n); }
  }
  const out = [];
  if (n === 2 && sameRank) out.push('onePair');
  if (n === 3 && sameRank) out.push('triple');
  if (n === 4) { if (sameRank) out.push('four'); if (straight) out.push('straight'); if (distinct <= 2 && maxCnt <= 2) out.push('twoPair'); }
  if (n === 5) { if (sameRank) out.push('five'); if (straight && sameSuit) out.push('straightFlush'); if (distinct <= 2 && maxCnt <= 3) out.push('fullHouse'); if (sameSuit) out.push('flush'); if (straight) out.push('straight'); }
  return out;
}
function evalHand(cards) {
  let best = null;
  for (const key of classify(cards)) {
    const h = HANDS[key], chips = h.chips + cards.reduce((s, c) => s + chipOf(c), 0), score = chips * h.mult;
    if (!best || score > best.score) best = { key, name: h.name, chips, mult: h.mult, score };
  }
  return best;
}
const comboMult = c => Math.min(3, 1 + 0.25 * Math.max(0, c - 1)); // 최대 ×3

// ---------------------------------------------------------------- 상태
let S;
function newGame() {
  S = { phase: S && S.phase !== 'title' ? 'play' : 'title', cols: [[], [], [], []], sel: [], deck: [], score: 0, time: TIME_LIMIT, elapsed: 0,
    combo: 0, comboT: 0, maxCombo: 0, bomb: 0, pushT: 1.5, fx: [], texts: [], last: null, hands: 0, explodes: 0, discards: 0, now: 0, shake: 0,
    best: S ? S.best : loadBest(), newBest: false, paused: false, cursor: { col: 0, row: 0 } };
  for (let i = 0; i < NCOL; i++) for (let k = 0; k < 7; k++) { const c = drawCard(false); S.cols[i].unshift(c); }
  S.cols.forEach(col => col.forEach((c, k) => c.y = FY + k * CH));
}
function loadBest() { try { return +localStorage.getItem('stackPokerBest2') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('stackPokerBest2', String(v)); } catch (e) {} }
function drawCard(allowJoker = true) {
  if (allowJoker && Math.random() < JOKER_RATE) return { joker: true, y: FY - CH };
  if (!S.deck.length) { for (let k = 0; k < 2; k++) for (const s of SUITS) for (const r of RANKS) S.deck.push({ r, s }); for (let i = S.deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.deck[i], S.deck[j]] = [S.deck[j], S.deck[i]]; } }
  const c = S.deck.pop(); return { r: c.r, s: c.s, y: FY - CH };
}
const pushInterval = () => Math.max(0.48, 1.1 - S.elapsed * 0.0063); // 처음 초당 약 0.9장 → 90초 무렵 약 2.1장
const colOf = c => S.cols.findIndex(col => col.includes(c));
const pickable = c => { const i = colOf(c); if (i < 0) return false; const col = S.cols[i]; return col.indexOf(c) >= col.length - PICK_DEPTH; };
const selHand = () => S.sel.length >= 2 ? evalHand(S.sel) : null;
// 원 페어는 콤보 단계를 올리지 않고 콤보 시간만 이어준다
const handComboMult = h => h && h.key === 'onePair' ? (S.comboT > 0 ? comboMult(S.combo) : 1) : comboMult(S.comboT > 0 ? S.combo + 1 : 1);

// ---------------------------------------------------------------- 조작
function toggle(c) {
  if (S.phase !== 'play' || !pickable(c)) return;
  const k = S.sel.indexOf(c);
  if (k >= 0) S.sel.splice(k, 1); else if (S.sel.length < 5) S.sel.push(c); else return;
  sfx(k >= 0 ? 'Lock' : 'Move');
}
// 키보드 커서: row는 줄 맨 아래부터 몇 번째 카드인지 (위에서 카드가 밀려 와도 아래 카드에 붙어 있다)
function cursorCard() { const col = S.cols[S.cursor.col]; if (!col.length) return null; return col[col.length - 1 - Math.min(S.cursor.row, col.length - 1)]; }
function moveCursor(dc, dr) {
  if (S.phase !== 'play') return;
  const cu = S.cursor, len = S.cols[cu.col].length;
  if (dc) cu.col = (cu.col + dc + NCOL) % NCOL;
  if (dr) cu.row = Math.max(0, Math.min(Math.max(0, len - 1), Math.min(cu.row, Math.max(0, len - 1)) + dr));
}
function toggleCursor() { const c = cursorCard(); if (c) toggle(c); }
function clearSel() { if (S.sel.length) { S.sel = []; sfx('Lock'); } }
function removeCards(cards, kind) {
  for (const c of cards) { const i = colOf(c); if (i < 0) continue; const col = S.cols[i]; col.splice(col.indexOf(c), 1); S.fx.push({ kind, x: colX(i), y: c.y, c, t: .45 }); }
}
function playHand() {
  if (S.phase !== 'play') return;
  const h = selHand();
  if (!h) { if (S.sel.length) { popText(S.sel.length < 2 ? '2장 이상 골라야 한다' : '족보가 아니다', (FX + FIELD_R) / 2, DANGER_Y + 40, '#ff6a6a'); sfx('Denied'); } return; }
  const cm = handComboMult(h);
  if (h.key === 'onePair') { if (S.comboT > 0) S.comboT = COMBO_WINDOW; }
  else { S.combo = S.comboT > 0 ? S.combo + 1 : 1; S.comboT = COMBO_WINDOW; S.maxCombo = Math.max(S.maxCombo, S.combo); }
  const sc = Math.round(h.score * cm);
  const cx = S.sel.reduce((a, c) => a + colX(colOf(c)) + CW / 2, 0) / S.sel.length, cy = S.sel.reduce((a, c) => a + c.y, 0) / S.sel.length;
  removeCards(S.sel, 'burst'); S.sel = [];
  S.score += sc; S.hands++; S.bomb = Math.min(100, S.bomb + 8 + h.chips / 8);
  S.last = { name: h.name, chips: h.chips, mult: h.mult, cm, score: sc };
  popText(`${h.name}  ${h.chips}×${h.mult}`, cx, cy, h.key === 'flush' || h.key === 'straightFlush' ? '#ff9ad5' : '#ffd96a');
  popText(`+${sc.toLocaleString()}${cm > 1 ? `  콤보 ${S.combo} ×${cm}` : ''}`, cx, cy + 24, S.combo > 1 ? '#9cffb0' : '#ffffff', true);
  sfx('Burst', S.combo, h.key === 'five' || h.key === 'straightFlush' ? 2 : ['four', 'fullHouse', 'flush'].includes(h.key) ? 1 : 0);
  if (h.key === 'flush' || h.key === 'straightFlush') sfx('Flush');
  if (h.key === 'straight' || h.key === 'straightFlush') sfx('Straight', 4);
}
function discard() {
  if (S.phase !== 'play') return;
  if (!S.sel.length || S.sel.length > 2) { popText('버리기: 카드를 1~2장 고른 뒤', (FX + FIELD_R) / 2, DANGER_Y + 40, '#8a94a6'); sfx('Denied'); return; }
  removeCards(S.sel, 'drop'); S.sel = []; S.time = Math.max(0, S.time - DISCARD_COST); S.discards++; S.combo = 0; S.comboT = 0;
  popText(`버림  시간 -${DISCARD_COST}초`, (FX + FIELD_R) / 2, DANGER_Y + 40, '#8a94a6'); sfx('HardDrop');
}
function bomb() {
  if (S.phase !== 'play' || S.bomb < 100) return;
  S.bomb = 0; let sc = 0; const cards = [];
  S.cols.forEach(col => cards.push(...col.slice(-2)));
  sc = cards.reduce((s, c) => s + chipOf(c), 0) * 2;
  S.sel = S.sel.filter(c => !cards.includes(c)); removeCards(cards, 'burst');
  S.score += sc; popText(`폭탄! +${sc}`, (FX + FIELD_R) / 2, FY + 200, '#ffd96a', true); sfx('HardDrop'); sfx('Flush'); S.shake = .25;
}
function push() {
  const w = S.cols.map(c => 1 + c.length * 0.12), tot = w.reduce((a, b) => a + b, 0); let r = Math.random() * tot, i = 0; while (r > w[i] && i < NCOL - 1) { r -= w[i]; i++; }
  S.cols[i].unshift(drawCard());
  if (S.cols[i].length >= MAXH) explode(i);
}
function explode(i) {
  const col = S.cols[i]; S.sel = S.sel.filter(c => !col.includes(c));
  removeCards(col.slice(), 'explode'); S.time = Math.max(0, S.time - EXPLODE_COST); S.combo = 0; S.comboT = 0; S.explodes++; S.shake = .35;
  popText(`줄 폭발! 시간 -${EXPLODE_COST}초`, colX(i) + CW / 2, FY + 200, '#ff6a6a', true); sfx('Denied'); sfx('GameOver');
}
function popText(s, x, y, col, big = false) { S.texts.push({ s, x, y, col, t: 1.1, big }); }

function update(dt) {
  S.now += dt;
  S.cols.forEach(col => col.forEach((c, k) => { const ty = FY + k * CH; c.y += (ty - c.y) * Math.min(1, dt * 14); }));
  if (S.shake) S.shake = Math.max(0, S.shake - dt);
  if (S.phase !== 'play' || S.paused) return;
  S.time -= dt; S.elapsed += dt;
  if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
  S.pushT -= dt; if (S.pushT <= 0) { S.pushT = pushInterval(); push(); }
  if (S.time <= 0) { S.time = 0; S.phase = 'end'; S.sel = []; if (S.score > S.best) { S.best = S.score; S.newBest = true; saveBest(S.best); } sfx('Clear'); }
}

// ---------------------------------------------------------------- 그리기
const glow = (col, b = 10) => { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = b; };
function text(s, x, y, col = '#cfd8e6', size = 13, align = 'left', weight = '') { g.shadowBlur = 0; g.fillStyle = col; g.font = `${weight} ${size}px "DejaVu Sans Mono", "Noto Sans KR", monospace`; g.textAlign = align; g.fillText(s, x, y); g.textAlign = 'left'; }
function panel(x, y, w, h) { g.shadowBlur = 0; g.strokeStyle = 'rgba(127,214,255,.3)'; g.lineWidth = 1; g.strokeRect(x, y, w, h); }
function rr(x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function card(x, y, w, h, c, o = {}) {
  const a = o.alpha ?? 1; g.globalAlpha = a; const col = c.joker ? JOKER_COL : SUIT_COL[c.s];
  if (o.sel) { g.shadowBlur = 0; g.fillStyle = 'rgba(255,217,106,.14)'; rr(x + 3, y + 3, w - 6, h - 6, 6); g.fill(); }
  g.lineWidth = o.sel ? 2.6 : o.hot ? 2.2 : 1.6; glow(o.sel ? '#ffd96a' : o.hot ? '#ffffff' : col, o.sel || o.hot ? 18 : 8); rr(x + 3, y + 3, w - 6, h - 6, 6); g.stroke();
  g.shadowBlur = 5; g.fillStyle = col; g.textAlign = 'center';
  if (c.joker) { g.font = `bold ${Math.round(h * .46)}px "DejaVu Sans Mono", monospace`; g.fillText('JOKER', x + w / 2, y + h * .66); }
  else {
    g.font = `bold ${Math.round(h * .55)}px "DejaVu Sans Mono", monospace`; g.fillText(RANK_TXT(c.r), x + w * .3, y + h * .7);
    g.font = `${Math.round(h * .55)}px "DejaVu Sans", sans-serif`; g.fillText(c.s, x + w * .7, y + h * .72);
  }
  g.textAlign = 'left'; g.globalAlpha = 1;
}
function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.shadowBlur = 0; g.fillStyle = '#06060b'; g.fillRect(0, 0, W, H);
  if (S.shake) { const k = S.shake * 14; g.translate((Math.random() - .5) * k, (Math.random() - .5) * k); }
  const blink = (S.now * 4 | 0) % 2 === 0, play = S.phase === 'play';
  const h = selHand();
  for (let i = 0; i < NCOL; i++) {
    const x = colX(i), col = S.cols[i], n = col.length;
    g.lineWidth = 1; glow('rgba(127,214,255,.18)', 0); g.strokeRect(x, FY, CW, DANGER_Y - FY);
    // 고를 수 있는 구역 (PICK_DEPTH < 99일 때만 표시)
    if (n && PICK_DEPTH < MAXH) { const top = col[Math.max(0, n - PICK_DEPTH)].y; g.shadowBlur = 0; g.fillStyle = 'rgba(127,214,255,.05)'; g.fillRect(x + 1, top, CW - 2, col[n - 1].y + CH - top); }
    col.forEach(c => { const sel = S.sel.includes(c), canPick = play && pickable(c);
      card(x, c.y, CW, CH, c, { sel, hot: sel && h && blink, alpha: canPick || !play ? 1 : .42 }); });
    if (play && i === S.cursor.col) { // 키보드 커서
      const c = cursorCard(), y = c ? c.y : FY; g.lineWidth = 2; glow('#7fd6ff', 14); const L = 12, x0 = x - 3, x1 = x + CW + 3, y0 = y - 3, y1 = y + CH + 3;
      g.beginPath(); g.moveTo(x0, y0 + L); g.lineTo(x0, y0); g.lineTo(x0 + L, y0); g.moveTo(x1 - L, y0); g.lineTo(x1, y0); g.lineTo(x1, y0 + L);
      g.moveTo(x0, y1 - L); g.lineTo(x0, y1); g.lineTo(x0 + L, y1); g.moveTo(x1 - L, y1); g.lineTo(x1, y1); g.lineTo(x1, y1 - L); g.stroke(); }
    if (n >= MAXH - 3) { g.globalAlpha = blink ? .9 : .4; text('위험', x + CW / 2, FY - 10, '#ff6a6a', 12, 'center', 'bold'); g.globalAlpha = 1; }
  }
  g.lineWidth = 2; glow('rgba(255,106,106,.7)', 10); g.beginPath(); g.moveTo(FX - 10, DANGER_Y); g.lineTo(FIELD_R + 10, DANGER_Y); g.stroke();
  // 고른 카드 표시줄
  const by = DANGER_Y + 18;
  if (play) {
    S.sel.forEach((c, k) => card(FX + k * 96, by, 90, 32, c, { sel: true }));
    for (let k = S.sel.length; k < 5; k++) { g.setLineDash([4, 4]); g.lineWidth = 1; glow('rgba(127,214,255,.3)', 0); rr(FX + k * 96 + 3, by + 3, 84, 26, 6); g.stroke(); g.setLineDash([]); }
    const tx = FX + 5 * 96 + 8;
    if (h) { const cm = handComboMult(h); text(`${h.name}  ${h.chips}×${h.mult}`, tx, by + 14, '#ffd96a', 13, 'left', 'bold'); text(`= ${Math.round(h.score * cm).toLocaleString()}${cm > 1 ? ` (콤보 ×${cm})` : ''}  X`, tx, by + 32, '#ffffff', 12); }
    else text(S.sel.length ? (S.sel.length < 2 ? '2장 이상 고르기' : '족보 아님') : 'Z 또는 클릭으로 고르기', tx, by + 22, S.sel.length >= 2 ? '#ff6a6a' : '#5f6878', 12);
  }
  // 연출
  S.fx.forEach(f => { const a = Math.min(1, f.t / .45), x = f.x + (f.kind === 'explode' ? (f.c.y % 2 ? 1 : -1) * (1 - a) * 40 : 0), y = f.y - (f.kind === 'drop' ? -(1 - a) * 30 : (1 - a) * 12);
    card(x, y, CW, CH, f.c, { hot: f.kind !== 'drop', alpha: a * (f.kind === 'drop' ? .6 : 1) });
    if (f.kind !== 'drop') { glow(f.kind === 'explode' ? '#ff6a6a' : '#ffffff', 10); for (let i = 0; i < 6; i++) { const ang = i * 1.05 + f.y, r = (1 - a) * 60; g.globalAlpha = a; g.fillRect(f.x + CW / 2 + Math.cos(ang) * r * 1.3, f.y + CH / 2 + Math.sin(ang) * r * .6, 2.5, 2.5); } g.globalAlpha = 1; } });

  // 왼쪽
  panel(20, 64, 248, 250);
  text('SCORE', 36, 94, '#8a94a6', 12); text(S.score.toLocaleString(), 36, 130, '#ffffff', 32, 'left', 'bold');
  text(`최고 ${S.best.toLocaleString()}`, 36, 156, '#8a94a6', 12);
  text('TIME', 36, 188, '#8a94a6', 12); text(`${Math.ceil(S.time)}`, 256, 188, S.time < 15 ? '#ff6a6a' : '#7fd6ff', 14, 'right', 'bold');
  g.strokeStyle = 'rgba(127,214,255,.5)'; g.lineWidth = 1; g.strokeRect(36, 198, 220, 8); glow(S.time < 15 ? '#ff6a6a' : '#9cffb0', 8); g.fillRect(36, 198, 220 * S.time / TIME_LIMIT, 8);
  text('COMBO', 36, 236, '#8a94a6', 12); text(S.combo > 0 && S.comboT > 0 ? `${S.combo}  ×${comboMult(S.combo)}` : '-', 256, 236, '#9cffb0', 16, 'right', 'bold');
  if (S.comboT > 0) { glow('#9cffb0', 6); g.fillRect(36, 244, 220 * S.comboT / COMBO_WINDOW, 3); }
  text('BOMB', 36, 278, '#8a94a6', 12); g.strokeStyle = 'rgba(127,214,255,.5)'; g.shadowBlur = 0; g.strokeRect(88, 268, 168, 10);
  glow(S.bomb >= 100 ? '#ffd96a' : '#ffa86a', S.bomb >= 100 ? 16 : 6); g.fillRect(88, 268, 168 * S.bomb / 100, 10);
  if (S.bomb >= 100) text(blink ? 'B: 모든 줄 맨 아래 2장 폭파' : '', 36, 302, '#ffd96a', 12, 'left', 'bold');
  panel(20, 330, 248, 336); text('족보  (칩 × 배수)', 36, 356, '#7fd6ff', 12);
  HAND_ORDER.forEach((k, i) => { const hd = HANDS[k], y = 382 + i * 30, on = h && h.key === k;
    text(hd.name, 36, y, on ? '#ffd96a' : '#cfd8e6', 13); text(`${hd.chips}×${hd.mult}`, 256, y, on ? '#ffd96a' : '#8a94a6', 12, 'right'); text(hd.cond, 36, y + 13, '#5f6878', 10); });
  text('고른 카드 전부가 족보여야 함', 36, 656, '#5f6878', 10);
  // 오른쪽
  const RX = 1008;
  panel(RX, 64, 252, 160); text('마지막 족보', RX + 18, 90, '#7fd6ff', 12);
  if (S.last) { text(S.last.name, RX + 18, 120, '#ffd96a', 16, 'left', 'bold'); text(`${S.last.chips} × ${S.last.mult}${S.last.cm > 1 ? ` × 콤보 ${S.last.cm}` : ''}`, RX + 18, 144, '#8a94a6', 12); text(`+${S.last.score.toLocaleString()}`, RX + 18, 176, '#ffffff', 20, 'left', 'bold'); }
  panel(RX, 240, 252, 426); text('규칙', RX + 18, 266, '#7fd6ff', 12);
  ['위에서 카드가 계속 밀고 내려온다', '방향키로 커서, Z로 고르기 (클릭도 됨)', '여러 줄에서 섞어 골라도 된다', '고른 카드가 족보면 X로 내서 점수', '터진 자리는 아래 카드가 위로 붙는다', `${COMBO_WINDOW}초 안에 또 내면 콤보 배수`, `경고선에 닿으면 줄 폭발, 시간 -${EXPLODE_COST}초`, `막히면 1~2장 버리기 (D), 시간 -${DISCARD_COST}초`, '조커 = 아무 숫자·무늬', '폭탄 게이지가 차면 B'].forEach((l, i) => text(l, RX + 18, 294 + i * 26, '#8a94a6', 11));
  text('방향키 커서   Z 고르기   X 족보 내기   Esc 취소   D 버리기   B 폭탄   P 일시정지   M 소리   (마우스: 클릭 고르기, 오른쪽 클릭 내기)', W / 2, H - 12, '#5f6878', 11, 'center');

  g.setTransform(1, 0, 0, 1, 0, 0);
  const overlay = (title, col, lines, foot) => { g.fillStyle = 'rgba(6,6,11,.88)'; g.fillRect(0, 0, W, H); text(title, W / 2, 240, col, 34, 'center', 'bold'); lines.forEach((l, i) => text(l, W / 2, 290 + i * 26, '#cfd8e6', 14, 'center')); text(foot, W / 2, 300 + lines.length * 26 + 50, '#ffd96a', 18, 'center'); };
  if (S.paused && play) { g.fillStyle = 'rgba(6,6,11,.8)'; g.fillRect(0, 0, W, H); text('PAUSED', W / 2, 340, '#7fd6ff', 30, 'center'); }
  if (S.phase === 'title') overlay('STACK POKER', '#7fd6ff', ['카드 4줄이 위에서 계속 밀고 내려온다', '방향키로 커서를 옮겨 Z로 카드를 고르고, 포커 족보가 되면 X로 내서 터뜨린다 (클릭도 됨)', `경고선에 닿으면 줄이 폭발하고 시간이 깎인다. ${TIME_LIMIT}초 동안 최대 점수!`], 'Enter 키 또는 화면을 눌러 시작');
  else if (S.phase === 'end') overlay('TIME UP', '#9cffb0', [`점수 ${S.score.toLocaleString()}${S.newBest ? '   최고 기록!' : `   (최고 ${S.best.toLocaleString()})`}`, `낸 족보 ${S.hands} · 최대 콤보 ${S.maxCombo} · 줄 폭발 ${S.explodes} · 버리기 ${S.discards}`], 'Enter 키 또는 화면을 눌러 다시');
}

// ---------------------------------------------------------------- 소리 (테트리스 포커와 같은 합성 효과음)
let muted = false, actx = null; const sfxBuf = {};
function audioCtx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function sfx(name, a = 0, b = 0) {
  if (muted || !window.TP_SOUNDS) return; const ctx = audioCtx(); if (!ctx) return;
  if (name === 'Burst') a = Math.min(8, Math.max(1, a)); if (name === 'Straight') a = Math.min(7, Math.max(3, a));
  const key = `${name}_${a}_${b}`, src = window.TP_SOUNDS[key]; if (!src) return;
  const play = buf => { const sn = ctx.createBufferSource(); sn.buffer = buf; const gn = ctx.createGain(); gn.gain.value = .8; sn.connect(gn).connect(ctx.destination); sn.start(); };
  const c = sfxBuf[key]; if (c instanceof AudioBuffer) { play(c); return; } if (c) return;
  sfxBuf[key] = 'loading';
  const bin = atob(src.split(',')[1]), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  ctx.decodeAudioData(arr.buffer).then(buf => { sfxBuf[key] = buf; play(buf); }).catch(() => { sfxBuf[key] = null; });
}

// ---------------------------------------------------------------- 입력과 루프
function act(a) {
  if (a === 'mute') { muted = !muted; return; }
  if (S.phase === 'title') { if (a === 'start' || a === 'tap' || a === 'play') { S.phase = 'play'; sfx('Start'); } return; }
  if (S.phase === 'end') { if (a === 'start' || a === 'tap' || a === 'play') { newGame(); S.phase = 'play'; sfx('Start'); } return; }
  if (a === 'pause') { S.paused = !S.paused; return; } if (S.paused) return;
  ({ play: playHand, start: playHand, clear: clearSel, discard, bomb, toggle: toggleCursor, left: () => moveCursor(-1, 0), right: () => moveCursor(1, 0), up: () => moveCursor(0, 1), down: () => moveCursor(0, -1), c0: () => { S.cursor.col = 0; }, c1: () => { S.cursor.col = 1; }, c2: () => { S.cursor.col = 2; }, c3: () => { S.cursor.col = 3; } })[a]?.();
}
addEventListener('keydown', e => {
  if ([' ', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  if (e.repeat && !e.key.startsWith('Arrow')) return;
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', z: 'toggle', Z: 'toggle', x: 'play', X: 'play', ' ': 'toggle', Enter: 'start', // Z 고르기, X 내기 (Space·Enter는 보조)
    Escape: 'clear', d: 'discard', D: 'discard', b: 'bomb', B: 'bomb', p: 'pause', P: 'pause', m: 'mute', M: 'mute', '1': 'c0', '2': 'c1', '3': 'c2', '4': 'c3' };
  if (map[e.key]) act(map[e.key]);
});
function toCanvas(ev) { const r = cv.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H); return [(ev.clientX - r.left - (r.width - W * s) / 2) / s, (ev.clientY - r.top - (r.height - H * s) / 2) / s]; }
cv.addEventListener('contextmenu', ev => ev.preventDefault());
cv.addEventListener('pointerdown', ev => {
  if (S.phase !== 'play') { act('tap'); return; }
  if (ev.button === 2) { playHand(); return; }
  const [x, y] = toCanvas(ev);
  for (let i = 0; i < NCOL; i++) if (x >= colX(i) && x <= colX(i) + CW) { const col = S.cols[i], c = col.find(cc => y >= cc.y && y < cc.y + CH); if (c) { S.cursor = { col: i, row: col.length - 1 - col.indexOf(c) }; toggle(c); return; } }
  // 아래 고른 카드 줄을 누르면 그 카드 빼기
  const by = DANGER_Y + 18; if (y >= by && y <= by + 32) { const k = Math.floor((x - FX) / 96); if (k >= 0 && k < S.sel.length) { S.sel.splice(k, 1); sfx('Lock'); } else if (x > FX + 5 * 96) playHand(); }
  else if (x < 270 && y >= 256 && y <= 310) bomb();
});
document.querySelectorAll('#touch button').forEach(b => b.addEventListener('pointerdown', ev => { ev.preventDefault(); act(b.dataset.a); }));
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { update(dt); S.texts.forEach(t => t.t -= dt); S.texts = S.texts.filter(t => t.t > 0); S.fx.forEach(f => f.t -= dt); S.fx = S.fx.filter(f => f.t > 0); draw(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
newGame();
window.__sp = () => S;
window.__api = { classify, evalHand, toggle, playHand, discard, bomb, push, update, draw, newGame, act, pickable, setMuted: v => { muted = v; }, HANDS, NCOL, MAXH, PICK_DEPTH };
requestAnimationFrame(frame);
