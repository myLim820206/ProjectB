<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Poker</title>
<style>
  :root { --bg:#06060b; --fg:#cfd8e6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{display:block;width:100%;max-width:1280px;max-height:calc(100% - 80px);object-fit:contain;touch-action:none}
  #touch{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  #touch button{font:600 18px/1 "DejaVu Sans Mono",monospace;color:#cfd8e6;background:transparent;border:1px solid rgba(127,214,255,.45);border-radius:6px;min-width:52px;height:48px;touch-action:manipulation}
  #touch button:active{background:rgba(127,214,255,.15)}
  #touch button:focus-visible{outline:2px solid #7fd6ff}
  @media (pointer: coarse){ #touch{display:flex} }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="touch" aria-label="터치 조작">
  <button id="tLeft" data-a="left" aria-label="왼쪽">◀</button>
  <button id="tRight" data-a="right" aria-label="오른쪽">▶</button>
  <button id="tRot" data-a="rot" aria-label="회전">⟳</button>
  <button id="tDown" data-a="down" aria-label="빠르게">▼</button>
  <button id="tDrop" data-a="drop" aria-label="떨어뜨리기">⤓</button>
  <button id="tHold" data-a="hold" aria-label="보관">H</button>
  <button id="tNext" data-a="next" aria-label="다음">▶▶</button>
</div>
<script>
'use strict';
// =====================================================================
// 테트리스 포커 v3: 카드 2장씩 떨어지는 족보 퍼즐
// 카드 2장이 붙은 블록이 떨어진다. 회전하면 두 번째 카드가 첫 카드 둘레를 돈다.
// 내려앉으면 받침이 없는 카드는 각자 아래로 떨어진다 (뿌요뿌요식).
// 이어진 카드 중 포커 족보가 맞으면 그 카드들이 터진다.
//  - 같은 숫자 3/4/5장 이상 이어짐: 트리플 / 포카드 / 파이브 카드
//  - 같은 무늬 5장 이상 이어짐: 플러시
//  - 이어진 카드를 따라 숫자 5개가 차례로 (꺾여도 됨): 스트레이트, 무늬까지 같으면 스트레이트 플러시
//  - 트리플과 맞닿은 다른 숫자 페어: 풀하우스
// 터진 자리로 위 카드가 떨어지고, 또 맞으면 연쇄. 연쇄 단계마다 배수가 커진다.
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 720;
const COLS = 8, ROWS = 12, CELL = 50, OX = 440, OY = 60;
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_COL = { '♠': '#cfe4ff', '♥': '#ff6a8a', '♦': '#ffa86a', '♣': '#8affc4' };
const RANKS = [1, 2, 3, 4, 5, 6, 7];          // 작은 덱: A(1) ~ 7
const DECK_COPIES = 2;                         // 무늬 4 × 숫자 7 × 2벌 = 56장
const RANK_TXT = r => r === 1 ? 'A' : String(r);
const chipOf = r => r === 1 ? 11 : r;
const ORIENT = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 두 번째 카드 위치: 위, 오른쪽, 아래, 왼쪽

// ---------------------------------------------------------------- 족보 찾기
const HANDS = {
  straightFlush: { name: '스트레이트 플러시', chips: 100, mult: 8 },
  five:          { name: '파이브 카드',       chips: 80,  mult: 8 },
  four:          { name: '포카드',           chips: 50,  mult: 5 },
  fullHouse:     { name: '풀하우스',         chips: 40,  mult: 4 },
  flush:         { name: '플러시',           chips: 30,  mult: 3 },
  straight:      { name: '스트레이트',       chips: 30,  mult: 4 },
  triple:        { name: '트리플',           chips: 20,  mult: 2 },
};
const HAND_ORDER = ['straightFlush', 'five', 'four', 'fullHouse', 'flush', 'straight', 'triple'];
const COND = { straightFlush: '스트레이트 + 같은 무늬', five: '같은 숫자 5장+ 이어짐', four: '같은 숫자 4장 이어짐', fullHouse: '트리플 + 맞닿은 페어', flush: '같은 무늬 5장+ 이어짐', straight: '이어진 카드로 숫자 5개 차례로 (꺾여도 됨)', triple: '같은 숫자 3장 이어짐' };
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
function clusters(b, keyFn) {
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false)), out = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = b[y][x]; if (!c || seen[y][x]) continue; const k = keyFn(c), grp = [], st = [[x, y]]; seen[y][x] = true;
    while (st.length) { const [a, bb] = st.pop(); grp.push([a, bb]); for (const [dx, dy] of N4) { const nx = a + dx, ny = bb + dy; if (!inB(nx, ny) || seen[ny][nx]) continue; const n = b[ny][nx]; if (n && keyFn(n) === k) { seen[ny][nx] = true; st.push([nx, ny]); } } }
    out.push({ key: k, cells: grp });
  }
  return out;
}
// 이어진 카드를 따라 숫자가 1씩 오르는 5칸 경로 (A=1 … 7). 서로 겹치지 않게 고른다
function straightPaths(b) {
  const found = [], used = new Set();
  const dfs = (path) => {
    if (path.length === 5) return path.slice();
    const [x, y] = path[path.length - 1], r = b[y][x].r;
    for (const [dx, dy] of N4) { const nx = x + dx, ny = y + dy; if (!inB(nx, ny)) continue; const n = b[ny][nx];
      if (n && n.r === r + 1 && !path.some(([a, c]) => a === nx && c === ny) && !used.has(nx + ',' + ny)) { path.push([nx, ny]); const res = dfs(path); if (res) return res; path.pop(); } }
    return null;
  };
  for (let y = ROWS - 1; y >= 0; y--) for (let x = 0; x < COLS; x++) { const c = b[y][x]; if (!c || used.has(x + ',' + y)) continue;
    const p = dfs([[x, y]]); if (p) { p.forEach(([a, c2]) => used.add(a + ',' + c2)); found.push(p); } }
  return found;
}
function detect(b, rules = {}) {
  const hands = [];
  const rankCl = clusters(b, c => c.r), suitCl = clusters(b, c => c.s);
  const cellCl = new Map(); rankCl.forEach(cl => cl.cells.forEach(([x, y]) => cellCl.set(x + ',' + y, cl)));
  for (const cl of rankCl) {
    const n = cl.cells.length; if (n < 3) continue;
    if (n >= 5) { hands.push({ key: 'five', cells: cl.cells }); continue; }
    if (n === 4) { hands.push({ key: 'four', cells: cl.cells }); continue; }
    let pair = null;
    for (const [x, y] of cl.cells) for (const [dx, dy] of N4) { const o = cellCl.get((x + dx) + ',' + (y + dy)); if (o && o !== cl && o.cells.length === 2) pair = o; }
    hands.push(pair ? { key: 'fullHouse', cells: [...cl.cells, ...pair.cells] } : { key: 'triple', cells: cl.cells });
  }
  if (!rules.noFlush) for (const cl of suitCl) if (cl.cells.length >= 5) hands.push({ key: 'flush', cells: cl.cells });
  for (const p of straightPaths(b)) { const s0 = b[p[0][1]][p[0][0]].s; hands.push({ key: p.every(([x, y]) => b[y][x].s === s0) ? 'straightFlush' : 'straight', cells: p }); }
  hands.forEach(h => { const H0 = HANDS[h.key]; h.name = H0.name; h.mult = H0.mult;
    h.chips = H0.chips + h.cells.reduce((s, [x, y]) => { const c = b[y][x]; return s + (rules.noRed && (c.s === '♥' || c.s === '♦') ? 0 : chipOf(c.r)); }, 0); h.score = h.chips * h.mult; });
  return hands;
}
function settle(b) { // 받침 없는 카드는 각자 아래로 떨어진다
  let moved = false;
  for (let x = 0; x < COLS; x++) { let w = ROWS - 1; for (let y = ROWS - 1; y >= 0; y--) if (b[y][x]) { if (w !== y) { b[w][x] = b[y][x]; b[y][x] = null; moved = true; } w--; } }
  return moved;
}
// 한 번 내려앉은 뒤 일어나는 전체 연쇄 계산 (미리보기와 봇용, 판을 바꾸지 않음)
function simulate(board, rules) {
  const b = board.map(r => r.slice()); settle(b); let chain = 0, total = 0; const steps = [];
  while (true) {
    const hands = detect(b, rules); if (!hands.length) break;
    chain++; const cells = new Set(); hands.forEach(h => h.cells.forEach(([x, y]) => cells.add(x + ',' + y)));
    const sc = hands.reduce((s, h) => s + h.score, 0) * chain; total += sc;
    steps.push({ chain, hands: hands.map(h => h.name), score: sc, cells: [...cells] });
    cells.forEach(k => { const [x, y] = k.split(',').map(Number); b[y][x] = null; }); settle(b);
  }
  return { chain, total, steps, board: b };
}

// ---------------------------------------------------------------- 라운드
const ROUNDS = [
  { target: 400 }, { target: 700 }, { target: 1000, boss: 'noHold' },
  { target: 1400 }, { target: 1850 }, { target: 2350, boss: 'noRed' },
  { target: 2900 }, { target: 3600, boss: 'noFlush' },
];
const BOSS_TEXT = { noHold: '보스: 보관(HOLD) 금지', noRed: '보스: 빨간 카드(♥♦)는 칩 0', noFlush: '보스: 플러시는 터지지 않음' };
const PIECES_PER_ROUND = 40;
const CHAIN_STEP = .3;

let S;
function newRun() { S = { round: 0, totalScore: 0, best: null, started: S ? S.started : false, time: 0 }; startRound(); }
function startRound() {
  Object.assign(S, {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    deck: [], next: [], hold: null, canHold: true, piece: null,
    score: 0, piecesLeft: PIECES_PER_ROUND, bursts: 0, maxChain: 0, lastResult: null,
    dropT: 0, lockT: 0, lockMoves: 0, phase: 'play', chainT: 0, chain: 0, chainScore: 0, chainHands: [],
    fx: [], texts: [], paused: false,
  });
  for (let i = 0; i < 3; i++) S.next.push(makePiece());
  spawnPiece();
}
const rules = () => { const b = ROUNDS[S.round].boss; return { noRed: b === 'noRed', noFlush: b === 'noFlush', noHold: b === 'noHold' }; };
function drawCard() {
  if (!S.deck.length) { for (let k = 0; k < DECK_COPIES; k++) for (const s of SUITS) for (const r of RANKS) S.deck.push({ r, s }); for (let i = S.deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.deck[i], S.deck[j]] = [S.deck[j], S.deck[i]]; } }
  return S.deck.pop();
}
function makePiece() { return { cards: [drawCard(), drawCard()] }; }
function spawnPiece() {
  if (S.piecesLeft <= 0) { endRound(); return; }
  const p = S.next.shift(); while (S.next.length < 3) S.next.push(makePiece());
  S.piece = { cards: p.cards, x: 3, y: 1, o: 0 }; S.dropT = 0; S.lockT = 0; S.lockMoves = 0;
  if (collide(S.piece, S.piece.x, S.piece.y, S.piece.o)) { S.phase = 'over'; S.overWhy = '카드가 천장에 닿았다'; }
}
// 블록의 두 칸: 첫 카드(축)와 두 번째 카드
const cellsOf = (p, x = p.x, y = p.y, o = p.o) => [[x, y], [x + ORIENT[o][0], y + ORIENT[o][1]]];
const collide = (p, x, y, o) => cellsOf(p, x, y, o).some(([cx, cy]) => cx < 0 || cx >= COLS || cy >= ROWS || (cy >= 0 && S.board[cy][cx]));
// 착지 후 카드가 각자 떨어진 최종 위치
function landing(p) {
  let y = p.y; while (!collide(p, p.x, y + 1, p.o)) y++;
  const b = S.board.map(r => r.slice()); const cs = cellsOf(p, p.x, y, p.o);
  const marks = cs.map(([x, yy], i) => { const m = { card: p.cards[i], mark: i }; if (yy >= 0) b[yy][x] = m; return m; });
  settle(b);
  const pos = []; for (let yy = 0; yy < ROWS; yy++) for (let x = 0; x < COLS; x++) { const m = b[yy][x]; if (m && m.mark !== undefined) pos[m.mark] = [x, yy]; }
  return { y, pos, board: b.map(r => r.map(c => c && c.mark !== undefined ? c.card : c)) };
}

// ---------------------------------------------------------------- 조작
const gravity = () => Math.max(.22, .9 - S.round * .08);
const onGround = () => collide(S.piece, S.piece.x, S.piece.y + 1, S.piece.o);
function touchLock() { if (S.piece && onGround() && S.lockMoves < 15) { S.lockT = 0; S.lockMoves++; } }
function move(dx) { const p = S.piece; if (S.phase === 'play' && p && !collide(p, p.x + dx, p.y, p.o)) { p.x += dx; touchLock(); } }
function softDrop() { const p = S.piece; if (S.phase === 'play' && p && !onGround()) { p.y++; S.dropT = 0; } }
function rotate(dir) {
  const p = S.piece; if (S.phase !== 'play' || !p) return; const no = (p.o + dir + 4) % 4;
  for (const [kx, ky] of [[0, 0], [-1, 0], [1, 0], [0, -1]]) if (!collide(p, p.x + kx, p.y + ky, no)) { p.x += kx; p.y += ky; p.o = no; touchLock(); return; }
  // 좁은 곳에서는 두 카드 자리를 맞바꾼다
  p.cards = [p.cards[1], p.cards[0]]; touchLock();
}
function holdPiece() {
  if (S.phase !== 'play' || !S.canHold) return;
  if (rules().noHold) { popText('보관 금지 라운드', 3.5, 2, '#ff6a6a'); return; }
  const cur = { cards: S.piece.cards };
  if (S.hold) { const h = S.hold; S.hold = cur; S.piece = { cards: h.cards, x: 3, y: 1, o: 0 }; } else { S.hold = cur; const left = S.piecesLeft; S.piecesLeft++; spawnPiece(); S.piecesLeft = left; }
  S.canHold = false;
}
function preview() { const p = S.piece; if (!p) return null; const L = landing(p); return { ...L, ...simulate(L.board, rules()) }; }
function drop() { if (S.phase !== 'play' || !S.piece) return; while (!onGround()) S.piece.y++; lockPiece(); }
function lockPiece() {
  const p = S.piece;
  cellsOf(p).forEach(([x, yy], i) => { if (yy >= 0) S.board[yy][x] = p.cards[i]; });
  S.piece = null; S.canHold = true; S.piecesLeft--;
  settle(S.board);
  S.chain = 0; S.chainScore = 0; S.chainHands = [];
  chainStep();
}
function chainStep() {
  const hands = detect(S.board, rules());
  if (!hands.length) {
    if (S.chain > 0) { S.lastResult = { chain: S.chain, total: S.chainScore, hands: S.chainHands }; if (!S.best || S.chainScore > S.best.total) S.best = { total: S.chainScore, chain: S.chain }; }
    S.phase = 'play'; afterTurn(); return;
  }
  S.chain++; S.maxChain = Math.max(S.maxChain, S.chain);
  const cells = new Set(); hands.forEach(h => h.cells.forEach(([x, y]) => cells.add(x + ',' + y)));
  const sc = hands.reduce((s, h) => s + h.score, 0) * S.chain;
  S.score += sc; S.totalScore += sc; S.chainScore += sc; S.bursts += hands.length; hands.forEach(h => S.chainHands.push(h.name));
  S.fx.push({ kind: 'burst', cells: [...cells].map(k => { const [x, y] = k.split(',').map(Number); return { x, y, c: S.board[y][x] }; }), t: .5 });
  hands.forEach(h => { const [cx, cy] = h.cells.reduce((a, [x, y]) => [a[0] + x / h.cells.length, a[1] + y / h.cells.length], [0, 0]); popText(`${h.name}  ${h.chips}×${h.mult}`, cx, cy - .3, '#ffd96a'); });
  S.texts = S.texts.filter(t => !t.big);
  S.texts.push({ s: `+${sc.toLocaleString()}${S.chain > 1 ? `   ${S.chain} 연쇄 ×${S.chain}` : ''}`, x: COLS / 2 - .5, y: -0.5, t: 1.1, col: S.chain > 1 ? '#9cffb0' : '#ffffff', big: true });
  cells.forEach(k => { const [x, y] = k.split(',').map(Number); S.board[y][x] = null; });
  settle(S.board);
  S.phase = 'chain'; S.chainT = CHAIN_STEP;
}
function update(dt) {
  if (S.paused) return;
  if (S.phase === 'chain') { S.chainT -= dt; if (S.chainT <= 0) chainStep(); return; }
  if (S.phase !== 'play' || !S.piece) return;
  for (const k of ['ArrowLeft', 'ArrowRight', 'ArrowDown']) if (keys[k]) { rep[k] = (rep[k] ?? 0) - dt; if (rep[k] <= 0) { rep[k] = k === 'ArrowDown' ? .04 : .06; if (k === 'ArrowDown') softDrop(); else move(k === 'ArrowLeft' ? -1 : 1); } }
  S.dropT += dt;
  if (S.dropT >= gravity()) { S.dropT = 0; if (!onGround()) S.piece.y++; }
  if (onGround()) { S.lockT += dt; if (S.lockT >= .5) lockPiece(); } else S.lockT = 0;
}
function afterTurn() {
  if (S.score >= ROUNDS[S.round].target) { S.phase = 'clear'; S.bonus = S.piecesLeft; return; }
  if (S.piecesLeft <= 0) { endRound(); return; }
  spawnPiece();
}
function endRound() { if (S.score >= ROUNDS[S.round].target) { S.phase = 'clear'; S.bonus = 0; } else { S.phase = 'over'; S.overWhy = `블록 ${PIECES_PER_ROUND}개를 다 썼지만 목표 점수에 못 미쳤다`; } }
function nextRound() { if (S.phase !== 'clear') return; S.round++; if (S.round >= ROUNDS.length) { S.phase = 'win'; return; } startRound(); }
function popText(s, x, y, col) { S.texts.push({ s, x, y, t: 1.2, col }); }

// ---------------------------------------------------------------- 그리기
const X = x => OX + x * CELL, Y = y => OY + y * CELL;
const glow = (col, b = 10) => { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = b; };
function text(s, x, y, col = '#cfd8e6', size = 13, align = 'left', weight = '') { g.shadowBlur = 0; g.fillStyle = col; g.font = `${weight} ${size}px "DejaVu Sans Mono", "Noto Sans KR", monospace`; g.textAlign = align; g.fillText(s, x, y); g.textAlign = 'left'; }
function panel(x, y, w, h) { g.shadowBlur = 0; g.strokeStyle = 'rgba(127,214,255,.3)'; g.lineWidth = 1; g.strokeRect(x, y, w, h); }
// 카드 한 장: 테두리는 무늬 색, 큰 숫자와 무늬
function cardCell(px, py, card, o = {}) {
  const a = o.alpha ?? 1, s = o.size ?? CELL; g.globalAlpha = a;
  const col = card ? SUIT_COL[card.s] : '#7fd6ff';
  g.lineWidth = o.hot ? 2.4 : 1.5; glow(o.hot ? '#ffffff' : col, o.hot ? 20 : 8); if (o.dash) g.setLineDash([4, 4]);
  g.beginPath(); g.roundRect ? g.roundRect(px + 3, py + 3, s - 6, s - 6, 5) : g.rect(px + 3, py + 3, s - 6, s - 6); g.stroke(); g.setLineDash([]);
  if (card && !o.dash) {
    g.shadowColor = col; g.shadowBlur = o.hot ? 12 : 5; g.fillStyle = col;
    g.font = `bold ${Math.round(s * .42)}px "DejaVu Sans Mono", monospace`; g.textAlign = 'left'; g.fillText(RANK_TXT(card.r), px + s * .14, py + s * .48);
    g.font = `${Math.round(s * .4)}px "DejaVu Sans", sans-serif`; g.textAlign = 'right'; g.fillText(card.s, px + s * .88, py + s * .86); g.textAlign = 'left';
  }
  g.globalAlpha = 1;
}
function drawPair(p, x0, y0, s = 36) { if (!p) return; cardCell(x0, y0, p.cards[1], { size: s }); cardCell(x0, y0 + s, p.cards[0], { size: s }); }
function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.shadowBlur = 0; g.fillStyle = '#06060b'; g.fillRect(0, 0, W, H);
  const R = ROUNDS[Math.min(S.round, ROUNDS.length - 1)];
  g.strokeStyle = 'rgba(120,140,180,.07)'; g.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { g.beginPath(); g.moveTo(X(x), OY); g.lineTo(X(x), Y(ROWS)); g.stroke(); }
  for (let y = 1; y < ROWS; y++) { g.beginPath(); g.moveTo(OX, Y(y)); g.lineTo(X(COLS), Y(y)); g.stroke(); }
  g.lineWidth = 1.5; glow('rgba(127,214,255,.5)', 8); g.strokeRect(OX, OY, COLS * CELL, ROWS * CELL);
  let pv = null; const hot = new Set();
