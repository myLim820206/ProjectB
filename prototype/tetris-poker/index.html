<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Poker</title>
<style>
  :root { --bg:#06060b; --fg:#cfd8e6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{display:block;width:100%;max-width:1280px;max-height:calc(100% - 80px);object-fit:contain;touch-action:none}
  #touch{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  #touch button{font:600 18px/1 "DejaVu Sans Mono",monospace;color:#cfd8e6;background:transparent;border:1px solid rgba(127,214,255,.45);border-radius:6px;min-width:52px;height:48px;touch-action:manipulation}
  #touch button:active{background:rgba(127,214,255,.15)}
  #touch button:focus-visible{outline:2px solid #7fd6ff}
  @media (pointer: coarse){ #touch{display:flex} }
</style>
</head>
<body>
<canvas id="c" width="1280" height="700"></canvas>
<div id="touch" aria-label="터치 조작">
  <button id="tLeft" data-a="left" aria-label="왼쪽">◀</button>
  <button id="tRight" data-a="right" aria-label="오른쪽">▶</button>
  <button id="tRot" data-a="rot" aria-label="회전">⟳</button>
  <button id="tDown" data-a="down" aria-label="빠르게">▼</button>
  <button id="tDrop" data-a="drop" aria-label="떨어뜨리기">⤓</button>
  <button id="tHold" data-a="hold" aria-label="보관">H</button>
  <button id="tNext" data-a="next" aria-label="다음">▶▶</button>
</div>
<script>
'use strict';
// =====================================================================
// 테트리스 포커 v2: 족보로 터지는 낙하 퍼즐
// 블록은 일반 테트리스처럼 떨어지고, 4칸마다 카드가 붙어 있다.
// 블록이 고정되면 판 전체에서 족보를 찾아, 족보를 이룬 카드만 터진다.
//  - 같은 숫자 3/4/5장 이상이 상하좌우로 이어짐: 트리플 / 포카드 / 파이브 카드
//  - 같은 무늬 5장 이상이 이어짐: 플러시
//  - 가로나 세로 일직선으로 숫자 5개가 차례로: 스트레이트 (무늬까지 같으면 스트레이트 플러시)
//  - 트리플과 다른 숫자 페어가 맞닿음: 풀하우스
// 터진 자리로 위 카드가 떨어지고, 또 맞으면 연쇄. 연쇄 단계마다 배수가 커진다.
// 꽉 찬 줄은 점수 없이 지워지는 탈출구.
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 700;
const COLS = 10, ROWS = 16, CELL = 36, OX = 460, OY = 70;
const PIECE_COL = { I:'#7fd6ff', O:'#ffd96a', T:'#c890ff', S:'#9cffb0', Z:'#ff8a7a', L:'#ffb36a', J:'#6a9cff' };
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_COL = { '♠': '#cfe4ff', '♥': '#ff6a8a', '♦': '#ff9a6a', '♣': '#8affc4' };
const RANKS = [1, 2, 3, 4, 5, 6, 7];          // 작은 덱: A(1) ~ 7
const DECK_COPIES = 2;                         // 무늬 4 × 숫자 7 × 2벌 = 56장
const RANK_TXT = r => r === 1 ? 'A' : String(r);
const chipOf = r => r === 1 ? 11 : r;
const BASE = {
  I:[[0,1],[1,1],[2,1],[3,1]], O:[[1,0],[2,0],[1,1],[2,1]], T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]],
};
const SHAPES = {};
for (const t in BASE) {
  const n = t === 'I' ? 4 : 3; let cur = BASE[t]; SHAPES[t] = [cur];
  for (let r = 1; r < 4; r++) { cur = t === 'O' ? cur.map(([x, y]) => [2 - y, x - 1]) : cur.map(([x, y]) => [n - 1 - y, x]); SHAPES[t].push(cur); }
}
const KICKS = [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,1]];

// ---------------------------------------------------------------- 족보 찾기
const HANDS = {
  straightFlush: { name: '스트레이트 플러시', chips: 100, mult: 8 },
  five:          { name: '파이브 카드',       chips: 80,  mult: 8 },
  four:          { name: '포카드',           chips: 50,  mult: 5 },
  fullHouse:     { name: '풀하우스',         chips: 40,  mult: 4 },
  flush:         { name: '플러시',           chips: 30,  mult: 3 },
  straight:      { name: '스트레이트',       chips: 30,  mult: 4 },
  triple:        { name: '트리플',           chips: 20,  mult: 2 },
};
const HAND_ORDER = ['straightFlush', 'five', 'four', 'fullHouse', 'flush', 'straight', 'triple'];
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
function clusters(b, keyFn) { // 같은 키(숫자 또는 무늬)로 상하좌우 이어진 덩어리
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false)), out = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = b[y][x]; if (!c || seen[y][x]) continue; const k = keyFn(c.card), grp = [], st = [[x, y]]; seen[y][x] = true;
    while (st.length) { const [a, bb] = st.pop(); grp.push([a, bb]); for (const [dx, dy] of N4) { const nx = a + dx, ny = bb + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || seen[ny][nx]) continue; const n = b[ny][nx]; if (n && keyFn(n.card) === k) { seen[ny][nx] = true; st.push([nx, ny]); } } }
    out.push({ key: k, cells: grp });
  }
  return out;
}
function detect(b) {
  const hands = [];
  const rankCl = clusters(b, c => c.r), suitCl = clusters(b, c => c.s);
  const cellCl = new Map(); rankCl.forEach(cl => cl.cells.forEach(([x, y]) => cellCl.set(x + ',' + y, cl)));
  for (const cl of rankCl) {
    const n = cl.cells.length; if (n < 3) continue;
    if (n >= 5) { hands.push({ key: 'five', cells: cl.cells }); continue; }
    if (n === 4) { hands.push({ key: 'four', cells: cl.cells }); continue; }
    // 트리플: 맞닿은 다른 숫자 페어가 있으면 풀하우스
    let pair = null;
    for (const [x, y] of cl.cells) for (const [dx, dy] of N4) { const o = cellCl.get((x + dx) + ',' + (y + dy)); if (o && o !== cl && o.cells.length === 2) pair = o; }
    hands.push(pair ? { key: 'fullHouse', cells: [...cl.cells, ...pair.cells] } : { key: 'triple', cells: cl.cells });
  }
  for (const cl of suitCl) if (cl.cells.length >= 5) hands.push({ key: 'flush', cells: cl.cells });
  // 스트레이트: 가로·세로 일직선으로 숫자가 1씩 오르거나 내리며 5칸 이상
  for (const [dx, dy] of [[1, 0], [0, 1]]) for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = b[y][x]; if (!c) continue;
    const prev = b[y - dy]?.[x - dx];
    for (const dir of [1, -1]) {
      if (prev && prev.card.r === c.card.r - dir) continue; // 더 앞에서 시작하는 줄이 있으면 건너뜀
      const run = [[x, y]]; let px = x, py = y;
      while (true) { const nx = px + dx, ny = py + dy, n = b[ny]?.[nx], cur = b[py][px]; if (!n || n.card.r !== cur.card.r + dir) break; run.push([nx, ny]); px = nx; py = ny; }
      if (run.length >= 5) { const sf = run.every(([a, bb]) => b[bb][a].card.s === c.card.s); hands.push({ key: sf ? 'straightFlush' : 'straight', cells: run }); }
    }
  }
  hands.forEach(h => { const H0 = HANDS[h.key]; h.name = H0.name; h.chips = H0.chips + h.cells.reduce((s, [x, y]) => s + chipOf(b[y][x].card.r), 0); h.mult = H0.mult; });
  return hands;
}
function settle(b) { // 터진 자리로 위 카드가 떨어진다 (세로줄마다 아래로 모음)
  for (let x = 0; x < COLS; x++) { let w = ROWS - 1; for (let y = ROWS - 1; y >= 0; y--) if (b[y][x]) { const c = b[y][x]; b[y][x] = null; b[w][x] = c; w--; } }
}
function clearFullRows(b) { let n = 0; for (let y = ROWS - 1; y >= 0; y--) if (b[y].every(c => c)) { b.splice(y, 1); b.unshift(Array(COLS).fill(null)); n++; y++; } return n; }
// 한 번의 고정으로 일어나는 전체 연쇄를 계산 (미리보기와 봇이 사용). 판을 바꾸지 않는다
function simulate(board, rules) {
  const b = board.map(r => r.slice()); let chain = 0, total = 0; const steps = [];
  while (true) {
    const hands = detect(b).filter(h => !(rules.noFlush && h.key === 'flush')); if (!hands.length) break;
    chain++; const cells = new Set(); hands.forEach(h => h.cells.forEach(([x, y]) => cells.add(x + ',' + y)));
    const sc = hands.reduce((s, h) => s + handScore(h, b, rules), 0) * chain; total += sc;
    steps.push({ chain, hands: hands.map(h => h.name), score: sc, cells: [...cells] });
    cells.forEach(k => { const [x, y] = k.split(',').map(Number); b[y][x] = null; }); settle(b);
  }
  return { chain, total, steps, board: b };
}
function handScore(h, b, rules) {
  let chips = h.chips; if (rules.noRed) h.cells.forEach(([x, y]) => { const c = b[y][x].card; if (c.s === '♥' || c.s === '♦') chips -= chipOf(c.r); });
  return Math.max(0, chips) * h.mult;
}

// ---------------------------------------------------------------- 라운드
const ROUNDS = [
  { target: 400 }, { target: 700 }, { target: 1000, boss: 'noHold' },
  { target: 1400 }, { target: 1850 }, { target: 2350, boss: 'noRed' },
  { target: 2900 }, { target: 3600, boss: 'noFlush' },
];
const BOSS_TEXT = { noHold: '보스: 보관(HOLD) 금지', noRed: '보스: 빨간 카드(♥♦)는 칩 0', noFlush: '보스: 플러시는 터지지 않음' };
const PIECES_PER_ROUND = 30;
const CHAIN_STEP = .28; // 연쇄 한 단계 연출 시간 (초)

let S;
function newRun() { S = { round: 0, totalScore: 0, best: null, started: S ? S.started : false }; startRound(); }
function startRound() {
  Object.assign(S, {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    deck: [], bag: [], next: [], hold: null, canHold: true, piece: null,
    score: 0, piecesLeft: PIECES_PER_ROUND, bursts: 0, maxChain: 0, lastResult: null,
    dropT: 0, lockT: 0, lockMoves: 0, phase: 'play', chainT: 0, chain: 0, chainScore: 0, chainHands: [],
    fx: [], texts: [], paused: false,
  });
  for (let i = 0; i < 3; i++) S.next.push(makePiece());
  spawnPiece();
}
const rules = () => { const b = ROUNDS[S.round].boss; return { noRed: b === 'noRed', noFlush: b === 'noFlush', noHold: b === 'noHold' }; };
function drawCard() {
  if (!S.deck.length) { for (let k = 0; k < DECK_COPIES; k++) for (const s of SUITS) for (const r of RANKS) S.deck.push({ r, s }); for (let i = S.deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.deck[i], S.deck[j]] = [S.deck[j], S.deck[i]]; } }
  return S.deck.pop();
}
function fromBag() {
  if (!S.bag.length) { S.bag = Object.keys(BASE); for (let i = S.bag.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.bag[i], S.bag[j]] = [S.bag[j], S.bag[i]]; } }
  return S.bag.pop();
}
function makePiece() { return { t: fromBag(), cards: [drawCard(), drawCard(), drawCard(), drawCard()] }; }
function spawnPiece() {
  if (S.piecesLeft <= 0) { endRound(); return; }
  const p = S.next.shift(); while (S.next.length < 3) S.next.push(makePiece());
  S.piece = { ...p, r: 0, x: 3, y: 0 }; S.dropT = 0; S.lockT = 0; S.lockMoves = 0;
  if (collide(S.piece, S.piece.x, S.piece.y, S.piece.r)) { S.phase = 'over'; S.overWhy = '블록이 천장에 닿았다'; }
}
const cellsOf = (p, x = p.x, y = p.y, r = p.r) => SHAPES[p.t][r].map(([dx, dy]) => [x + dx, y + dy]);
const collide = (p, x, y, r) => cellsOf(p, x, y, r).some(([cx, cy]) => cx < 0 || cx >= COLS || cy >= ROWS || cy < 0 || S.board[cy][cx]);
const landY = p => { let y = p.y; while (!collide(p, p.x, y + 1, p.r)) y++; return y; };

// ---------------------------------------------------------------- 조작
const gravity = () => Math.max(.2, .9 - S.round * .08);
const onGround = () => collide(S.piece, S.piece.x, S.piece.y + 1, S.piece.r);
function touchLock() { if (S.piece && onGround() && S.lockMoves < 15) { S.lockT = 0; S.lockMoves++; } }
function move(dx) { const p = S.piece; if (S.phase === 'play' && p && !collide(p, p.x + dx, p.y, p.r)) { p.x += dx; touchLock(); } }
function softDrop() { const p = S.piece; if (S.phase === 'play' && p && !onGround()) { p.y++; S.dropT = 0; } }
function rotate(dir) {
  const p = S.piece; if (S.phase !== 'play' || !p) return; const nr = (p.r + dir + 4) % 4;
  for (const [kx, ky] of KICKS) if (!collide(p, p.x + kx, p.y + ky, nr)) { p.x += kx; p.y += ky; p.r = nr; touchLock(); return; }
}
function holdPiece() {
  if (S.phase !== 'play' || !S.canHold) return;
  if (rules().noHold) { popText('보관 금지 라운드', 4.5, 2, '#ff6a6a'); return; }
  const cur = { t: S.piece.t, cards: S.piece.cards };
  if (S.hold) { const h = S.hold; S.hold = cur; S.piece = { ...h, r: 0, x: 3, y: 0 }; } else { S.hold = cur; const left = S.piecesLeft; S.piecesLeft++; spawnPiece(); S.piecesLeft = left; }
  S.canHold = false;
}
function preview() {
  const p = S.piece; if (!p) return null; const y = landY(p);
  const b = S.board.map(r => r.slice()); cellsOf(p, p.x, y).forEach(([x, yy], i) => b[yy][x] = { t: p.t, card: p.cards[i] });
  return { y, ...simulate(b, rules()) };
}
function drop() { if (S.phase !== 'play' || !S.piece) return; S.piece.y = landY(S.piece); lockPiece(); }
function lockPiece() {
  const p = S.piece;
  cellsOf(p).forEach(([x, yy], i) => S.board[yy][x] = { t: p.t, card: p.cards[i] });
  S.piece = null; S.canHold = true; S.piecesLeft--;
  S.chain = 0; S.chainScore = 0; S.chainHands = [];
  chainStep();
}
// 연쇄 한 단계: 족보를 찾아 터뜨리고, 위 카드를 떨어뜨린다. 더 없으면 꽉 찬 줄 정리 후 다음 블록
function chainStep() {
  const hands = detect(S.board).filter(h => !(rules().noFlush && h.key === 'flush'));
  if (!hands.length) {
    const cleared = clearFullRows(S.board); if (cleared) popText(`꽉 찬 줄 ${cleared}개 정리 (점수 없음)`, 4.5, 3, '#8a94a6');
    if (S.chain > 0) {
      S.lastResult = { chain: S.chain, total: S.chainScore, hands: S.chainHands };
      if (!S.best || S.chainScore > S.best.total) S.best = { total: S.chainScore, chain: S.chain };
    }
    S.phase = 'play'; afterTurn(); return;
  }
  S.chain++; S.maxChain = Math.max(S.maxChain, S.chain);
  const cells = new Set(); hands.forEach(h => h.cells.forEach(([x, y]) => cells.add(x + ',' + y)));
  const sc = hands.reduce((s, h) => s + handScore(h, S.board, rules()), 0) * S.chain;
  S.score += sc; S.totalScore += sc; S.chainScore += sc; S.bursts += hands.length; hands.forEach(h => S.chainHands.push(h.name));
  // 연출: 터지는 카드 잔상과 족보 이름
  const burst = [...cells].map(k => { const [x, y] = k.split(',').map(Number); return { x, y, c: S.board[y][x] }; });
  S.fx.push({ kind: 'burst', cells: burst, t: .45 });
  hands.forEach(h => { const [cx, cy] = h.cells.reduce((a, [x, y]) => [a[0] + x / h.cells.length, a[1] + y / h.cells.length], [0, 0]); popText(`${h.name} ${h.chips}×${h.mult}`, cx, cy - .4, '#ffd96a'); });
  S.texts = S.texts.filter(t => !t.big);
  S.texts.push({ s: `+${sc.toLocaleString()}${S.chain > 1 ? `   ${S.chain} 연쇄 ×${S.chain}` : ''}`, x: 4.5, y: -0.6, t: 1.1, col: S.chain > 1 ? '#9cffb0' : '#ffffff', big: true });
  cells.forEach(k => { const [x, y] = k.split(',').map(Number); S.board[y][x] = null; });
  settle(S.board);
  S.phase = 'chain'; S.chainT = CHAIN_STEP;
}
function update(dt) {
  if (S.paused) return;
  if (S.phase === 'chain') { S.chainT -= dt; if (S.chainT <= 0) chainStep(); return; }
  if (S.phase !== 'play' || !S.piece) return;
  for (const k of ['ArrowLeft', 'ArrowRight', 'ArrowDown']) if (keys[k]) { rep[k] = (rep[k] ?? 0) - dt; if (rep[k] <= 0) { rep[k] = k === 'ArrowDown' ? .04 : .05; if (k === 'ArrowDown') softDrop(); else move(k === 'ArrowLeft' ? -1 : 1); } }
  S.dropT += dt;
  if (S.dropT >= gravity()) { S.dropT = 0; if (!onGround()) S.piece.y++; }
  if (onGround()) { S.lockT += dt; if (S.lockT >= .5) lockPiece(); } else S.lockT = 0;
}
function afterTurn() {
  if (S.score >= ROUNDS[S.round].target) { S.phase = 'clear'; S.bonus = S.piecesLeft; return; }
  if (S.piecesLeft <= 0) { endRound(); return; }
  spawnPiece();
}
function endRound() { if (S.score >= ROUNDS[S.round].target) { S.phase = 'clear'; S.bonus = 0; } else { S.phase = 'over'; S.overWhy = `블록 ${PIECES_PER_ROUND}개를 다 썼지만 목표 점수에 못 미쳤다`; } }
function nextRound() { if (S.phase !== 'clear') return; S.round++; if (S.round >= ROUNDS.length) { S.phase = 'win'; return; } startRound(); }
function popText(s, x, y, col) { S.texts.push({ s, x, y, t: 1.2, col }); }

// ---------------------------------------------------------------- 그리기
const X = x => OX + x * CELL, Y = y => OY + y * CELL;
const glow = (col, b = 10) => { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = b; };
function text(s, x, y, col = '#cfd8e6', size = 13, align = 'left', weight = '') { g.shadowBlur = 0; g.fillStyle = col; g.font = `${weight} ${size}px "DejaVu Sans Mono", "Noto Sans KR", monospace`; g.textAlign = align; g.fillText(s, x, y); g.textAlign = 'left'; }
function panel(x, y, w, h) { g.shadowBlur = 0; g.strokeStyle = 'rgba(127,214,255,.3)'; g.lineWidth = 1; g.strokeRect(x, y, w, h); }
function cardCell(px, py, t, card, o = {}) {
  const a = o.alpha ?? 1, s = o.size ?? CELL; g.globalAlpha = a;
  g.lineWidth = o.hot ? 2.2 : 1.4; glow(o.hot ? '#ffffff' : PIECE_COL[t], o.hot ? 18 : 8); if (o.dash) g.setLineDash([3, 4]);
  g.strokeRect(px + 2, py + 2, s - 4, s - 4); g.setLineDash([]);
  if (card && !o.dash) {
    const col = SUIT_COL[card.s]; g.shadowColor = col; g.shadowBlur = o.hot ? 10 : 4; g.fillStyle = col;
    g.font = `bold ${Math.round(s * .38)}px "DejaVu Sans Mono", monospace`; g.textAlign = 'left'; g.fillText(RANK_TXT(card.r), px + 5, py + s * .44);
    g.font = `${Math.round(s * .42)}px "DejaVu Sans", sans-serif`; g.textAlign = 'right'; g.fillText(card.s, px + s - 4, py + s - 5); g.textAlign = 'left';
  }
  g.globalAlpha = 1;
}
function drawMini(p, x0, y0, s = 22) { if (!p) return; SHAPES[p.t][0].forEach(([x, y], i) => cardCell(x0 + x * s, y0 + y * s, p.t, p.cards[i], { size: s })); }
function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.shadowBlur = 0; g.fillStyle = '#06060b'; g.fillRect(0, 0, W, H);
  const R = ROUNDS[Math.min(S.round, ROUNDS.length - 1)];
