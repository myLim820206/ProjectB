<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris Poker</title>
<style>
  :root { --bg:#06060b; --fg:#cfd8e6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{display:block;width:100%;max-width:1280px;max-height:calc(100% - 80px);object-fit:contain;touch-action:none}
  #touch{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  #touch button{font:600 18px/1 "DejaVu Sans Mono",monospace;color:#cfd8e6;background:transparent;border:1px solid rgba(127,214,255,.45);border-radius:6px;min-width:52px;height:48px;touch-action:manipulation}
  #touch button:active{background:rgba(127,214,255,.15)}
  #touch button:focus-visible{outline:2px solid #7fd6ff}
  @media (pointer: coarse){ #touch{display:flex} }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="touch" aria-label="터치 조작">
  <button id="tLeft" data-a="left" aria-label="왼쪽">◀</button>
  <button id="tRight" data-a="right" aria-label="오른쪽">▶</button>
  <button id="tRot" data-a="rot" aria-label="회전">⟳</button>
  <button id="tDown" data-a="down" aria-label="빠르게">▼</button>
  <button id="tDrop" data-a="drop" aria-label="떨어뜨리기">⤓</button>
  <button id="tHold" data-a="hold" aria-label="보관">H</button>
  <button id="tNext" data-a="next" aria-label="다음">▶▶</button>
</div>
<script>
'use strict';
// =====================================================================
// 테트리스 포커 v5: 카드 한 장 = 칸 2개, 블록 = 카드 2장 = 4칸
// 카드는 세로로 서거나 가로로 누운 직사각형(칸 2개)이다. 카드 2장을 이어 붙인
// 4칸 블록(I, O, L, J, S, Z)이 테트리스처럼 떨어지고 회전한다. T는 카드 2장으로 만들 수 없다.
// 내려앉으면 받침 없는 카드는 한 장씩 따로 떨어진다.
// 터지는 조건 (카드 단위, 한 칸이라도 맞닿으면 붙은 것)
//  1) 같은 숫자 3장 이상이 붙음: 트리플 / 포카드 / 파이브 카드
//     트리플에 다른 숫자 페어가 맞닿아 있으면 그 페어도 함께 터져 풀하우스
//  2) 서로 다른 숫자 페어 두 쌍이 맞닿음: 투 페어
// 원 페어는 터지지 않는다 (준비 상태로 선을 그어 보여 준다).
// 점수 보너스: 한 족보가 모두 같은 무늬면 플러시 ×2,
//             연쇄로 터진 숫자가 3단계 이상 차례로 이어지면 연쇄 스트레이트 ×이어진 단계 수.
// =====================================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 720;
const COLS = 10, ROWS = 18, CELL = 34, OX = 470, OY = 54;
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_COL = { '♠': '#cfe4ff', '♥': '#ff6a8a', '♦': '#ffa86a', '♣': '#8affc4' };
const RANKS = [1, 2, 3, 4, 5, 6, 7];
const DECK_COPIES = 2;
const RANK_TXT = r => r === 1 ? 'A' : String(r);
const chipOf = r => r === 1 ? 11 : r;
// 블록 모양: 칸 4개, 앞의 두 칸이 첫 번째 카드, 뒤의 두 칸이 두 번째 카드
const BASE = {
  I: [[0,1],[1,1],[2,1],[3,1]],
  O: [[1,0],[1,1],[2,0],[2,1]],
  L: [[2,0],[2,1],[0,1],[1,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
};
const SHAPES = {};
for (const t in BASE) {
  const n = t === 'I' ? 4 : 3; let cur = BASE[t]; SHAPES[t] = [cur];
  for (let r = 1; r < 4; r++) { cur = t === 'O' ? cur.map(([x, y]) => [2 - y, x - 1]) : cur.map(([x, y]) => [n - 1 - y, x]); SHAPES[t].push(cur); }
}
const KICKS = [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,1]];
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;

// ---------------------------------------------------------------- 카드 단위 판
// 판은 칸 격자이고, 카드 한 장이 두 칸을 같은 객체로 차지한다
function cardsOf(b) { const m = new Map(); for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const c = b[y][x]; if (c) { if (!m.has(c)) m.set(c, []); m.get(c).push([x, y]); } } return m; }
function settle(b) { // 받침 없는 카드는 한 장씩 아래로 떨어진다
  let moved = true, any = false;
  while (moved) { moved = false;
    const cards = [...cardsOf(b)].sort((a, c) => Math.max(...c[1].map(p => p[1])) - Math.max(...a[1].map(p => p[1])));
    for (const [card, cells] of cards) {
      const free = cells.every(([x, y]) => y + 1 < ROWS && (!b[y + 1][x] || b[y + 1][x] === card));
      if (free) { cells.forEach(([x, y]) => b[y][x] = null); cells.forEach(([x, y]) => b[y + 1][x] = card); moved = true; any = true; }
    }
  }
  return any;
}
function neighbors(b, card, cells) { const out = new Set(); for (const [x, y] of cells) for (const [dx, dy] of N4) { const n = b[y + dy]?.[x + dx]; if (n && n !== card) out.add(n); } return out; }

// ---------------------------------------------------------------- 족보
const HANDS = {
  five:      { name: '파이브 카드', chips: 80, mult: 8 },
  four:      { name: '포카드',     chips: 50, mult: 5 },
  fullHouse: { name: '풀하우스',   chips: 40, mult: 4 },
  triple:    { name: '트리플',     chips: 20, mult: 2 },
  twoPair:   { name: '투 페어',    chips: 15, mult: 2 },
};
const HAND_ORDER = ['five', 'four', 'fullHouse', 'triple', 'twoPair'];
const COND = { five: '같은 숫자 5장+ 붙음', four: '같은 숫자 4장 붙음', fullHouse: '트리플 + 맞닿은 다른 숫자 페어', triple: '같은 숫자 3장 붙음', twoPair: '다른 숫자 페어 두 쌍이 맞닿음' };
function rankClusters(b) {
  const map = cardsOf(b), seen = new Set(), out = [];
  for (const [card] of map) { if (seen.has(card)) continue; const grp = [], st = [card]; seen.add(card);
    while (st.length) { const c = st.pop(); grp.push(c); for (const n of neighbors(b, c, map.get(c))) if (!seen.has(n) && n.r === card.r) { seen.add(n); st.push(n); } }
    out.push({ key: card.r, cards: grp }); }
  return { clusters: out, map };
}
function detect(b, rules = {}) {
  const { clusters, map } = rankClusters(b), hands = [];
  const of = new Map(); clusters.forEach(cl => cl.cards.forEach(c => of.set(c, cl)));
  const touching = (a, o) => a.cards.some(c => [...neighbors(b, c, map.get(c))].some(n => of.get(n) === o));
  const used = new Set();
  for (const cl of clusters) {
    const n = cl.cards.length; if (n < 3) continue;
    if (n >= 5) { hands.push({ key: 'five', cards: cl.cards, ranks: [cl.key] }); continue; }
    if (n === 4) { hands.push({ key: 'four', cards: cl.cards, ranks: [cl.key] }); continue; }
    const pair = clusters.find(o => o !== cl && o.cards.length === 2 && !used.has(o) && touching(cl, o));
    if (pair) { used.add(pair); hands.push({ key: 'fullHouse', cards: [...cl.cards, ...pair.cards], ranks: [cl.key] }); }
    else hands.push({ key: 'triple', cards: cl.cards, ranks: [cl.key] });
  }
  const pairs = clusters.filter(cl => cl.cards.length === 2 && !used.has(cl));
  for (const a of pairs) { if (used.has(a)) continue;
    const o = pairs.find(p => p !== a && !used.has(p) && p.key !== a.key && touching(a, p));
    if (o) { used.add(a); used.add(o); hands.push({ key: 'twoPair', cards: [...a.cards, ...o.cards], ranks: [a.key, o.key] }); } }
  hands.forEach(h => { const H0 = HANDS[h.key]; h.name = H0.name; h.mult = H0.mult;
    h.flush = !rules.noFlush && h.cards.every(c => c.s === h.cards[0].s); if (h.flush) h.mult *= 2;
    h.chips = H0.chips + h.cards.reduce((s, c) => s + (rules.noRed && (c.s === '♥' || c.s === '♦') ? 0 : chipOf(c.r)), 0); h.score = h.chips * h.mult;
    h.cells = h.cards.flatMap(c => map.get(c)); });
  return hands;
}
function chainStraight(rankSteps) {
  if (rankSteps.length < 3) return 0;
  let up = new Map(), down = new Map(), best = 0;
  rankSteps.forEach((set, i) => { const nu = new Map(), nd = new Map();
    for (const r of set) { const u = i && up.has(r - 1) ? up.get(r - 1) + 1 : 1, d = i && down.has(r + 1) ? down.get(r + 1) + 1 : 1; nu.set(r, u); nd.set(r, d); if (i === rankSteps.length - 1) best = Math.max(best, u, d); }
    up = nu; down = nd; });
  return best >= 3 ? best : 0;
}
function removeHands(b, hands) { hands.forEach(h => h.cells.forEach(([x, y]) => b[y][x] = null)); }
function simulate(board, rules) {
  const b = board.map(r => r.slice()); settle(b); let chain = 0, total = 0; const steps = [], rankSteps = [];
  while (true) {
    const hands = detect(b, rules); if (!hands.length) break;
    chain++; rankSteps.push(new Set(hands.flatMap(h => h.ranks))); const st = chainStraight(rankSteps);
    const sc = hands.reduce((s, h) => s + h.score, 0) * chain * (st || 1); total += sc;
    steps.push({ chain, hands: hands.map(h => h.name + (h.flush ? '·플러시' : '')), score: sc, cells: hands.flatMap(h => h.cells.map(([x, y]) => x + ',' + y)), straight: st });
    removeHands(b, hands); settle(b);
  }
  return { chain, total, steps, board: b };
}

// ---------------------------------------------------------------- 라운드
const ROUNDS = [
  { target: 400 }, { target: 700 }, { target: 1000, boss: 'noHold' },
  { target: 1400 }, { target: 1850 }, { target: 2150, boss: 'noRed' },
  { target: 2650 }, { target: 3200, boss: 'noFlush' },
];
const BOSS_TEXT = { noHold: '보스: 보관(HOLD) 금지', noRed: '보스: 빨간 카드(♥♦)는 칩 0', noFlush: '보스: 플러시 보너스 없음' };
const PIECES_PER_ROUND = 40;
const CHAIN_STEP = .3;

let S;
function newRun() { S = { round: 0, totalScore: 0, best: null, started: S ? S.started : false, time: 0 }; startRound(); }
function startRound() {
  Object.assign(S, {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    deck: [], bag: [], next: [], hold: null, canHold: true, piece: null,
    score: 0, piecesLeft: PIECES_PER_ROUND, bursts: 0, maxChain: 0, lastResult: null,
    dropT: 0, lockT: 0, lockMoves: 0, phase: 'play', chainT: 0, chain: 0, chainScore: 0, chainHands: [], rankSteps: [],
    fx: [], texts: [], paused: false,
  });
  for (let i = 0; i < 3; i++) S.next.push(makePiece());
  spawnPiece();
}
const rules = () => { const b = ROUNDS[S.round].boss; return { noRed: b === 'noRed', noFlush: b === 'noFlush', noHold: b === 'noHold' }; };
function drawCard() {
  if (!S.deck.length) { for (let k = 0; k < DECK_COPIES; k++) for (const s of SUITS) for (const r of RANKS) S.deck.push({ r, s }); for (let i = S.deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.deck[i], S.deck[j]] = [S.deck[j], S.deck[i]]; } }
  const c = S.deck.pop(); return { r: c.r, s: c.s }; // 판 위에서 카드마다 다른 객체
}
function fromBag() {
  if (!S.bag.length) { S.bag = Object.keys(BASE); for (let i = S.bag.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [S.bag[i], S.bag[j]] = [S.bag[j], S.bag[i]]; } }
  return S.bag.pop();
}
function makePiece() { return { t: fromBag(), cards: [drawCard(), drawCard()] }; }
function spawnPiece() {
  if (S.piecesLeft <= 0) { endRound(); return; }
  const p = S.next.shift(); while (S.next.length < 3) S.next.push(makePiece());
  S.piece = { ...p, r: 0, x: 3, y: p.t === 'I' ? -1 : 0 }; S.dropT = 0; S.lockT = 0; S.lockMoves = 0;
  if (collide(S.piece, S.piece.x, S.piece.y, S.piece.r)) { S.phase = 'over'; S.overWhy = '카드가 천장에 닿았다'; }
}
const cellsOf = (p, x = p.x, y = p.y, r = p.r) => SHAPES[p.t][r].map(([dx, dy]) => [x + dx, y + dy]);
const cardAt = (p, i) => p.cards[i < 2 ? 0 : 1];
const collide = (p, x, y, r) => cellsOf(p, x, y, r).some(([cx, cy]) => cx < 0 || cx >= COLS || cy >= ROWS || cy < 0 || S.board[cy][cx]);
function landing(p) {
  let y = p.y; while (!collide(p, p.x, y + 1, p.r)) y++;
  const b = S.board.map(r => r.slice()); cellsOf(p, p.x, y).forEach(([x, yy], i) => b[yy][x] = cardAt(p, i));
  settle(b); const m = cardsOf(b);
  return { y, pos: [m.get(p.cards[0]) || [], m.get(p.cards[1]) || []], board: b };
}

// ---------------------------------------------------------------- 조작
const gravity = () => Math.max(.22, .9 - S.round * .08);
const onGround = () => collide(S.piece, S.piece.x, S.piece.y + 1, S.piece.r);
function touchLock() { if (S.piece && onGround() && S.lockMoves < 15) { S.lockT = 0; S.lockMoves++; } }
function move(dx) { const p = S.piece; if (S.phase === 'play' && p && !collide(p, p.x + dx, p.y, p.r)) { p.x += dx; touchLock(); } }
function softDrop() { const p = S.piece; if (S.phase === 'play' && p && !onGround()) { p.y++; S.dropT = 0; } }
function rotate(dir) {
  const p = S.piece; if (S.phase !== 'play' || !p) return; const nr = (p.r + dir + 4) % 4;
  for (const [kx, ky] of KICKS) if (!collide(p, p.x + kx, p.y + ky, nr)) { p.x += kx; p.y += ky; p.r = nr; touchLock(); return; }
}
function holdPiece() {
  if (S.phase !== 'play' || !S.canHold) return;
  if (rules().noHold) { popText('보관 금지 라운드', 4.5, 2, '#ff6a6a'); return; }
  const cur = { t: S.piece.t, cards: S.piece.cards };
  if (S.hold) { const h = S.hold; S.hold = cur; S.piece = { ...h, r: 0, x: 3, y: h.t === 'I' ? -1 : 0 }; } else { S.hold = cur; const left = S.piecesLeft; S.piecesLeft++; spawnPiece(); S.piecesLeft = left; }
  S.canHold = false;
}
function preview() { const p = S.piece; if (!p) return null; const L = landing(p); return { ...L, ...simulate(L.board, rules()) }; }
function drop() { if (S.phase !== 'play' || !S.piece) return; while (!onGround()) S.piece.y++; lockPiece(); }
function lockPiece() {
  const p = S.piece;
  cellsOf(p).forEach(([x, yy], i) => S.board[yy][x] = cardAt(p, i));
  S.piece = null; S.canHold = true; S.piecesLeft--;
  settle(S.board);
  S.chain = 0; S.chainScore = 0; S.chainHands = []; S.rankSteps = [];
  chainStep();
}
function chainStep() {
  const hands = detect(S.board, rules());
  if (!hands.length) {
    if (S.chain > 0) { S.lastResult = { chain: S.chain, total: S.chainScore, hands: S.chainHands }; if (!S.best || S.chainScore > S.best.total) S.best = { total: S.chainScore, chain: S.chain }; }
    S.phase = 'play'; afterTurn(); return;
  }
  S.chain++; S.maxChain = Math.max(S.maxChain, S.chain);
  S.rankSteps.push(new Set(hands.flatMap(h => h.ranks))); const st = chainStraight(S.rankSteps);
  const sc = hands.reduce((s, h) => s + h.score, 0) * S.chain * (st || 1);
  if (st) popText(`연쇄 스트레이트 ${st}  ×${st}`, COLS / 2 - .5, 1.5, '#7fd6ff');
  S.score += sc; S.totalScore += sc; S.chainScore += sc; S.bursts += hands.length; hands.forEach(h => S.chainHands.push(h.name + (h.flush ? '·플러시' : '')));
  const map = cardsOf(S.board);
  S.fx.push({ kind: 'burst', cards: hands.flatMap(h => h.cards.map(c => ({ c, cells: map.get(c) }))), t: .5 });
  hands.forEach(h => { const [cx, cy] = h.cells.reduce((a, [x, y]) => [a[0] + x / h.cells.length, a[1] + y / h.cells.length], [0, 0]); popText(`${h.name}${h.flush ? ' 플러시' : ''}  ${h.chips}×${h.mult}`, cx, cy - .3, h.flush ? '#ff9ad5' : '#ffd96a'); });
  S.texts = S.texts.filter(t => !t.big);
  S.texts.push({ s: `+${sc.toLocaleString()}${S.chain > 1 ? `   ${S.chain} 연쇄 ×${S.chain}` : ''}`, x: COLS / 2 - .5, y: -0.4, t: 1.1, col: S.chain > 1 ? '#9cffb0' : '#ffffff', big: true });
  removeHands(S.board, hands); settle(S.board);
  S.phase = 'chain'; S.chainT = CHAIN_STEP;
}
function update(dt) {
  if (S.paused) return;
  if (S.phase === 'chain') { S.chainT -= dt; if (S.chainT <= 0) chainStep(); return; }
  if (S.phase !== 'play' || !S.piece) return;
  for (const k of ['ArrowLeft', 'ArrowRight', 'ArrowDown']) if (keys[k]) { rep[k] = (rep[k] ?? 0) - dt; if (rep[k] <= 0) { rep[k] = k === 'ArrowDown' ? .04 : .05; if (k === 'ArrowDown') softDrop(); else move(k === 'ArrowLeft' ? -1 : 1); } }
  S.dropT += dt;
  if (S.dropT >= gravity()) { S.dropT = 0; if (!onGround()) S.piece.y++; }
  if (onGround()) { S.lockT += dt; if (S.lockT >= .5) lockPiece(); } else S.lockT = 0;
}
function afterTurn() {
  if (S.score >= ROUNDS[S.round].target) { S.phase = 'clear'; S.bonus = S.piecesLeft; return; }
  if (S.piecesLeft <= 0) { endRound(); return; }
  spawnPiece();
}
function endRound() { if (S.score >= ROUNDS[S.round].target) { S.phase = 'clear'; S.bonus = 0; } else { S.phase = 'over'; S.overWhy = `블록 ${PIECES_PER_ROUND}개를 다 썼지만 목표 점수에 못 미쳤다`; } }
function nextRound() { if (S.phase !== 'clear') return; S.round++; if (S.round >= ROUNDS.length) { S.phase = 'win'; return; } startRound(); }
function popText(s, x, y, col) { S.texts.push({ s, x, y, t: 1.2, col }); }

// ---------------------------------------------------------------- 그리기
const X = x => OX + x * CELL, Y = y => OY + y * CELL;
const glow = (col, b = 10) => { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = b; };
function text(s, x, y, col = '#cfd8e6', size = 13, align = 'left', weight = '') { g.shadowBlur = 0; g.fillStyle = col; g.font = `${weight} ${size}px "DejaVu Sans Mono", "Noto Sans KR", monospace`; g.textAlign = align; g.fillText(s, x, y); g.textAlign = 'left'; }
function panel(x, y, w, h) { g.shadowBlur = 0; g.strokeStyle = 'rgba(127,214,255,.3)'; g.lineWidth = 1; g.strokeRect(x, y, w, h); }
// 카드 한 장을 칸 두 개에 걸쳐 그린다 (세로 카드 또는 가로 카드)
function cardRect(px, py, w, h, card, o = {}) {
  const a = o.alpha ?? 1; g.globalAlpha = a; const col = card ? SUIT_COL[card.s] : '#7fd6ff';
  g.lineWidth = o.hot ? 2.4 : 1.6; glow(o.hot ? '#ffffff' : col, o.hot ? 20 : 8); if (o.dash) g.setLineDash([4, 4]);
  g.beginPath(); if (g.roundRect) g.roundRect(px + 3, py + 3, w - 6, h - 6, 6); else g.rect(px + 3, py + 3, w - 6, h - 6); g.stroke(); g.setLineDash([]);
  if (card && !o.dash) {
    const s = Math.min(w, h); g.shadowColor = col; g.shadowBlur = o.hot ? 12 : 5; g.fillStyle = col;
    if (h > w) { // 세로 카드: 위에 숫자, 아래에 무늬
      g.textAlign = 'center'; g.font = `bold ${Math.round(s * .62)}px "DejaVu Sans Mono", monospace`; g.fillText(RANK_TXT(card.r), px + w / 2, py + h * .42);
