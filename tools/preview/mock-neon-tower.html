<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neon Tower Mockup</title>
<style>
  html,body{margin:0;width:1280px;height:720px;background:#06060b;overflow:hidden;font-family:"DejaVu Sans Mono","Noto Sans KR",monospace;color:#cfd8e6}
  canvas{position:absolute;inset:0}
  .hud{position:absolute}
  #top{top:22px;left:28px;font-size:15px;line-height:1.8}
  #top .w{font-size:22px;color:#e8f0ff;letter-spacing:1px}
  #top .cash{color:#9cffb0}#top .coin{color:#ffd96a}
  #panel{top:22px;right:24px;width:250px;border:1px solid rgba(127,214,255,.35);padding:12px 14px;font-size:13px}
  #panel .h{color:#7fd6ff;margin-bottom:8px;letter-spacing:2px;font-size:12px}
  .row{display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(207,216,230,.18);padding:7px 9px;margin-bottom:7px}
  .row .lv{color:#8a94a6;font-size:11px}
  .row .cost{color:#9cffb0;border:1px solid rgba(156,255,176,.5);padding:2px 8px}
  .row.off .cost{color:#5a6070;border-color:#2a2f3a}
  #tabs{display:flex;gap:6px;margin-bottom:10px}
  #tabs span{flex:1;text-align:center;border:1px solid rgba(207,216,230,.25);padding:4px 0;font-size:12px;color:#8a94a6}
  #tabs span.on{color:#7fd6ff;border-color:#7fd6ff}
  #hp{bottom:26px;left:50%;transform:translateX(-50%);width:420px;text-align:center;font-size:12px;color:#8a94a6}
  #hp .bar{height:6px;border:1px solid rgba(127,214,255,.5);margin-top:6px}
  #hp .bar i{display:block;height:100%;width:72%;background:#7fd6ff;box-shadow:0 0 8px #7fd6ff}
  #stat{bottom:26px;left:28px;font-size:12px;line-height:1.8;color:#8a94a6}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="top" class="hud"><div class="w">WAVE 23</div><div class="cash">$ 1,240</div><div class="coin">◎ 225</div></div>
<div id="panel" class="hud">
  <div class="h">UPGRADE</div>
  <div id="tabs"><span class="on">공격</span><span>방어</span><span>경제</span></div>
  <div class="row"><div>공격력<div class="lv">Lv 12 · 48</div></div><div class="cost">$85</div></div>
  <div class="row"><div>공격 속도<div class="lv">Lv 9 · 3.2/s</div></div><div class="cost">$120</div></div>
  <div class="row"><div>사거리<div class="lv">Lv 5 · 190</div></div><div class="cost">$200</div></div>
  <div class="row"><div>치명타<div class="lv">Lv 4 · 12%</div></div><div class="cost">$310</div></div>
  <div class="row off"><div>다중 사격<div class="lv">Lv 1 · 1발</div></div><div class="cost">$2,000</div></div>
</div>
<div id="hp" class="hud">TOWER 1,450 / 2,000<div class="bar"><i></i></div></div>
<div id="stat" class="hud">처치 1,382<br>초당 피해 412<br>x2 속도</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
let s = 11; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
const CX = 610, CY = 365;
const glow = (col, b = 10) => { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = b; };
function poly(x, y, r, n, rot = 0) { g.beginPath(); for (let i = 0; i <= n; i++) { const a = rot + i / n * Math.PI * 2; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.stroke(); }
function square(x, y, r, rot = 0) { poly(x, y, r * 1.414, 4, Math.PI / 4 + rot); }

// 희미한 배경 점
g.shadowBlur = 0; g.fillStyle = 'rgba(160,180,220,.12)';
for (let i = 0; i < 160; i++) g.fillRect(rnd() * 1280, rnd() * 720, 1.2, 1.2);

// 사거리 원, 보호막 원
g.lineWidth = 1.2; glow('rgba(90,190,210,.45)', 6); g.beginPath(); g.arc(CX, CY, 190, 0, Math.PI * 2); g.stroke();
g.setLineDash([3, 7]); glow('rgba(156,255,176,.35)', 4); g.beginPath(); g.arc(CX, CY, 62, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);

// 적
const enemies = [];
for (let i = 0; i < 34; i++) {
  const a = rnd() * Math.PI * 2, d = 120 + rnd() * 420;
  const x = CX + Math.cos(a) * d * 1.35, y = CY + Math.sin(a) * d * 0.85;
  if (x < 30 || x > 990 || y < 40 || y > 650) continue;
  const t = rnd(); enemies.push({ x, y, a, d, kind: t < 0.62 ? 'sq' : t < 0.85 ? 'tri' : 'dia' });
}
enemies.push({ x: 300, y: 560, kind: 'boss' });
for (const e of enemies) {
  g.lineWidth = 1.6;
  if (e.kind === 'sq') { glow('#ff8a7a', 8); square(e.x, e.y, 6, rnd() * .6); }
  if (e.kind === 'tri') { glow('#ffd96a', 8); poly(e.x, e.y, 8, 3, Math.atan2(CY - e.y, CX - e.x)); }
  if (e.kind === 'dia') { glow('#c890ff', 9); poly(e.x, e.y, 11, 4, 0); poly(e.x, e.y, 5, 4, 0); }
  if (e.kind === 'boss') { g.lineWidth = 2; glow('#ff6ad5', 16); square(e.x, e.y, 24, .12); g.lineWidth = 1; square(e.x, e.y, 15, .12);
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,106,213,.8)'; g.font = '11px monospace'; g.fillText('BOSS', e.x - 14, e.y - 42);
    g.strokeStyle = 'rgba(255,106,213,.6)'; g.strokeRect(e.x - 30, e.y - 36, 60, 4); g.fillRect(e.x - 30, e.y - 36, 38, 4); }
}

// 사거리 안 표적에게 탄환과 피격 파편
const inRange = enemies.filter(e => Math.hypot(e.x - CX, e.y - CY) < 190).slice(0, 5);
for (const e of inRange) {
  const ang = Math.atan2(e.y - CY, e.x - CX), dist = Math.hypot(e.x - CX, e.y - CY);
  const p0 = 0.35 + rnd() * 0.4;
  const x1 = CX + Math.cos(ang) * dist * p0, y1 = CY + Math.sin(ang) * dist * p0;
  const x2 = CX + Math.cos(ang) * dist * (p0 + 0.18), y2 = CY + Math.sin(ang) * dist * (p0 + 0.18);
  const grad = g.createLinearGradient(x1, y1, x2, y2); grad.addColorStop(0, 'rgba(127,214,255,0)'); grad.addColorStop(1, '#bff0ff');
  g.shadowColor = '#7fd6ff'; g.shadowBlur = 10; g.strokeStyle = grad; g.lineWidth = 2; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
}
const hit = inRange[0];
if (hit) {
  glow('#ff8a7a', 8);
  for (let i = 0; i < 14; i++) { const a = rnd() * 6.28, r = 6 + rnd() * 22; g.fillRect(hit.x + Math.cos(a) * r, hit.y + Math.sin(a) * r, 2.2, 2.2); }
  g.shadowBlur = 0; g.fillStyle = '#ffe9b0'; g.font = 'bold 12px monospace'; g.fillText('96', hit.x + 10, hit.y - 12);
  g.fillStyle = '#ff6a6a'; g.font = 'bold 14px monospace'; g.fillText('192!', hit.x - 30, hit.y - 26);
}
// 다른 곳의 사라지는 파편
glow('#ffd96a', 6); for (let i = 0; i < 10; i++) { g.fillRect(780 + rnd() * 30, 210 + rnd() * 30, 2, 2); }

// 타워 (육각형 이중선 + 코어)
g.lineWidth = 2; glow('#7fd6ff', 18); poly(CX, CY, 24, 6, Math.PI / 6);
g.lineWidth = 1.2; glow('#bff0ff', 8); poly(CX, CY, 14, 6, Math.PI / 6);
g.fillStyle = '#e8f8ff'; g.shadowBlur = 14; g.beginPath(); g.arc(CX, CY, 2.6, 0, 6.28); g.fill();
// 궤도 위성 도형
glow('#9cffb0', 10); g.lineWidth = 1.4; poly(CX + 62, CY, 5, 3, 0); poly(CX - 31, CY - 54, 5, 3, 2); poly(CX - 31, CY + 54, 5, 3, 4);
window.__done = true;
</script>
</body>
</html>
