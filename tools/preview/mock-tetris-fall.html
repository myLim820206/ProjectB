<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Falling Tetris Defense Mockup</title>
<style>
  html,body{margin:0;width:1280px;height:720px;background:#06060b;overflow:hidden;font-family:"DejaVu Sans Mono","Noto Sans KR",monospace;color:#cfd8e6}
  canvas{position:absolute;inset:0}
  .hud{position:absolute;font-size:13px}
  .box{border:1px solid rgba(127,214,255,.35);padding:12px 14px}
  .h{color:#7fd6ff;letter-spacing:2px;font-size:12px;margin-bottom:8px}
  #left{top:60px;left:150px;width:230px;line-height:1.9}
  #left .w{font-size:22px;color:#e8f0ff}
  .bar{height:6px;border:1px solid rgba(127,214,255,.5);margin:4px 0 10px}
  .bar i{display:block;height:100%;background:#7fd6ff;box-shadow:0 0 8px #7fd6ff}
  #right{top:60px;right:150px;width:200px}
  #legend{top:420px;left:150px;width:230px;line-height:1.9;color:#8a94a6;font-size:12px}
  #hint{bottom:18px;left:50%;transform:translateX(-50%);color:#6a7486;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="left" class="hud box">
  <div class="w">WAVE 07</div>
  CORE 16 / 20<div class="bar"><i style="width:80%"></i></div>
  <span style="color:#8a94a6">SCORE</span> 48,210<br>
  <span style="color:#8a94a6">LINES</span> 34<br>
  <span style="color:#8a94a6">처치</span> 152<br>
  <span style="color:#ffd96a">COMBO x3</span>
</div>
<div id="legend" class="hud box">
  <div class="h">HOW</div>
  ▼ 블록으로 적을 깔아뭉갠다<br>
  ═ 줄을 지우면 포탑 생성, 강화<br>
  ◎ 포탑 칸이 근처 적을 쏜다<br>
  ▢ 구멍은 적이 내려가는 길
</div>
<div id="right" class="hud box"><div class="h">NEXT</div><div style="height:230px"></div><div class="h">HOLD</div><div style="height:70px"></div></div>
<div id="hint" class="hud">[← →] 이동 · [↑] 회전 · [↓] 빠르게 · [Space] 떨어뜨리기 · [C] 보관</div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const COLS = 10, ROWS = 20, CELL = 30, OX = 490, OY = 40;
const COL = { I: '#7fd6ff', O: '#ffd96a', T: '#c890ff', S: '#9cffb0', Z: '#ff8a7a', L: '#ffb36a', J: '#6a9cff' };
// 아래쪽 쌓인 블록 (12행부터). 소문자 = 포탑 칸
const stack = {
  12: '........Z.',
  13: '.T......ZZ',
  14: 'TTt..O..JZ',
  15: 'SS.IIiIOOJ',
  16: '.SSLLLj.JJ',
  17: 'ZZlL.OOTTT',
  18: 'IIIIZZOOTJ',
  19: 'JJ.LLLSSoO',
};
const CLEAR = 18;
const glow = (col, b = 10) => { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = b; };
const X = x => OX + x * CELL, Y = y => OY + y * CELL, CXc = x => X(x) + CELL / 2, CYc = y => Y(y) + CELL / 2;

// 우물 테두리와 희미한 격자
g.lineWidth = 1; g.strokeStyle = 'rgba(120,140,180,.08)';
for (let x = 1; x < COLS; x++) { g.beginPath(); g.moveTo(X(x), OY); g.lineTo(X(x), Y(ROWS)); g.stroke(); }
for (let y = 1; y < ROWS; y++) { g.beginPath(); g.moveTo(OX, Y(y)); g.lineTo(X(COLS), Y(y)); g.stroke(); }
g.lineWidth = 1.5; glow('rgba(127,214,255,.55)', 8);
g.beginPath(); g.moveTo(OX, OY); g.lineTo(OX, Y(ROWS)); g.moveTo(X(COLS), OY); g.lineTo(X(COLS), Y(ROWS)); g.stroke();

function cell(x, y, col, opt = {}) {
  g.globalAlpha = opt.alpha ?? 1; g.lineWidth = 1.5; glow(col, opt.blur ?? 9); if (opt.dash) g.setLineDash([3, 4]);
  g.strokeRect(X(x) + 3, Y(y) + 3, CELL - 6, CELL - 6); g.setLineDash([]);
  if (!opt.dash) { g.shadowBlur = 0; g.globalAlpha = (opt.alpha ?? 1) * .25; g.strokeRect(X(x) + 8, Y(y) + 8, CELL - 16, CELL - 16); }
  g.globalAlpha = 1;
}
const turretCells = [];
for (const [r, row] of Object.entries(stack)) [...row].forEach((ch, x) => {
  if (ch === '.') return; const t = ch.toUpperCase(); const y = +r;
  if (y === CLEAR) cell(x, y, '#ffffff', { blur: 22, alpha: .95 }); else cell(x, y, COL[t]);
  if (ch !== t && y !== CLEAR) turretCells.push([x, y]);
});
// 지워지는 줄의 빛 띠
{ const y = CYc(CLEAR); const gr = g.createLinearGradient(OX - 60, 0, X(COLS) + 60, 0);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.shadowBlur = 0; g.fillStyle = gr; g.fillRect(OX - 60, Y(CLEAR) - 6, COLS * CELL + 120, CELL + 12);
    g.shadowBlur = 0; g.fillStyle = '#ffffff'; g.font = 'bold 15px monospace'; g.fillText('LINE!', X(COLS) + 14, y - 4);
  g.fillStyle = '#ffd96a'; g.font = '12px monospace'; g.fillText('포탑 게이지 2 / 3', X(COLS) + 14, y + 14);
  g.fillStyle = '#8a94a6'; g.fillText('줄 안 포탑 → 다음 조각으로', X(COLS) + 14, y + 32); }
// 포탑 표시
turretCells.forEach(([x, y]) => { glow('#e8f8ff', 12); g.lineWidth = 1.5; g.beginPath(); g.arc(CXc(x), CYc(y), 5.5, 0, 6.28); g.stroke(); g.beginPath(); g.arc(CXc(x), CYc(y), 1.6, 0, 6.28); g.fill(); });

// 적
function sq(x, y, r) { g.strokeRect(x - r, y - r, r * 2, r * 2); }
function tri(x, y, r) { g.beginPath(); g.moveTo(x, y + r); g.lineTo(x - r, y - r * .7); g.lineTo(x + r, y - r * .7); g.closePath(); g.stroke(); }
function dia(x, y, r) { g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.stroke(); }
const foes = [[1, 12, 'sq'], [8, 11, 'tri'], [3, 14, 'sq'], [5, 13, 'dia'], [6, 14, 'sq'], [2, 19, 'sq'], [2, 1, 'tri'], [7, 2, 'sq'], [0, 16, 'sq']];
foes.forEach(([x, y, t]) => { g.lineWidth = 1.6; const px = CXc(x), py = CYc(y) + 3;
  if (t === 'sq') { glow('#ff8a7a', 8); sq(px, py, 6); } if (t === 'tri') { glow('#ffd96a', 8); tri(px, py, 7); } if (t === 'dia') { glow('#ff6ad5', 10); dia(px, py, 9); dia(px, py, 4); } });
// 바닥 가까이 내려간 적: 위험 표시
{ const px = CXc(2), py = CYc(19); g.lineWidth = 1.2; glow('rgba(255,90,90,.8)', 12); g.beginPath(); g.arc(px, py + 3, 13, 0, 6.28); g.stroke();
  g.shadowBlur = 0; g.fillStyle = '#ff6a6a'; g.font = 'bold 12px monospace'; g.fillText('!', px - 3, py - 14); }
// 입구 (위쪽)
[2, 7].forEach(x => { glow('#ff8a7a', 10); g.lineWidth = 1.4; g.beginPath(); g.moveTo(CXc(x) - 9, OY - 12); g.lineTo(CXc(x), OY - 4); g.lineTo(CXc(x) + 9, OY - 12); g.stroke(); });

// 떨어지는 T 블록과 착지 그림자
const fall = [[4, 5], [5, 5], [6, 5], [5, 6]], land = [[4, 12], [5, 12], [6, 12], [5, 13]];
land.forEach(([x, y]) => cell(x, y, COL.T, { alpha: .5, dash: true }));
fall.forEach(([x, y]) => cell(x, y, COL.T, { blur: 16 }));
// 포탑이 달린 칸 (떨어지는 블록 가운데)
glow('#e8f8ff', 12); g.lineWidth = 1.5; g.beginPath(); g.arc(CXc(5), CYc(5), 5.5, 0, 6.28); g.stroke();
// 낙하 궤적
g.setLineDash([2, 6]); glow('rgba(200,144,255,.35)', 4); g.lineWidth = 1; [4, 5, 6].forEach(x => { g.beginPath(); g.moveTo(CXc(x), Y(6) + (x === 5 ? CELL : 0)); g.lineTo(CXc(x), Y(12)); g.stroke(); }); g.setLineDash([]);
// 깔아뭉개기 표시
{ const px = CXc(5), py = CYc(13); g.lineWidth = 1.2; glow('rgba(255,217,106,.9)', 10); g.beginPath(); g.arc(px, py + 3, 14, 0, 6.28); g.stroke();
  g.shadowBlur = 0; g.fillStyle = '#ffd96a'; g.font = 'bold 13px monospace'; g.fillText('CRUSH ▼', X(COLS) + 14, CYc(12)); 
  g.strokeStyle = 'rgba(255,217,106,.5)'; g.lineWidth = 1; g.beginPath(); g.moveTo(X(COLS) + 10, CYc(12) - 4); g.lineTo(px + 16, py); g.stroke(); }

// 포탑 사격
function shot(tx, ty, ex, ey) { const ax = CXc(tx), ay = CYc(ty), bx = CXc(ex), by = CYc(ey) + 3;
  const mx = ax + (bx - ax) * .45, my = ay + (by - ay) * .45, nx = ax + (bx - ax) * .85, ny = ay + (by - ay) * .85;
  const gr = g.createLinearGradient(mx, my, nx, ny); gr.addColorStop(0, 'rgba(191,240,255,0)'); gr.addColorStop(1, '#bff0ff');
  g.strokeStyle = gr; g.shadowColor = '#7fd6ff'; g.shadowBlur = 10; g.lineWidth = 2; g.beginPath(); g.moveTo(mx, my); g.lineTo(nx, ny); g.stroke(); }
shot(2, 14, 3, 14); shot(2, 14, 1, 12); shot(5, 15, 6, 14); shot(2, 17, 0, 16);
g.shadowBlur = 0; g.fillStyle = '#ffe9b0'; g.font = 'bold 11px monospace'; g.fillText('32', CXc(3) + 8, CYc(14) - 8);

// 바닥의 핵
{ const y = Y(ROWS) + 10; g.lineWidth = 2; glow('#7fd6ff', 16); g.beginPath(); g.moveTo(OX - 10, y); g.lineTo(X(COLS) + 10, y); g.stroke();
  const cx = OX + COLS * CELL / 2, cy = y + 22; g.beginPath(); for (let i = 0; i <= 6; i++) { const a = Math.PI / 6 + i / 6 * 6.283; g.lineTo(cx + Math.cos(a) * 12, cy + Math.sin(a) * 12); } g.stroke();
  g.shadowBlur = 0; g.fillStyle = '#7fd6ff'; g.font = '11px monospace'; g.fillText('CORE', cx + 20, cy + 4); }

// NEXT, HOLD 미니 조각
function mini(t, cells, x0, y0, s = 15) { cells.forEach(([x, y]) => { g.lineWidth = 1.4; glow(COL[t], 8); g.strokeRect(x0 + x * s + 2, y0 + y * s + 2, s - 4, s - 4); }); }
mini('I', [[0, 0], [1, 0], [2, 0], [3, 0]], 960, 110);
mini('S', [[1, 0], [2, 0], [0, 1], [1, 1]], 968, 170);
mini('L', [[0, 0], [0, 1], [0, 2], [1, 2]], 975, 230);
mini('O', [[0, 0], [1, 0], [0, 1], [1, 1]], 975, 355);
window.__done = true;
</script>
</body>
</html>
